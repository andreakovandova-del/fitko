// ===== src/app/storage.js =====
// Úložiště: localStorage (rychlé, per zařízení) + samo-publikace artifactu (trvalé, přežije
// i ztrátu telefonu — stav je vložený přímo v HTML stránky). Publikace RELOADUJE otevřený
// pohled, proto se volá jen na bezpečných hranicích (konec tréninku, onboarding, vážení),
// nikdy uprostřed zápisu série. Záloha: export/import JSON.

const STORAGE_KEY = 'fitko-state-v1';
const BACKUP_KEY = 'fitko-state-backup-v1';
const STATE_SCRIPT_RE = /(<script type="application\/json" id="fitko-state">)[\s\S]*?(<\/script>)/;

let originalHtml = null; // snímek dokumentu před prvním renderem — šablona pro publish
let artifactNs;          // Promise<namespace|null>
let downloadsNs;

const storageInfo = {
  localOk: false, artifactOk: null, lastPublish: null, publishError: null,
  hadStoredData: false, damagedFound: false, persisted: null,
};

// Jakmile jednou uvidíme uložené tréninky, prázdný stav je už NIKDY nesmí přepsat.
let hadStoredData = false;

function captureDocument() {
  originalHtml = `<!doctype html>\n${document.documentElement.outerHTML}`;
}

function initCapabilities() {
  const use = (name) => {
    try {
      if (typeof window !== 'undefined' && window.claude?.use) return window.claude.use(name);
    } catch { /* mimo artifact runtime */ }
    return Promise.resolve(null);
  };
  artifactNs = use('artifact');
  downloadsNs = use('downloads');
  artifactNs.then((ns) => { storageInfo.artifactOk = ns != null; });
}

function detectLocal() {
  try {
    localStorage.setItem('fitko-probe', '1');
    localStorage.removeItem('fitko-probe');
    return true;
  } catch { return false; }
}

function loadPersistedState() {
  storageInfo.localOk = detectLocal();

  let embedded = null;
  try {
    const node = document.getElementById('fitko-state');
    if (node) {
      const parsed = JSON.parse(node.textContent);
      if (!parsed.__empty) embedded = parsed;
    }
  } catch { embedded = null; }

  let local = null;
  if (storageInfo.localOk) {
    const raw = localStorage.getItem(STORAGE_KEY);
    if (raw) {
      try {
        local = JSON.parse(raw);
      } catch {
        // Poškozený zápis nesmíme přepsat — uschováme ho stranou k případné záchraně.
        try { localStorage.setItem(`fitko-state-damaged-${Date.now()}`, raw); } catch { /* plno */ }
        storageInfo.damagedFound = true;
        local = null;
      }
    }
  }

  const chosen = local && embedded
    ? ((local.updatedAt ?? '') >= (embedded.updatedAt ?? '') ? local : embedded)
    : (local ?? embedded ?? null);

  // Zapamatuj si, že v zařízení JSOU data (i když je zrovna nešlo načíst) —
  // saveLocal pak odmítne přepsat je prázdným stavem.
  hadStoredData = !!(chosen?.sessions?.length) || storageInfo.damagedFound
    || !!(readBackup()?.state?.sessions?.length);
  storageInfo.hadStoredData = hadStoredData;

  try { navigator.storage?.persisted?.().then((p) => { storageInfo.persisted = p; }); } catch { /* nepodstatné */ }

  return chosen;
}

/**
 * Pojistka: snímek stavu, jak vypadal PŘED tímhle spuštěním appky.
 * Kdyby cokoli (nová verze, chyba, omylem smazaná data) rozbilo aktuální stav,
 * odcvičené tréninky jdou vrátit z Nastavení. Ukládá se jen neprázdný stav.
 */
function backupState(state) {
  if (!storageInfo.localOk || !state?.sessions?.length) return;
  try {
    localStorage.setItem(BACKUP_KEY, JSON.stringify({ savedAt: new Date().toISOString(), state }));
  } catch { /* plné úložiště — záloha není kritická */ }
}

function readBackup() {
  if (!storageInfo.localOk) return null;
  try {
    const parsed = JSON.parse(localStorage.getItem(BACKUP_KEY) ?? 'null');
    return parsed?.state?.profile && Array.isArray(parsed.state.sessions) ? parsed : null;
  } catch { return null; }
}

function saveLocal(state, { force = false } = {}) {
  if (!storageInfo.localOk) return;
  // TVRDÁ POJISTKA: stav bez odcvičených tréninků nikdy nepřepíše uložená data.
  // (Selhalo načtení, jiné okno v onboardingu, chyba při startu… data mají přednost.)
  if (!force && hadStoredData && !state?.sessions?.length) return;
  try {
    localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
    if (state?.sessions?.length) { hadStoredData = true; storageInfo.hadStoredData = true; }
  } catch { storageInfo.localOk = false; }
}

/**
 * Prohledá úložiště zařízení na VŠECHNY záznamy Fitka (hlavní stav, automatická
 * záloha, poškozené i staré zápisy) a vrátí, co se z nich dá zachránit.
 */
function scanStoredStates() {
  if (!storageInfo.localOk) return [];
  const out = [];
  let keys = [];
  try { keys = Object.keys(localStorage).filter((k) => k.startsWith('fitko-')); } catch { return []; }
  for (const key of keys) {
    let raw = '';
    try { raw = localStorage.getItem(key) ?? ''; } catch { continue; }
    if (!raw || raw.length < 40) continue;
    let state = null;
    try {
      const parsed = JSON.parse(raw);
      state = parsed?.state?.profile ? parsed.state : (parsed?.profile ? parsed : null);
    } catch { state = null; }
    out.push({
      key,
      sizeKb: Math.round(raw.length / 1024),
      sessions: state?.sessions?.length ?? 0,
      lastDate: state?.sessions?.length ? state.sessions[state.sessions.length - 1].date : null,
      readable: !!state,
      state,
    });
  }
  return out.sort((a, b) => b.sessions - a.sessions || b.sizeKb - a.sizeKb);
}

// Vědomé smazání všeho uživatelem — jediná cesta, jak pojistku obejít.
function wipeAllData() {
  hadStoredData = false;
  storageInfo.hadStoredData = false;
  try {
    for (const key of Object.keys(localStorage)) {
      if (key.startsWith('fitko-')) localStorage.removeItem(key);
    }
  } catch { /* noop */ }
}

function escapeForScriptTag(json) {
  return json.replace(/</g, '\\u003c');
}

// Publikace nové verze artifactu se stavem vloženým do HTML. Reloaduje stránku!
async function publishState(state) {
  const ns = await artifactNs;
  if (!ns || !originalHtml) return { ok: false, reason: 'unavailable' };
  const json = escapeForScriptTag(JSON.stringify(state));
  const html = originalHtml.replace(STATE_SCRIPT_RE, (m, open, close) => `${open}${json}${close}`);
  try {
    await ns.publish(html);
    storageInfo.lastPublish = new Date().toISOString();
    return { ok: true };
  } catch (err) {
    storageInfo.publishError = err?.code ?? String(err);
    // conflict → jiný pohled publikoval první, stránka se sama reloadne na vítěze
    return { ok: false, reason: storageInfo.publishError };
  }
}

async function exportJSON(state) {
  const data = JSON.stringify(state, null, 2);
  const filename = `fitko-zaloha-${(state.updatedAt ?? '').slice(0, 10) || 'export'}.json`;
  const ns = await downloadsNs;
  if (ns) {
    try {
      await ns.save({ filename, data });
      return { ok: true, via: 'downloads' };
    } catch { /* pokračuj fallbackem */ }
  }
  try {
    await navigator.clipboard.writeText(data);
    return { ok: true, via: 'clipboard' };
  } catch {
    return { ok: false, data };
  }
}

function parseImportedJSON(text) {
  const parsed = JSON.parse(text);
  if (typeof parsed !== 'object' || parsed == null || !parsed.profile || !parsed.version) {
    throw new Error('Tohle nevypadá jako záloha Fitka.');
  }
  return parsed;
}


// ===== src/app/cloud.js =====
// Automatická záloha na GitHub (privátní gist). Bez serveru: appka mluví přímo
// s GitHub API tvým osobním tokenem. Token žije JEN v tomhle zařízení
// (localStorage, mimo stav) — nikdy se neposílá nikam jinam a není v exportu dat.

const TOKEN_KEY = 'fitko-gh-token';
const GIST_KEY = 'fitko-gh-gist';
const SYNC_KEY = 'fitko-gh-lastsync';
const FILENAME = 'fitko-zaloha.json';
const DEBOUNCE_MS = 8000;

const cloudInfo = { enabled: false, syncing: false, lastSync: null, lastError: null };

function ls(key) { try { return localStorage.getItem(key) ?? ''; } catch { return ''; } }
function lsSet(key, value) { try { localStorage.setItem(key, value); } catch { /* plno */ } }
function lsDel(key) { try { localStorage.removeItem(key); } catch { /* noop */ } }

function cloudToken() { return ls(TOKEN_KEY); }
function cloudEnabled() { return !!cloudToken(); }

function initCloud() {
  cloudInfo.enabled = cloudEnabled();
  cloudInfo.lastSync = ls(SYNC_KEY) || null;
}

function setCloudToken(token) {
  const clean = (token ?? '').trim();
  if (clean) lsSet(TOKEN_KEY, clean); else lsDel(TOKEN_KEY);
  cloudInfo.enabled = !!clean;
  cloudInfo.lastError = null;
}

function disableCloud() {
  lsDel(TOKEN_KEY);
  lsDel(GIST_KEY);
  lsDel(SYNC_KEY);
  cloudInfo.enabled = false;
  cloudInfo.lastSync = null;
  cloudInfo.lastError = null;
}

async function api(path, options = {}) {
  const token = cloudToken();
  if (!token) throw new Error('Chybí token');
  const res = await fetch(`https://api.github.com${path}`, {
    ...options,
    headers: {
      Accept: 'application/vnd.github+json',
      Authorization: `Bearer ${token}`,
      'X-GitHub-Api-Version': '2022-11-28',
      'Content-Type': 'application/json',
    },
  });
  if (res.status === 401) throw new Error('Token neplatí (401)');
  if (res.status === 403) throw new Error('Token nemá právo na gisty (403)');
  if (res.status === 404) throw new Error('Záloha nenalezena (404)');
  if (!res.ok) throw new Error(`GitHub odpověděl ${res.status}`);
  return res.json();
}

/** Nahraje aktuální stav do privátního gistu (poprvé ho založí). */
async function cloudBackup(state) {
  if (!cloudEnabled() || cloudInfo.syncing) return { ok: false, reason: 'off' };
  cloudInfo.syncing = true;
  try {
    const files = { [FILENAME]: { content: JSON.stringify(state, null, 1) } };
    const id = ls(GIST_KEY);
    let gist;
    if (id) {
      gist = await api(`/gists/${id}`, { method: 'PATCH', body: JSON.stringify({ files }) });
    } else {
      gist = await api('/gists', {
        method: 'POST',
        body: JSON.stringify({ description: 'Fitko — automatická záloha tréninků', public: false, files }),
      });
      lsSet(GIST_KEY, gist.id);
    }
    cloudInfo.lastSync = new Date().toISOString();
    cloudInfo.lastError = null;
    lsSet(SYNC_KEY, cloudInfo.lastSync);
    return { ok: true, gistId: gist.id };
  } catch (err) {
    cloudInfo.lastError = err?.message ?? String(err);
    return { ok: false, reason: cloudInfo.lastError };
  } finally {
    cloudInfo.syncing = false;
  }
}

/** Stáhne poslední zálohu z GitHubu (najde gist i po přeinstalaci telefonu). */
async function cloudRestore() {
  if (!cloudEnabled()) return { ok: false, reason: 'Nejdřív zapni zálohu tokenem' };
  try {
    let id = ls(GIST_KEY);
    if (!id) {
      const list = await api('/gists?per_page=100');
      const found = list.find((g) => g.files && g.files[FILENAME]);
      if (!found) return { ok: false, reason: 'Na GitHubu zatím žádná záloha není' };
      id = found.id;
      lsSet(GIST_KEY, id);
    }
    const gist = await api(`/gists/${id}`);
    const file = gist.files?.[FILENAME];
    if (!file) return { ok: false, reason: 'Záloha v gistu chybí' };
    const content = file.truncated && file.raw_url
      ? await (await fetch(file.raw_url)).text()
      : file.content;
    const state = JSON.parse(content);
    if (!state?.profile || !Array.isArray(state.sessions)) return { ok: false, reason: 'Záloha je poškozená' };
    return { ok: true, state, updatedAt: gist.updated_at };
  } catch (err) {
    return { ok: false, reason: err?.message ?? String(err) };
  }
}

// Automatika: po každé změně dat se záloha naplánuje (a shluky změn se spojí).
let timer = null;
let pending = null;

function scheduleCloudBackup(state) {
  if (!cloudEnabled()) return;
  pending = state;
  if (timer) clearTimeout(timer);
  timer = setTimeout(() => { timer = null; if (pending) cloudBackup(pending); }, DEBOUNCE_MS);
}

/** Okamžitá záloha (konec tréninku, tlačítko v Nastavení) — nečeká na debounce. */
function flushCloudBackup(state) {
  if (timer) { clearTimeout(timer); timer = null; }
  pending = null;
  return cloudBackup(state);
}


// ===== src/app/appstate.js =====
// Stav aplikace a orchestrace enginu. Engine počítá, tohle drží data a pravidla toku.













const APP_VERSION = 1;
const REST_SECONDS = { heavy: 180, secondary: 120, isolation: 90 };

function defaultState() {
  return {
    version: APP_VERSION,
    updatedAt: new Date().toISOString(),
    onboarded: false,
    profile: { ...DEFAULT_PROFILE, startDate: todayISO() },
    targets: null,
    nutritionLog: [],
    exercises: {},
    addedSets: {},
    enabledSlotExercises: [],
    sessions: [],
    activeWorkout: null,
    weighIns: [],
    waist: [],
    checkins: [],
    bestE1rms: {},
    prLog: [],
    deload: { active: false, sessionsLeft: 0, lastEndDate: null },
    volume: { lastChangeDate: null },
    offers: {},
    offersDismissed: {},
    minicutEndDate: null,
    introDismissed: false,
    restScale: 1, // 0.75 kratší · 1 doporučené · 1.25 delší
  };
}

// ---------- Store ----------

const Store = {
  state: null,
  onChange: null, // nastavuje main.js (re-render)

  init(persisted) {
    this.state = persisted ?? defaultState();
    if (persisted) migrate(this.state);
  },

  // mutace: fn(state); publish = bezpečná hranice → nová verze artifactu (reload!)
  // Bez publish se změna označí jako nesynchronizovaná (pendingPublish) a doladí
  // se při příštím startu appky nebo na další bezpečné hranici.
  mutate(fn, { publish = false, rerender = true, markDirty = true, force = false } = {}) {
    const result = fn(this.state);
    this.state.updatedAt = new Date().toISOString();
    if (publish) this.state.pendingPublish = false;
    else if (markDirty) this.state.pendingPublish = true;
    saveLocal(this.state, { force });
    // Automatická záloha na GitHub: na hranicích (konec tréninku, onboarding…) hned,
    // jinak se shlukne a odešle po pár vteřinách klidu.
    // Na stejné hranici vzniká i lokální snímek — po dokončeném tréninku tak
    // existuje čerstvá záloha, ne až při příštím spuštění appky.
    if (publish) { backupState(this.state); publishState(this.state); flushCloudBackup(this.state); }
    else scheduleCloudBackup(this.state);
    if (rerender && this.onChange) this.onChange();
    return result;
  },
};

function migrate(state) {
  const fresh = defaultState();
  for (const key of Object.keys(fresh)) if (!(key in state)) state[key] = fresh[key];
}

// ---------- plán a předpisy ----------

function nextUnitDay(state) {
  return WEEK_TEMPLATE[state.sessions.length % WEEK_TEMPLATE.length];
}

// Seznam cviků jednotky vč. zapnutých slot cviků a přidaných sérií.
function unitExerciseList(state, day) {
  const list = day.exercises.map((ex) => ({
    exerciseId: ex.exerciseId,
    sets: ex.sets + (state.addedSets[slotKey(day.unit, ex.exerciseId)] ?? 0),
    dropsetLast: !!ex.dropsetLast,
  }));
  for (const slot of day.slots) {
    if (slot.kind === 'add_exercise' && state.enabledSlotExercises.includes(slot.exerciseId)) {
      list.push({
        exerciseId: slot.exerciseId,
        sets: slot.sets + (state.addedSets[slotKey(day.unit, slot.exerciseId)] ?? 0),
        dropsetLast: !!EXERCISES[slot.exerciseId].dropset,
      });
    }
  }
  return list;
}

function ensureExerciseState(state, exerciseId, sets) {
  if (!state.exercises[exerciseId]) {
    state.exercises[exerciseId] = { exerciseId, status: 'calibration', loadKg: null, sets: sets ?? 3 };
  } else if (sets != null) {
    state.exercises[exerciseId].sets = sets;
  }
  return state.exercises[exerciseId];
}

// Historie výkonů cviku (bez deload týdnů — nízké zátěže nesmí mást progresi).
function recentPerformances(state, exerciseId, n = 3) {
  const out = [];
  for (let i = state.sessions.length - 1; i >= 0 && out.length < n; i--) {
    const session = state.sessions[i];
    if (session.deload) continue;
    const entry = session.entries.find((e) => e.exerciseId === exerciseId);
    if (entry && entry.sets.some((s) => !s.isWarmup)) {
      out.push({ date: session.date, sets: entry.sets });
    }
  }
  return out;
}

function prescriptionFor(state, exerciseId, sets) {
  const def = EXERCISES[exerciseId];
  const exState = { ...ensureExerciseState(state, exerciseId), sets };
  if (state.deload.active) return deloadPrescription(def, exState, loadStep);
  return computeNextPrescription(def, exState, recentPerformances(state, exerciseId));
}

function warmupsFor(exerciseId, loadKg) {
  const def = EXERCISES[exerciseId];
  if (loadKg == null || def.incrementRule === 'bodyweight' || def.type === 'isolation' || loadKg < 30) return [];
  const step = loadStep(def);
  if (def.type === 'heavy') {
    return [
      { weightKg: Math.max(step, roundToStep(loadKg * 0.5, step)), reps: 5 },
      { weightKg: Math.max(step, roundToStep(loadKg * 0.75, step)), reps: 3 },
    ];
  }
  return [{ weightKg: Math.max(step, roundToStep(loadKg * 0.6, step)), reps: 5 }];
}

function restSecondsFor(exerciseId, state = Store.state) {
  const base = REST_SECONDS[EXERCISES[exerciseId].type] ?? 120;
  const scale = state?.restScale ?? 1;
  return Math.round((base * scale) / 15) * 15; // zaokrouhleno na 15 s
}

function restPlan(state = Store.state) {
  const scale = state?.restScale ?? 1;
  return Object.entries(REST_SECONDS).map(([type, base]) => ({
    type, seconds: Math.round((base * scale) / 15) * 15,
  }));
}

function fmtRest(seconds) {
  const m = Math.floor(seconds / 60);
  const s = seconds % 60;
  return s === 0 ? `${m}:00` : `${m}:${String(s).padStart(2, '0')}`;
}

// Pozice v pětidenním cyklu (nezávislá na dni v týdnu) — 1..5.
function cyclePosition(state) {
  return (state.sessions.length % WEEK_TEMPLATE.length) + 1;
}

// ---------- trénink ----------

// Řádkový model cviku: rozcvičky → pracovní série → případný dropset. Logged = zapsáno.
function buildEntry(state, exerciseId, sets, dropsetLast, swappedFrom = null) {
  const prescription = prescriptionFor(state, exerciseId, sets);
  const rows = [];
  for (const w of warmupsFor(exerciseId, prescription.loadKg)) {
    rows.push({ kind: 'warmup', target: { weightKg: w.weightKg, reps: w.reps }, logged: null });
  }
  for (const reps of prescription.targetReps) {
    rows.push({ kind: 'work', target: { weightKg: prescription.loadKg, reps }, logged: null });
  }
  if (dropsetLast && !state.deload.active) {
    rows.push({ kind: 'drop', target: { weightKg: null, reps: null }, logged: null });
  }
  return { exerciseId, swappedFrom, prescription, rows };
}

function buildWorkout(state, { unit = null, date = null } = {}) {
  const day = unit ? WEEK_TEMPLATE.find((d) => d.unit === unit) ?? nextUnitDay(state) : nextUnitDay(state);
  const entries = unitExerciseList(state, day)
    .map((item) => buildEntry(state, item.exerciseId, item.sets, item.dropsetLast));
  return {
    unit: day.unit,
    unitName: day.name,
    date: date ?? todayISO(),
    backfill: !!date && date !== todayISO(),
    startedAt: Date.now(),
    deload: state.deload.active,
    entries,
  };
}

function swapWorkoutExercise(state, entryIndex, newExerciseId) {
  const workout = state.activeWorkout;
  const entry = workout.entries[entryIndex];
  const sets = entry.prescription.targetReps.length;
  workout.entries[entryIndex] = buildEntry(
    state, newExerciseId, sets, !!EXERCISES[newExerciseId].dropset, entry.exerciseId,
  );
}

// Dokončení tréninku: zápis session, update stavů cviků, PR, deload bookkeeping, nabídky.
function completeWorkout(state) {
  const workout = state.activeWorkout;
  if (!workout) return null;

  const entries = workout.entries
    .map((e) => ({
      exerciseId: e.exerciseId,
      swappedFrom: e.swappedFrom ?? undefined,
      sets: e.rows
        .filter((r) => r.logged && r.logged.reps > 0)
        .map((r) => ({
          weightKg: r.logged.weightKg,
          reps: r.logged.reps,
          ...(r.logged.rir != null ? { rir: r.logged.rir } : {}),
          ...(r.kind === 'warmup' ? { isWarmup: true } : {}),
          ...(r.kind === 'drop' ? { isDropset: true } : {}),
        })),
    }))
    .filter((e) => e.sets.some((s) => !s.isWarmup && !s.isDropset));

  const session = {
    id: `s${Date.now()}`,
    date: workout.date,
    unit: workout.unit,
    deload: workout.deload,
    durationMin: Math.max(1, Math.round((Date.now() - workout.startedAt) / 60000)),
    entries,
  };
  state.sessions.push(session);
  // chronologicky — zpětně dopsaný trénink se musí zařadit podle data,
  // jinak by ho engine bral jako nejnovější výkon
  state.sessions.sort((a, b) => a.date.localeCompare(b.date));

  const prs = [];
  for (const entry of entries) {
    const def = EXERCISES[entry.exerciseId];
    const perf = { date: session.date, sets: entry.sets };

    if (!session.deload) {
      const exState = ensureExerciseState(state, entry.exerciseId);
      const workoutEntry = workout.entries.find((e) => e.exerciseId === entry.exerciseId);
      state.exercises[entry.exerciseId] = nextStateAfterSession(def, exState, perf, workoutEntry?.prescription);

      const prev = state.bestE1rms[entry.exerciseId] ?? null;
      const { isPR, e1rm: sessionBest } = detectPR(prev, perf);
      if (sessionBest != null) {
        state.bestE1rms[entry.exerciseId] = Math.max(prev ?? 0, sessionBest);
        if (isPR && def.key) {
          prs.push({ exerciseId: entry.exerciseId, e1rm: sessionBest });
          state.prLog.push({ date: session.date, exerciseId: entry.exerciseId, e1rm: sessionBest });
        }
      }
    }
  }

  if (session.deload) {
    state.deload.sessionsLeft = Math.max(0, state.deload.sessionsLeft - 1);
    if (state.deload.sessionsLeft === 0) {
      state.deload.active = false;
      state.deload.lastEndDate = session.date;
      state.addedSets = volumeAfterDeload(state.addedSets);
      state.volume.lastChangeDate = session.date;
    }
  }

  state.activeWorkout = null;
  evaluateOffers(state);
  return { session, prs };
}

// ---------- nabídky enginu (deload / objem / mini-cut) ----------

function weeksBetween(fromISO, toISO) {
  if (!fromISO) return 0;
  return Math.floor(daysBetween(fromISO, toISO) / 7);
}

function keyRegressions(state) {
  return keyExerciseIds().filter((id) => {
    const exState = state.exercises[id];
    if (!exState || exState.status !== 'active') return false;
    const p = computeNextPrescription(EXERCISES[id], exState, recentPerformances(state, id));
    return p.action === 'reduce_load';
  });
}

function progressingShare(state) {
  const active = Object.values(state.exercises).filter((e) => e.status === 'active');
  if (!active.length) return 1;
  let progressing = 0;
  for (const exState of active) {
    const p = computeNextPrescription(EXERCISES[exState.exerciseId], exState, recentPerformances(state, exState.exerciseId));
    if (p.action !== 'reduce_load' && p.note !== 'missed_bottom_once') progressing++;
  }
  return progressing / active.length;
}

const OFFER_SNOOZE_DAYS = 5;

function snoozed(state, kind) {
  const at = state.offersDismissed[kind];
  return at && daysBetween(at, todayISO()) < OFFER_SNOOZE_DAYS;
}

function evaluateOffers(state) {
  const today = todayISO();
  state.offers = state.offers ?? {};

  // Deload
  if (!state.deload.active && !snoozed(state, 'deload')) {
    const trig = detectDeloadTriggers({
      keyRegressions: keyRegressions(state),
      readinessLog: state.checkins.slice(-7),
      weeksSinceDeload: weeksBetween(state.deload.lastEndDate ?? state.profile.startDate, today),
    });
    state.offers.deload = trig.triggered ? { reasons: trig.reasons } : null;
  } else {
    state.offers.deload = null;
  }

  // Objem (jen mimo deload a mimo mini-cut)
  if (!state.deload.active && !state.offers.deload && state.targets?.phase !== 'minicut' && !snoozed(state, 'volume')) {
    const check = shouldOfferVolumeIncrease({
      weeksSinceVolumeChange: weeksBetween(state.volume.lastChangeDate ?? state.profile.startDate, today),
      deloadTriggered: false,
      readinessAvg7d: readinessAvg(state.checkins.slice(-7)),
      progressingShare: progressingShare(state),
    });
    if (check.offer) {
      const picks = pickVolumeSlots(state.addedSets, new Set(state.enabledSlotExercises), 2);
      state.offers.volume = picks.length ? { picks } : null;
    } else {
      state.offers.volume = null;
    }
  } else {
    state.offers.volume = null;
  }

  // Mini-cut (jen v bulku)
  if (state.targets?.phase === 'bulk' && !snoozed(state, 'minicut')) {
    const check = miniCutCheck({ waistSeries: state.waist, weightSeries: state.weighIns, heightCm: state.profile.heightCm });
    state.offers.minicut = check.recommend ? { reasons: check.reasons } : null;
  } else {
    state.offers.minicut = null;
  }
}

function acceptDeload(state) {
  state.deload.active = true;
  state.deload.sessionsLeft = WEEK_TEMPLATE.length;
  state.offers.deload = null;
}

function dismissOffer(state, kind) {
  state.offers[kind] = null;
  state.offersDismissed[kind] = todayISO();
}

function acceptVolume(state) {
  const picks = state.offers.volume?.picks ?? [];
  for (const pick of picks) {
    if (pick.kind === 'add_exercise') {
      if (!state.enabledSlotExercises.includes(pick.exerciseId)) state.enabledSlotExercises.push(pick.exerciseId);
      ensureExerciseState(state, pick.exerciseId, pick.sets);
    } else {
      const key = slotKey(pick.unit, pick.exerciseId);
      state.addedSets[key] = (state.addedSets[key] ?? 0) + 1;
    }
  }
  state.volume.lastChangeDate = todayISO();
  state.offers.volume = null;
}

function acceptMinicut(state) {
  const avgW = currentAvgWeight(state.weighIns) ?? state.profile.weightKg;
  const proj = projectGoalDate({ weighIns: state.weighIns, goalKg: state.profile.goalWeightKg });
  state.targets = miniCutTargets(state.targets, avgW, proj.rateKgWk);
  state.minicutEndDate = addDays(todayISO(), 49);
  state.offers.minicut = null;
  state.nutritionLog.push({ date: todayISO(), kcal: state.targets.kcal, deltaKcal: 0, reason: 'minicut_start' });
}

// ---------- denní údržba (volá se při startu appky) ----------

function dailyMaintenance(state) {
  if (!state.onboarded || !state.targets) return;
  const today = todayISO();

  // konec mini-cutu → zpět do bulku s cíli podle aktuální váhy
  if (state.targets.phase === 'minicut' && state.minicutEndDate && today > state.minicutEndDate) {
    const avgW = currentAvgWeight(state.weighIns) ?? state.profile.weightKg;
    state.targets = initialTargets(state.profile, avgW);
    state.minicutEndDate = null;
    state.nutritionLog.push({ date: today, kcal: state.targets.kcal, deltaKcal: 0, reason: 'bulk_resume' });
  }

  // týdenní korekce kalorií podle trendu (max 1× za 6 dní)
  const lastAdjust = state.nutritionLog.at(-1)?.date ?? null;
  if (!lastAdjust || daysBetween(lastAdjust, today) >= 6) {
    const weeksOnPlan = Math.floor(daysBetween(state.profile.startDate, today) / 7) + 1;
    const result = weeklyAdjustment({ targets: state.targets, weighIns: state.weighIns, weeksOnPlan });
    if (result.deltaKcal !== 0) {
      state.targets.kcal = result.newKcal;
      state.nutritionLog.push({ date: today, kcal: result.newKcal, deltaKcal: result.deltaKcal, reason: result.reason });
    } else if (result.reason === 'on_track' && (!lastAdjust || daysBetween(lastAdjust, today) >= 6)) {
      state.nutritionLog.push({ date: today, kcal: state.targets.kcal, deltaKcal: 0, reason: 'on_track' });
    }
  }

  // protein sleduje aktuální váhu
  const avgW = currentAvgWeight(state.weighIns);
  if (avgW) {
    const gPerKg = state.targets.phase === 'minicut' ? 2.1 : 1.8;
    state.targets.proteinG = Math.round(gPerKg * avgW);
  }

  evaluateOffers(state);
}

// ---------- tělo ----------

function upsertWeighIn(state, kg) {
  const today = todayISO();
  const existing = state.weighIns.find((w) => w.date === today);
  if (existing) existing.kg = kg;
  else state.weighIns.push({ date: today, kg });
  state.weighIns.sort((a, b) => a.date.localeCompare(b.date));
}

function upsertWaist(state, cm) {
  const today = todayISO();
  const existing = state.waist.find((w) => w.date === today);
  if (existing) existing.cm = cm;
  else state.waist.push({ date: today, cm });
  state.waist.sort((a, b) => a.date.localeCompare(b.date));
}

function upsertCheckin(state, values) {
  const today = todayISO();
  const existing = state.checkins.find((c) => c.date === today);
  if (existing) Object.assign(existing, values);
  else state.checkins.push({ date: today, ...values });
  state.checkins.sort((a, b) => a.date.localeCompare(b.date));
}

// ---------- odvozená data pro obrazovky ----------

function weeklyStreakLog(state) {
  if (!state.sessions.length) return [];
  const weekKey = (iso) => {
    const d = new Date(`${iso}T12:00:00`);
    const day = (d.getDay() + 6) % 7; // Po = 0
    d.setDate(d.getDate() - day);
    return d.toISOString().slice(0, 10);
  };
  const counts = new Map();
  for (const s of state.sessions) {
    const key = weekKey(s.date);
    counts.set(key, (counts.get(key) ?? 0) + 1);
  }
  const currentWeek = weekKey(todayISO());
  const weeks = [];
  let cursor = currentWeek;
  const firstWeek = weekKey(state.sessions[0].date);
  while (cursor >= firstWeek && weeks.length < 200) {
    weeks.push({
      completed: counts.get(cursor) ?? 0,
      planned: 5,
      isCurrentWeek: cursor === currentWeek,
    });
    cursor = addDays(cursor, -7);
  }
  return weeks;
}

function e1rmSeries(state, exerciseId) {
  const out = [];
  for (const session of state.sessions) {
    if (session.deload) continue;
    const entry = session.entries.find((e) => e.exerciseId === exerciseId);
    if (!entry) continue;
    let best = null;
    for (const s of entry.sets) {
      if (s.isWarmup) continue;
      const val = e1rm(s.weightKg, s.reps, s.rir);
      if (val != null && (best == null || val > best)) best = val;
    }
    if (best != null) out.push({ date: session.date, value: best });
  }
  return out;
}

function trainingAgeMonthsNow(state) {
  return (state.profile.trainingAgeMonths ?? 0) + Math.floor(daysBetween(state.profile.startDate, todayISO()) / 30.44);
}

function progressSummary(state) {
  const avg7 = currentAvgWeight(state.weighIns);
  return {
    avg7,
    projection: projectGoalDate({ weighIns: state.weighIns, goalKg: state.profile.goalWeightKg }),
    quality: gainQuality({ weighIns: state.weighIns, waistSeries: state.waist }),
    composition: gainComposition({ weighIns: state.weighIns, trainingAgeMonths: trainingAgeMonthsNow(state) }),
    weightMilestone: nextWeightMilestone(avg7, state.profile.weightKg, state.profile.goalWeightKg),
    streak: streakWeeks(weeklyStreakLog(state)),
  };
}

/**
 * Rekapitulace odcvičeného tréninku — co jsi udělal, jak to dopadlo proti cíli
 * a co z toho engine vyvodil pro příště. Počítá se z uložené session + stavu
 * (po completeWorkout už stav obsahuje nové zátěže), takže je pravdivá i zpětně.
 */
function sessionRecap(state, session) {
  // „Příště" dává smysl jen u nejnovějšího tréninku — u starších by ukazovalo
  // dnešní zátěž, ne tu, která po něm reálně přišla.
  const isLatest = state.sessions[state.sessions.length - 1]?.id === session.id;
  const allWorkSets = [];

  const entries = session.entries.map((entry) => {
    const def = EXERCISES[entry.exerciseId];
    if (!def) return null; // cvik, který už v programu není
    const work = entry.sets.filter((s) => !s.isWarmup && !s.isDropset);
    const drops = entry.sets.filter((s) => s.isDropset);
    allWorkSets.push(...work);
    const lo = def.repRange[0];
    // strop = prodloužený rozsah, pokud ho cvik má (jinak by verdikt lhal)
    const hi = state.exercises[entry.exerciseId]?.rangeHi ?? def.repRange[1];
    const tonnage = work.reduce((a, s) => a + s.weightKg * s.reps, 0);
    const rirs = work.filter((s) => s.rir != null).map((s) => s.rir);
    const avgRir = rirs.length ? +avg(rirs).toFixed(1) : null;
    const best = work.reduce((b, s) => (b == null || e1rm(s.weightKg, s.reps, s.rir) > e1rm(b.weightKg, b.reps, b.rir) ? s : b), null);

    let verdict = 'v rozsahu';
    let tone = 'ok';
    if (work.some((s) => s.reps < lo)) { verdict = 'pod rozsahem'; tone = 'warn'; }
    else if (work.length && work.every((s) => s.reps >= hi)) { verdict = 'na stropu'; tone = 'accent'; }

    const next = session.deload || !isLatest ? null : prescriptionFor(state, entry.exerciseId, work.length);
    const nextText = next && next.loadKg != null
      ? `${fmtNum(next.loadKg)} kg × ${next.targetReps[0]}`
      : next ? `× ${next.targetReps[0]} (váhu najdeš na místě)` : null;

    return {
      exerciseId: entry.exerciseId,
      name: def.name,
      setsText: work.map((s) => `${fmtNum(s.weightKg)}×${s.reps}${s.rir != null ? `@${s.rir}` : ''}`).join(' · '),
      dropsText: drops.length ? drops.map((s) => `${fmtNum(s.weightKg)}×${s.reps}`).join(' · ') : null,
      workSets: work.length,
      tonnage: Math.round(tonnage),
      avgRir,
      bestE1rm: best ? Math.round(e1rm(best.weightKg, best.reps, best.rir)) : null,
      verdict,
      tone,
      nextText,
    };
  });

  const clean = entries.filter(Boolean);
  const workSets = clean.reduce((a, e) => a + e.workSets, 0);
  const tonnage = clean.reduce((a, e) => a + e.tonnage, 0);
  // průměr přes VŠECHNY série, ne průměr průměrů
  const rirValues = allWorkSets.filter((s) => s.rir != null).map((s) => s.rir);
  const avgRir = rirValues.length ? +avg(rirValues).toFixed(1) : null;
  const inSession = new Set(session.entries.map((e) => e.exerciseId));
  const prs = state.prLog.filter((p) => p.date === session.date && inSession.has(p.exerciseId));

  // souhrnný verdikt — jedna věta, kterou si přečteš do 2 sekund
  let headline;
  if (session.deload) headline = 'Deload odcvičen — přesně jak měl vypadat: lehce a bez selhání.';
  else if (prs.length) headline = 'Nové osobní maximum. Tohle byl silný trénink.';
  else if (clean.some((e) => e.tone === 'accent')) headline = 'Strop rozsahu na některých cvicích — příště se přidává váha.';
  else if (clean.some((e) => e.tone === 'warn')) headline = 'Část sérií spadla pod rozsah — engine příště uleví, ať se progrese rozjede.';
  else if (avgRir != null && avgRir >= 3.5) headline = 'Bylo to hodně v rezervě — příště přitlač, ať to má stimul.';
  else headline = 'Solidní práce v cílovém pásmu — přesně takhle se staví progrese.';

  return {
    date: session.date,
    unit: session.unit,
    unitName: WEEK_TEMPLATE.find((d) => d.unit === session.unit)?.name ?? session.unit,
    deload: session.deload,
    durationMin: session.durationMin,
    workSets,
    tonnage,
    avgRir,
    prs,
    headline,
    entries: clean,
  };
}

// Náhrady, které v tréninku ještě nejsou (dvakrát tentýž cvik by rozbil zápis i předpis).
function availableSubstitutes(state, exerciseId) {
  const used = new Set((state.activeWorkout?.entries ?? []).map((e) => e.exerciseId));
  return (EXERCISES[exerciseId].substitutes ?? []).filter((id) => EXERCISES[id] && !used.has(id));
}

function fmtNum(n) {
  return String(n).replace('.', ',');
}

// Týdenní zpráva kouče — šablona nad daty enginu (deterministická, poctivá).
function weeklyReview(state) {
  const today = todayISO();
  const weekAgo = addDays(today, -7);
  const sessions = state.sessions.filter((s) => s.date > weekAgo);
  const prs = state.prLog.filter((p) => p.date > weekAgo);
  const summary = progressSummary(state);
  const lines = [];

  lines.push(`Tréninky: ${sessions.length}/5${sessions.some((s) => s.deload) ? ' (deload)' : ''}.`);
  if (prs.length) {
    const names = prs.map((p) => EXERCISES[p.exerciseId].name).join(', ');
    lines.push(`Nová osobní maxima: ${names}. Slušná práce.`);
  }

  const p = summary.projection;
  if (p.status === 'ok') {
    lines.push(`Váha roste ${p.rateKgWk.toFixed(2).replace('.', ',')} kg/týden — tímhle tempem ${state.profile.goalWeightKg} kg ${fmtEta(p.etaDate)}.`);
  } else if (p.status === 'stalled') {
    lines.push('Váha stojí. Jestli se pravidelně vážíš, engine v pondělí přidá kalorie — drž příjem.');
  } else if (p.status === 'losing') {
    lines.push('Váha klesá — na bulk málo jíš. Zkontroluj kalorie.');
  } else if (p.status === 'need_more_data') {
    lines.push('Na trend váhy potřebuju víc vážení — stačí 3×/týden ráno.');
  }

  if (summary.quality.quality === 'lean_gain') lines.push('Pas drží — přírůstek vypadá čistě.');
  if (summary.quality.quality === 'too_fast') lines.push(`Pas roste ${String(summary.quality.waistRateCmMo).replace('.', ',')} cm/měsíc — tempo je moc, engine ubírá kalorie.`);
  if (summary.composition.muscleShareNote === 'mostly_fat') {
    lines.push('Poctivě: tímhle tempem nabíráš hlavně tuk, ne svaly. Strop svalů je '
      + `${summary.composition.muscleBandKgMo[1].toFixed(1).replace('.', ',')} kg/měsíc.`);
  }
  if (state.offers.deload) lines.push('Tělo hlásí únavu — zvaž nabízený deload týden.');
  return lines;
}

function fmtEta(iso) {
  const d = new Date(`${iso}T12:00:00`);
  const months = ['ledna', 'února', 'března', 'dubna', 'května', 'června', 'července', 'srpna', 'září', 'října', 'listopadu', 'prosince'];
  return `vychází na ${months[d.getMonth()]} ${d.getFullYear()}`;
}

// ---------- onboarding ----------

function completeOnboarding(state, { profile, lifts, waistCm }) {
  state.profile = { ...state.profile, ...profile, startDate: todayISO() };
  state.exercises = buildInitialExerciseStates(lifts);
  state.targets = initialTargets(state.profile, state.profile.weightKg);
  upsertWeighIn(state, state.profile.weightKg);
  if (waistCm) upsertWaist(state, waistCm);
  state.onboarded = true;
}



// ===== src/app/timer.js =====
// Rest timer: nikdy netiká setIntervalem naslepo — drží endTime a zbytek přepočítává
// z hodin (JS v pozadí na mobilu stojí). Wake lock jako progressive enhancement.


const RestTimer = {
  endTime: null,
  label: '',
  el: null,
  interval: null,
  wakeLock: null,
  audioCtx: null,
  beeped: false,
  scheduled: [],
  tonesReady: false,
  resuming: false,
  visibilityBound: false,

  start(seconds, label = '') {
    this.endTime = Date.now() + seconds * 1000;
    this.label = label;
    this.beeped = false;
    this.ensureUI();
    this.requestWakeLock();
    this.scheduleTones(); // volá se ze ✓ = z gesta uživatele → audio smí hrát
    this.render();
  },

  adjust(deltaSeconds) {
    if (!this.endTime) return;
    this.endTime += deltaSeconds * 1000;
    this.scheduleTones();
    this.render();
  },

  stop() {
    this.endTime = null;
    if (this.interval) { clearInterval(this.interval); this.interval = null; }
    this.clearScheduled();
    this.el?.remove();
    this.el = null;
    this.releaseWakeLock();
  },

  remainingSec() {
    if (!this.endTime) return null;
    return Math.round((this.endTime - Date.now()) / 1000);
  },

  ensureUI() {
    if (this.el) return;
    this.el = h('div', { class: 'timerbar', role: 'timer' });
    document.body.append(this.el);
    if (!this.interval) this.interval = setInterval(() => this.render(), 500);
    // listener jen jednou za život appky a jen když časovač opravdu běží,
    // jinak by se hromadil a držel displej rozsvícený i mimo trénink
    if (!this.visibilityBound) {
      this.visibilityBound = true;
      document.addEventListener('visibilitychange', () => {
        if (document.hidden || !this.endTime) return;
        this.render();
        this.requestWakeLock();
      });
    }
  },

  render() {
    if (!this.el) return;
    const remaining = this.remainingSec();
    if (remaining == null) return;
    if (remaining <= 0 && !this.beeped) { this.beep(); this.beeped = true; }

    const overrun = remaining < 0;
    const abs = Math.abs(remaining);
    const mm = Math.floor(abs / 60);
    const ss = String(abs % 60).padStart(2, '0');

    this.el.replaceChildren(h('div', { class: 'timerbar-inner' },
      h('div', { class: `timer-digits${overrun ? ' overrun' : ''}` }, `${overrun ? '+' : ''}${mm}:${ss}`),
      h('div', { class: 'timer-mid' },
        h('div', { class: 'label' }, 'Pauza'),
        this.label ? h('div', { class: 'timer-next' }, this.label) : null,
      ),
      h('button', { class: 'btn small ghost', onClick: () => this.adjust(-15) }, '−15'),
      h('button', { class: 'btn small ghost', onClick: () => this.adjust(15) }, '+15'),
      h('button', { class: 'btn small', 'aria-label': 'Přeskočit pauzu', onClick: () => this.stop() }, '✕'),
    ));
  },

  async requestWakeLock() {
    try {
      if ('wakeLock' in navigator && document.visibilityState === 'visible') {
        this.wakeLock = await navigator.wakeLock.request('screen');
      }
    } catch { /* starší iOS / nepovoleno — timer funguje dál, jen zhasne displej */ }
  },

  releaseWakeLock() {
    try { this.wakeLock?.release(); } catch { /* noop */ }
    this.wakeLock = null;
  },

  ensureAudio() {
    try {
      this.audioCtx = this.audioCtx ?? new (window.AudioContext ?? window.webkitAudioContext)();
      const ctx = this.audioCtx;
      // iOS startuje kontext uspaný; po probuzení tóny naplánujeme znovu,
      // aby závěrečný signál nezazněl dvakrát (naplánovaný + záložní).
      if (ctx.state === 'suspended' && !this.resuming) {
        this.resuming = true;
        ctx.resume()
          .then(() => { this.resuming = false; if (this.endTime) this.scheduleTones(); })
          .catch(() => { this.resuming = false; });
      }
      return ctx;
    } catch { return null; }
  },

  // Jeden tón naplánovaný na přesný čas zvukové karty (nezávislý na tom,
  // jestli JS mezitím spí — proto odpočet 3–2–1 dojede i při zamčeném telefonu).
  tone(ctx, at, freq, dur, volume = 0.22) {
    const osc = ctx.createOscillator();
    const gain = ctx.createGain();
    osc.type = 'sine';
    osc.frequency.value = freq;
    gain.gain.setValueAtTime(0.0001, at);
    gain.gain.exponentialRampToValueAtTime(volume, at + 0.02);
    gain.gain.exponentialRampToValueAtTime(0.0001, at + dur);
    osc.connect(gain).connect(ctx.destination);
    osc.start(at);
    osc.stop(at + dur + 0.02);
    this.scheduled.push(osc);
  },

  scheduleTones() {
    this.clearScheduled();
    const ctx = this.ensureAudio();
    if (!ctx) return;
    const left = (this.endTime - Date.now()) / 1000;
    // 3 · 2 · 1 krátce a tiše, na nule dvojitý vyšší tón = „teď“
    const plan = [
      [left - 3, 720, 0.11, 0.16],
      [left - 2, 720, 0.11, 0.16],
      [left - 1, 720, 0.11, 0.16],
      [left, 1046, 0.18, 0.26],
      [left + 0.22, 1318, 0.32, 0.26],
    ];
    for (const [t, freq, dur, vol] of plan) {
      if (t > 0.05) this.tone(ctx, ctx.currentTime + t, freq, dur, vol);
    }
    this.tonesReady = ctx.state === 'running';
  },

  clearScheduled() {
    for (const osc of this.scheduled) {
      try { osc.stop(); osc.disconnect(); } catch { /* už doběhl */ }
    }
    this.scheduled = [];
  },

  // Záloha pro případ, že prohlížeč zvuk uspal — zahraje se hned při doběhnutí.
  beep() {
    const ctx = this.ensureAudio();
    if (ctx && !this.tonesReady) {
      const now = ctx.currentTime;
      this.tone(ctx, now, 1046, 0.18, 0.26);
      this.tone(ctx, now + 0.22, 1318, 0.32, 0.26);
    }
    try { if (navigator.vibrate) navigator.vibrate([120, 60, 200]); } catch { /* noop */ }
  },
};


// ===== src/app/charts.js =====
// SVG čárové grafy: tenké čáry, recesivní mřížka, crosshair + tooltip, přímé popisky.
// Barva dat = --chart-data (validováno vůči oběma povrchům), text v textových tokenech.


const NS = 'http://www.w3.org/2000/svg';

let chartUid = 0; // unikátní id gradientů (na stránce je víc grafů)

function svgEl(tag, attrs = {}) {
  const el = document.createElementNS(NS, tag);
  for (const [k, v] of Object.entries(attrs)) el.setAttribute(k, v);
  return el;
}

/**
 * Čárový graf časové řady.
 * @param cfg {
 *   series: [{ points: [{date, value}], kind: 'line'|'dots'|'dashed', label?, emphasizeLast? }],
 *   goal?: { value, label },
 *   height?, yUnit?, yFmt?: (v)=>string
 * }
 * Barvy: line/dots = var(--chart-data), dashed = var(--muted), goal = var(--faint).
 */
function lineChart(cfg) {
  const W = 448;
  const H = cfg.height ?? 190;
  const PAD = { top: 16, right: 12, bottom: 24, left: 40 };
  const yFmt = cfg.yFmt ?? ((v) => String(Math.round(v)));

  const allPoints = cfg.series.flatMap((s) => s.points);
  if (!allPoints.length) {
    return h('div', { class: 'muted small', style: 'padding:12px 0' }, 'Zatím žádná data.');
  }

  const dates = allPoints.map((p) => Date.parse(p.date));
  const values = allPoints.map((p) => p.value).concat(cfg.goal ? [cfg.goal.value] : []);
  let x0 = Math.min(...dates);
  let x1 = Math.max(...dates);
  if (x1 - x0 < 86400000 * 7) x1 = x0 + 86400000 * 7; // ať graf nevypadá rozplácle první týden
  let yMin = Math.min(...values);
  let yMax = Math.max(...values);
  const span = Math.max(yMax - yMin, 1);
  yMin -= span * 0.12;
  yMax += span * 0.12;

  const px = (d) => PAD.left + ((Date.parse(d) - x0) / (x1 - x0)) * (W - PAD.left - PAD.right);
  const py = (v) => PAD.top + (1 - (v - yMin) / (yMax - yMin)) * (H - PAD.top - PAD.bottom);

  const svg = svgEl('svg', { viewBox: `0 0 ${W} ${H}`, role: 'img' });

  // mřížka + osy Y (3 ticky)
  for (let i = 0; i <= 2; i++) {
    const v = yMin + ((yMax - yMin) * i) / 2;
    const y = py(v);
    svg.append(svgEl('line', { x1: PAD.left, x2: W - PAD.right, y1: y, y2: y, stroke: 'var(--chart-grid)', 'stroke-width': 1 }));
    const label = svgEl('text', {
      x: PAD.left - 6, y: y + 3.5, 'text-anchor': 'end',
      fill: 'var(--muted)', 'font-size': 10.5, 'font-family': 'var(--font-num)',
    });
    label.textContent = yFmt(v);
    svg.append(label);
  }

  // osy X — max 4 popisky dat
  const tickCount = Math.min(4, Math.max(2, Math.round((x1 - x0) / (86400000 * 21))));
  for (let i = 0; i <= tickCount; i++) {
    const t = x0 + ((x1 - x0) * i) / tickCount;
    const iso = new Date(t).toISOString().slice(0, 10);
    const label = svgEl('text', {
      x: px(iso), y: H - 7, 'text-anchor': i === 0 ? 'start' : i === tickCount ? 'end' : 'middle',
      fill: 'var(--faint)', 'font-size': 10.5, 'font-family': 'var(--font-num)',
    });
    label.textContent = fmtDate(iso);
    svg.append(label);
  }

  // cílová linka
  if (cfg.goal) {
    const y = py(cfg.goal.value);
    svg.append(svgEl('line', {
      x1: PAD.left, x2: W - PAD.right, y1: y, y2: y,
      stroke: 'var(--faint)', 'stroke-width': 1, 'stroke-dasharray': '2 4',
    }));
    const label = svgEl('text', {
      x: W - PAD.right, y: y - 4, 'text-anchor': 'end',
      fill: 'var(--muted)', 'font-size': 10.5, 'font-family': 'var(--font-ui)',
    });
    label.textContent = cfg.goal.label;
    svg.append(label);
  }

  const linePath = (points) => points
    .map((p, i) => `${i === 0 ? 'M' : 'L'}${px(p.date).toFixed(1)},${py(p.value).toFixed(1)}`)
    .join('');

  let hoverSource = null;
  for (const s of cfg.series) {
    if (!s.points.length) continue;
    if (s.kind === 'dots') {
      for (const p of s.points) {
        svg.append(svgEl('circle', { cx: px(p.date), cy: py(p.value), r: 2.1, fill: 'var(--chart-data)', opacity: 0.32 }));
      }
    } else {
      // výplň pod hlavní čarou — dodává grafu hloubku
      if (s.kind === 'line' && s.points.length >= 2) {
        const gid = `cfill${++chartUid}`;
        const defs = svgEl('defs');
        const grad = svgEl('linearGradient', { id: gid, x1: 0, y1: 0, x2: 0, y2: 1 });
        const stopTop = svgEl('stop', { offset: 0, 'stop-opacity': 0.2 });
        stopTop.setAttribute('style', 'stop-color: var(--chart-data)');
        const stopBot = svgEl('stop', { offset: 1, 'stop-opacity': 0 });
        stopBot.setAttribute('style', 'stop-color: var(--chart-data)');
        grad.append(stopTop, stopBot);
        defs.append(grad);
        svg.append(defs);
        const first = s.points[0];
        const lastP = s.points.at(-1);
        svg.append(svgEl('path', {
          d: `${linePath(s.points)}L${px(lastP.date).toFixed(1)},${H - PAD.bottom}L${px(first.date).toFixed(1)},${H - PAD.bottom}Z`,
          fill: `url(#${gid})`,
        }));
      }
      const path = svgEl('path', {
        d: linePath(s.points),
        fill: 'none',
        stroke: s.kind === 'dashed' ? 'var(--muted)' : 'var(--chart-data)',
        'stroke-width': 2,
        'stroke-linecap': 'round',
        'stroke-linejoin': 'round',
        ...(s.kind === 'dashed' ? { 'stroke-dasharray': '5 5' } : {}),
      });
      svg.append(path);
      if (s.kind === 'line') {
        hoverSource = s;
        if (s.emphasizeLast !== false) {
          const last = s.points.at(-1);
          svg.append(svgEl('circle', { cx: px(last.date), cy: py(last.value), r: 6.5, fill: 'var(--chart-data)', opacity: 0.25 }));
          svg.append(svgEl('circle', { cx: px(last.date), cy: py(last.value), r: 3.6, fill: 'var(--chart-data)' }));
        }
        if (s.label) {
          const last = s.points.at(-1);
          const label = svgEl('text', {
            x: Math.min(px(last.date) + 6, W - PAD.right - 2),
            y: Math.max(py(last.value) - 8, 11),
            'text-anchor': px(last.date) > W - 90 ? 'end' : 'start',
            fill: 'var(--muted)', 'font-size': 10.5, 'font-family': 'var(--font-ui)',
          });
          label.textContent = s.label;
          svg.append(label);
        }
      }
    }
  }

  // crosshair + tooltip
  const wrap = h('div', { class: 'chart-wrap', style: 'position:relative' });
  wrap.append(svg);
  if (hoverSource) {
    const cross = svgEl('line', { y1: PAD.top, y2: H - PAD.bottom, stroke: 'var(--faint)', 'stroke-width': 1, visibility: 'hidden' });
    const dot = svgEl('circle', { r: 4, fill: 'var(--chart-data)', stroke: 'var(--surface)', 'stroke-width': 2, visibility: 'hidden' });
    svg.append(cross, dot);
    const tip = h('div', {
      class: 'small num',
      style: 'position:absolute;top:2px;left:0;background:var(--surface-2);border:1px solid var(--line);'
        + 'border-radius:7px;padding:3px 8px;pointer-events:none;visibility:hidden;white-space:nowrap;z-index:5',
    });
    wrap.append(tip);

    const onMove = (clientX) => {
      const rect = svg.getBoundingClientRect();
      const relX = ((clientX - rect.left) / rect.width) * W;
      let nearest = null;
      let bestDist = Infinity;
      for (const p of hoverSource.points) {
        const d = Math.abs(px(p.date) - relX);
        if (d < bestDist) { bestDist = d; nearest = p; }
      }
      if (!nearest) return;
      const cx = px(nearest.date);
      cross.setAttribute('x1', cx); cross.setAttribute('x2', cx);
      cross.setAttribute('visibility', 'visible');
      dot.setAttribute('cx', cx); dot.setAttribute('cy', py(nearest.value));
      dot.setAttribute('visibility', 'visible');
      tip.textContent = `${fmtDate(nearest.date)} · ${yFmt(nearest.value)}${cfg.yUnit ?? ''}`;
      tip.style.visibility = 'visible';
      const tipX = Math.min(Math.max((cx / W) * rect.width - 40, 2), rect.width - 110);
      tip.style.left = `${tipX}px`;
    };
    const hide = () => {
      cross.setAttribute('visibility', 'hidden');
      dot.setAttribute('visibility', 'hidden');
      tip.style.visibility = 'hidden';
    };
    svg.addEventListener('mousemove', (e) => onMove(e.clientX));
    svg.addEventListener('mouseleave', hide);
    svg.addEventListener('touchstart', (e) => onMove(e.touches[0].clientX), { passive: true });
    svg.addEventListener('touchmove', (e) => onMove(e.touches[0].clientX), { passive: true });
    svg.addEventListener('touchend', hide);
  }

  return wrap;
}


// ===== src/app/view_onboarding.js =====
// Onboarding: profil → aktuální výkony → pas → priorita → poctivý plán. Pod 3 minuty.



const LIFT_IDS = ['bench', 'squat', 'deadlift', 'ohp', 'bb_row', 'pullup'];

const draft = {
  step: 0,
  profile: { weightKg: 85, heightCm: 186, age: 21, goalWeightKg: 95, priority: 'balanced' },
  lifts: Object.fromEntries(LIFT_IDS.map((id) => [id, { weightKg: '', reps: '' }])),
  waistCm: '',
};

function renderOnboarding(root) {
  clearEl(root);
  const steps = [stepProfile, stepLifts, stepWaist, stepPriority, stepHonest];
  root.append(h('div', { class: 'onb' },
    h('div', { class: 'row between' },
      h('div', { class: 'display', style: 'font-size:26px' }, 'Fitko'),
      h('div', { class: 'label' }, `${draft.step + 1} / ${steps.length}`),
    ),
    steps[draft.step](),
  ));
}

// Pozor: inputy mění draft BEZ překreslení — na renderu se proto nesmí zakládat
// žádný stav tlačítka (popisek ani disabled). Vše se ověřuje až při kliknutí.
function nav({ nextLabel = 'Pokračovat', validate = null, onNext = null } = {}) {
  return h('div', { class: 'row onb-actions' },
    draft.step > 0
      ? h('button', { class: 'btn ghost', onClick: () => { draft.step--; rerender(); } }, 'Zpět')
      : null,
    h('button', {
      class: 'btn primary grow',
      onClick: () => {
        if (validate && !validate()) return;
        if (onNext) onNext(); else { draft.step++; rerender(); }
      },
    }, nextLabel),
  );
}

function validateProfile() {
  const p = draft.profile;
  const w = parseNum(p.weightKg);
  const hcm = parseNum(p.heightCm);
  const a = parseNum(p.age);
  const g = parseNum(p.goalWeightKg);
  if (w == null || w < 30 || w > 250) { toast('Doplň váhu v kg.'); return false; }
  if (hcm == null || hcm < 120 || hcm > 230) { toast('Doplň výšku v cm.'); return false; }
  if (a == null || a < 10 || a > 100) { toast('Doplň věk.'); return false; }
  if (g == null || g < 30 || g > 250) { toast('Doplň cílovou váhu v kg.'); return false; }
  p.weightKg = w; p.heightCm = hcm; p.age = a; p.goalWeightKg = g;
  return true;
}

function rerender() { Store.onChange?.(); }

function numField(label, value, onInput, { placeholder = '', suffix = '' } = {}) {
  return h('label', { class: 'stack', style: 'gap:5px' },
    h('span', { class: 'label' }, label),
    h('div', { class: 'row' },
      numericField(h('input', {
        class: 'num', type: 'text', inputmode: 'decimal', value, placeholder,
        onInput: (e) => onInput(e.target.value),
      })),
      suffix ? h('span', { class: 'muted small' }, suffix) : null,
    ),
  );
}

function stepProfile() {
  const p = draft.profile;
  return h('div', { class: 'stack', style: 'gap:16px;flex:1' },
    h('h2', {}, 'Tvoje čísla'),
    h('p', { class: 'muted small' }, 'Předvyplněno ze zadání — uprav, jestli něco nesedí.'),
    h('div', { style: 'display:grid;grid-template-columns:1fr 1fr;gap:12px' },
      numField('Váha', p.weightKg, (v) => { p.weightKg = parseNum(v); }, { suffix: 'kg' }),
      numField('Výška', p.heightCm, (v) => { p.heightCm = parseNum(v); }, { suffix: 'cm' }),
      numField('Věk', p.age, (v) => { p.age = parseNum(v); }, { suffix: 'let' }),
      numField('Cílová váha', p.goalWeightKg, (v) => { p.goalWeightKg = parseNum(v); }, { suffix: 'kg' }),
    ),
    nav({ validate: validateProfile }),
  );
}

function stepLifts() {
  return h('div', { class: 'stack', style: 'gap:12px;flex:1' },
    h('h2', {}, 'Co teď zvedáš?'),
    h('p', { class: 'muted small' },
      'Poslední pracovní série — váha × opakování. Co nevíš, nech prázdné: váhu najdeme spolu na prvním tréninku.'),
    ...LIFT_IDS.map((id) => liftRow(id)),
    nav(),
  );
}

function liftRow(id) {
  const lift = draft.lifts[id];
  const def = EXERCISES[id];
  const isPullup = id === 'pullup';
  return h('div', { class: 'card row', style: 'gap:8px' },
    h('div', { class: 'grow' },
      h('div', { style: 'font-weight:600;font-size:14.5px' }, def.name),
      isPullup ? h('div', { class: 'muted', style: 'font-size:12px' }, 'přídavná zátěž (0 = vlastní tělo)') : null,
    ),
    h('div', { class: 'row', style: 'gap:6px' },
      numericField(h('input', {
        class: 'num set-input', type: 'text', inputmode: 'decimal', placeholder: 'kg',
        value: lift.weightKg, style: 'width:70px',
        onInput: (e) => { lift.weightKg = e.target.value; },
      })),
      h('span', { class: 'muted' }, '×'),
      numericField(h('input', {
        class: 'num set-input', type: 'text', inputmode: 'numeric', placeholder: 'op.',
        value: lift.reps, style: 'width:56px',
        onInput: (e) => { lift.reps = e.target.value; },
      }), { decimals: false }),
    ),
  );
}

function stepWaist() {
  return h('div', { class: 'stack', style: 'gap:14px;flex:1' },
    h('h2', {}, 'Obvod pasu'),
    h('p', { class: 'muted small' },
      'Nejlevnější měřák kvality bulku: váha ↑ + pas drží = svaly. Měř v úrovni pupku, ráno nalačno, volný výdech, pásmo vodorovně. Nepovinné, ale bez něj nepoznám svaly od tuku.'),
    numField('Pas', draft.waistCm, (v) => { draft.waistCm = v; }, { placeholder: 'např. 84', suffix: 'cm' }),
    nav({
      nextLabel: 'Pokračovat',
      validate: () => {
        if (String(draft.waistCm ?? '').trim() === '') return true; // nepovinné pole
        const cm = parseNum(draft.waistCm);
        if (cm == null || cm < 40 || cm > 200) { toast('Pas zadej v cm — třeba 84,5.'); return false; }
        return true;
      },
    }),
  );
}

const PRIORITIES = [
  { id: 'mass', title: 'Hmota především', desc: '+0,30–0,35 % váhy týdně. Nejrychlejší cesta na cílovou váhu, počítej s trochou tuku navíc.' },
  { id: 'balanced', title: 'Vyvážené', desc: '+0,25–0,30 % týdně. Doporučené tempo — většina přírůstku jde do svalů.', recommended: true },
  { id: 'lean', title: 'Řez především', desc: '+0,15–0,25 % týdně. Pomalejší váha, nejčistší gain, břišáky nejdřív.' },
];

function stepPriority() {
  return h('div', { class: 'stack', style: 'gap:12px;flex:1' },
    h('h2', {}, 'Až se cíle porvou — co vyhrává?'),
    h('p', { class: 'muted small' }, `Váha ${draft.profile.goalWeightKg} kg a břišáky můžou jít proti sobě. Priorita řídí tempo výživy; kdykoli ji změníš v nastavení.`),
    ...PRIORITIES.map((p) => {
      const selected = draft.profile.priority === p.id;
      return h('button', {
        class: 'card', style: `text-align:left;display:flex;gap:12px;align-items:flex-start;width:100%${selected ? ';border-color:var(--accent)' : ''}`,
        onClick: () => { draft.profile.priority = p.id; rerender(); },
      },
        h('span', { class: `radio${selected ? ' on' : ''}`, style: 'margin-top:2px' }),
        h('div', { class: 'grow' },
          h('div', { class: 'row between' },
            h('span', { style: 'font-weight:700' }, p.title),
            p.recommended ? h('span', { class: 'badge accent' }, 'doporučeno') : null,
          ),
          h('div', { class: 'muted small', style: 'margin-top:3px' }, p.desc),
        ),
      );
    }),
    nav(),
  );
}

function stepHonest() {
  const p = draft.profile;
  // vše se počítá živě z hodnot, které uživatel právě zadal
  const plan = honestPlan({
    startWeightKg: p.weightKg, goalWeightKg: p.goalWeightKg,
    priority: p.priority, trainingAgeMonths: 0, fromIso: todayISO(),
  });
  const kgr = (a, b) => `~${String(a).replace('.', ',')}–${String(b).replace('.', ',')} kg`;
  let message;
  const rows = [];
  if (plan.mode === 'there') {
    message = 'Na cílové váze už jsi — teď rozhoduje pas a zrcadlo. Appka ti nebude lhát: pojede z tvých skutečných dat.';
  } else if (plan.mode === 'cut') {
    message = 'Jdeš dolů. Appka ti nebude lhát: tempo −0,5 % váhy týdně udrží svaly a odhalí břišáky.';
    rows.push(honestRow(`${p.goalWeightKg} kg na váze`, `~${fmtMonthYear(plan.etaIso)}`));
    rows.push(honestRow('Viditelné břišáky', 'řez je odhalí — hlídej pas'));
  } else {
    message = plan.months <= 7
      ? 'Cíl je v poctivém dosahu. Appka ti přesto nebude lhát — povede tě tempem, které dává svaly, ne tuk.'
      : 'Poctivě: tohle není projekt na pár týdnů. Appka ti nebude lhát — projekce pojede z tvých dat a subcíle podle skutečného tempa.';
    rows.push(honestRow(`${p.goalWeightKg} kg na váze`, `~${fmtMonthYear(plan.etaIso)}`));
    rows.push(honestRow('Z toho svaly', kgr(plan.muscleLo, plan.muscleHi)));
    rows.push(honestRow('Viditelné břišáky', plan.needsCut ? `po mini-cutu, ~${fmtMonthYear(plan.absEtaIso)}` : 'můžou přijít spolu s váhou'));
  }
  return h('div', { class: 'stack', style: 'gap:14px;flex:1' },
    h('div', { class: 'label' }, 'Cíl'),
    h('div', { class: 'display hero' }, `${p.goalWeightKg} kg + viditelné břišáky`),
    h('div', { class: 'card stack' },
      h('div', { class: 'label warn-text' }, 'Poctivě — spočítáno z tvých čísel'),
      h('p', { class: 'small' }, message),
      rows.length ? h('hr', { class: 'rule' }) : null,
      ...rows,
    ),
    h('p', { class: 'muted small' },
      'Program: 5× týdně Push / Pull / Legs / Upper / Lower, dvojitá progrese, reaktivní deloady, výživa řízená trendem váhy. Každé pravidlo má zdroj.'),
    nav({
      nextLabel: 'Jdeme na to',
      onNext: () => {
        if (!validateProfile()) { draft.step = 0; rerender(); return; }
        const lifts = {};
        for (const [id, lift] of Object.entries(draft.lifts)) {
          const w = parseNum(lift.weightKg);
          const r = parseInt(lift.reps, 10);
          if (w != null && !Number.isNaN(r) && r > 0) {
            lifts[id] = { weightKg: w, reps: r };
          }
        }
        Store.mutate((s) => completeOnboarding(s, {
          profile: draft.profile,
          lifts,
          waistCm: parseNum(draft.waistCm),
        }), { publish: true });
        toast('Plán je připravený.');
      },
    }),
  );
}

function honestRow(label, value) {
  return h('div', { class: 'row between' },
    h('span', { class: 'muted small' }, label),
    h('span', { class: 'small', style: 'font-weight:600;text-align:right' }, value),
  );
}

// Týden po dnech — ✓ odcvičeno, · naplánováno, — volno. Dřív to byly holé tečky
// a nebylo poznat, co znamenají.
const WEEK_DAYS = ['Po', 'Út', 'St', 'Čt', 'Pá', 'So', 'Ne'];

function weekStrip(state) {
  const today = new Date(`${todayISO()}T12:00:00`);
  const monday = new Date(today);
  monday.setDate(today.getDate() - ((today.getDay() + 6) % 7));

  const cells = [];
  let done = 0;
  let planned = 0;
  const restDays = [];

  for (let i = 0; i < 7; i++) {
    const d = new Date(monday);
    d.setDate(monday.getDate() + i);
    const iso = d.toISOString().slice(0, 10);
    const session = state.sessions.find((s) => s.date === iso);
    const isToday = iso === todayISO();
    const isTraining = state.profile.trainingDays.includes((i + 1) % 7);
    const isPast = iso < todayISO();
    if (session) done++;
    if (isTraining) planned++; else restDays.push(WEEK_DAYS[i]);

    const cls = ['wd-cell'];
    if (session) cls.push('done');
    else if (!isTraining) cls.push('rest');
    else if (isPast) cls.push('missed');
    if (isToday) cls.push('today');

    cells.push(h('div', { class: cls.join(' ') },
      h('span', { class: 'wd-day' }, WEEK_DAYS[i]),
      h('span', { class: 'wd-mark' }, session ? '✓' : isTraining ? '·' : '—'),
    ));
  }

  return h('div', { class: 'card stack', style: 'gap:9px' },
    h('div', { class: 'row between' },
      h('span', { class: 'label' }, 'Tento týden'),
      h('span', { class: 'num small muted' }, `${done}/${planned}`),
    ),
    h('div', { class: 'weekstrip' }, cells),
    h('p', { class: 'muted', style: 'font-size:12px' },
      restDays.length
        ? `Volno: ${restDays.join(', ')}. Pořadí Push → Pull → Legs → Upper → Lower jede podle odcvičených tréninků, ne podle dne — když jeden vynecháš, jen se posune.`
        : 'Trénink máš naplánovaný na každý den v týdnu.'),
  );
}

const DELOAD_REASONS = {
  performance: 'výkon u klíčových cviků padá 2 tréninky po sobě',

  failsafe: 'jedeš už 10+ týdnů bez vydechnutí',
};

function offerCards(state) {
  const cards = [];
  const offers = state.offers ?? {};

  if (offers.deload) {
    cards.push(offerCard(
      'Deload týden', 'warn',
      `Tělo si říká o vydechnutí: ${offers.deload.reasons.map((r) => DELOAD_REASONS[r.type]).join('; ')}. `
      + 'Týden na −50 % sérií a −25 % zátěže — pak zpátky silnější.',
      [
        h('button', { class: 'btn primary', onClick: () => Store.mutate((s) => acceptDeload(s), { publish: true }) }, 'Zahájit deload'),
        h('button', { class: 'btn ghost', onClick: () => Store.mutate((s) => dismissOffer(s, 'deload')) }, 'Později'),
      ],
    ));
  }

  if (offers.volume) {
    const names = offers.volume.picks.map((p) => (p.kind === 'add_exercise'
      ? `nový cvik ${EXERCISES[p.exerciseId].name}`
      : `+1 série ${EXERCISES[p.exerciseId].name}`)).join(', ');
    cards.push(offerCard(
      'Čas přidat objem', 'accent',
      `Progrese šlape a regenerace drží — engine navrhuje: ${names}.`,
      [
        h('button', { class: 'btn primary', onClick: () => Store.mutate((s) => acceptVolume(s), { publish: true }) }, 'Přidat'),
        h('button', { class: 'btn ghost', onClick: () => Store.mutate((s) => dismissOffer(s, 'volume')) }, 'Nechat jak je'),
      ],
    ));
  }

  if (offers.minicut) {
    const why = offers.minicut.reasons.map((r) => (r.type === 'whtr'
      ? 'pas přesáhl polovinu výšky'
      : `pas roste ${String(r.detail).replace('.', ',')} cm/měsíc`)).join('; ');
    cards.push(offerCard(
      'Doporučení: mini-cut', 'warn',
      `${why}. 6–8 týdnů na −0,5 % váhy týdně vrátí břišáky a sval zůstane.`,
      [
        h('button', { class: 'btn primary', onClick: () => Store.mutate((s) => acceptMinicut(s), { publish: true }) }, 'Zahájit mini-cut'),
        h('button', { class: 'btn ghost', onClick: () => Store.mutate((s) => dismissOffer(s, 'minicut')) }, 'Později'),
      ],
    ));
  }

  return cards;
}

// ===== src/app/view_workout.js =====
// Trénink: jedna scrollovací obrazovka, zápis série na jeden ťuk, auto rest timer.




function renderWorkout(root) {
  const state = Store.state;
  const workout = state.activeWorkout;
  clearEl(root);

  const elapsedMin = Math.max(0, Math.round((Date.now() - workout.startedAt) / 60000));
  const loggedWork = workout.entries.reduce(
    (a, e) => a + e.rows.filter((r) => r.kind !== 'warmup' && r.logged).length, 0);

  // první nezapsaný řádek = aktuální série (zvýrazněná)
  let nextKey = null;
  outer: for (let ei = 0; ei < workout.entries.length; ei++) {
    const rows = workout.entries[ei].rows;
    for (let ri = 0; ri < rows.length; ri++) {
      if (!rows[ri].logged) { nextKey = `${ei}:${ri}`; break outer; }
    }
  }

  root.append(h('div', { class: 'screen', style: 'padding-bottom:calc(140px + env(safe-area-inset-bottom, 0px))' },
    h('div', { class: 'session-head', style: `padding-top:max(6px, env(safe-area-inset-top, 0px))` },
      h('div', {},
        h('div', { class: 'row', style: 'gap:8px' },
          h('span', { class: 'label' }, workout.deload ? 'Deload trénink' : 'Trénink'),
          workout.deload ? h('span', { class: 'badge warn' }, '−50 % sérií · RIR 3+') : null,
          workout.backfill ? h('span', { class: 'badge accent' }, `zpětně · ${fmtDateFull(workout.date)}`) : null,
        ),
        h('div', { class: 'display unit-name' }, workout.unitName),
      ),
      h('div', { class: 'stack', style: 'align-items:flex-end;gap:6px' },
        h('button', { class: 'icon-btn', 'aria-label': 'Zrušit trénink', onClick: confirmCancel }, '✕'),
        h('span', { class: 'muted small num' }, `${elapsedMin} min`),
      ),
    ),
    state.sessions.length < 3
      ? h('p', { class: 'muted', style: 'font-size:12.5px' },
          'Šedá čísla v polích jsou návrh. Odcvičils to tak? Jen ťukni oranžové ✓. Jinak klikni do pole a napiš svoje. RIR = kolik opakování ti zbylo v rezervě.')
      : null,
    ...workout.entries.map((entry, i) => exerciseCard(state, workout, entry, i, nextKey)),
    h('button', {
      class: 'btn primary big',
      disabled: loggedWork === 0,
      onClick: finishWorkout,
    }, 'Dokončit trénink'),
  ));
}

function confirmCancel() {
  const { close } = openModal(
    h('h3', {}, 'Zahodit trénink?'),
    h('p', { class: 'muted small' }, 'Zapsané série se neuloží do historie.'),
    h('div', { class: 'row' },
      h('button', { class: 'btn danger grow', onClick: () => { RestTimer.stop(); Store.mutate((s) => { s.activeWorkout = null; }); close(); } }, 'Zahodit'),
      h('button', { class: 'btn grow', onClick: () => close() }, 'Zpět k tréninku'),
    ),
  );
}

function exerciseCard(state, workout, entry, entryIndex, nextKey) {
  const def = EXERCISES[entry.exerciseId];
  const p = entry.prescription;
  const calibrating = p.action === 'calibrate';
  const recent = recentPerformances(state, entry.exerciseId, 1)[0];
  const ghostSets = recent ? recent.sets.filter((s) => !s.isWarmup && !s.isDropset) : [];

  const rangeText = `${p.targetReps.length}× ${def.repRange[0]}–${p.rangeHi ?? def.repRange[1]}`;
  const rirText = workout.deload ? 'RIR 3+' : `RIR ${def.rir[0]}–${def.rir[1]}`;
  const restText = `pauza ${fmtRest(restSecondsFor(entry.exerciseId))}`;

  return h('div', { class: 'card ex-card' },
    h('div', { class: 'ex-head' },
      h('div', { class: 'grow' },
        h('div', { class: 'ex-title' }, def.name, entry.swappedFrom ? h('span', { class: 'muted small' }, ' (náhrada)') : null),
        h('div', { class: 'ex-sub' }, `${rangeText} · ${rirText} · ${restText}`,
          actionNote(p) ? h('span', { class: 'accent-text' }, actionNote(p)) : null),
      ),
      h('button', { class: 'icon-btn', 'aria-label': 'Proč tenhle cvik', onClick: () => whyModal(def) }, 'ⓘ'),
      h('button', { class: 'icon-btn', 'aria-label': 'Vyměnit cvik', onClick: () => swapModal(state, entryIndex, def) }, '⇄'),

    calibrating
      ? h('div', { class: 'small', style: 'padding:0 14px 10px;color:var(--accent)' },
          `Kalibrace: najdi váhu na ~${p.targetReps[0]} opakování při ${rirText}.`)
      : null,
    ...entry.rows.map((row, rowIndex) => setRow(workout, entry, entryIndex, row, rowIndex, ghostSets, nextKey)),
  );
}

function actionNote(p) {
  const notes = {
    increase_load: ' · dnes se přidává',
    reduce_load: ' · lehčí — restart progrese',

}

function swapModal(state, entryIndex, def) {

// ---------- řádek série ----------

function setRow(workout, entry, entryIndex, row, rowIndex, ghostSets, nextKey) {
  const def = EXERCISES[entry.exerciseId];
  const done = !!row.logged;

  // dropset cíl se dopočítá z poslední zapsané pracovní série
  let target = row.target;
  if (row.kind === 'drop') {
    const lastWork = [...entry.rows].reverse().find((r) => r.kind === 'work' && r.logged);
    const base = lastWork?.logged.weightKg ?? entry.prescription.loadKg;
    const drop = base != null ? dropsetPrescription(def, base) : null;
    target = { weightKg: drop?.dropLoadKg ?? null, reps: null };
  }

  const workIndex = entry.rows.filter((r) => r.kind === 'work').indexOf(row);
  const ghost = row.kind === 'work' && ghostSets[workIndex]
    ? `min. ${fmtKg(ghostSets[workIndex].weightKg, true)}×${ghostSets[workIndex].reps}${ghostSets[workIndex].rir != null ? `@${ghostSets[workIndex].rir}` : ''}`
    : null;

  // Cíl je jen šedý NÁVRH v placeholderu — nemusíš nic mazat, klikneš a píšeš.
  // Prázdné pole při potvrzení znamená „odcvičeno přesně podle návrhu".
  // Rozepsané hodnoty se průběžně ukládají do row.draft, takže je nesmaže
  // překreslení obrazovky (potvrzení jiné série, výměna cviku…).
  // type=text + inputmode: iOS klávesnice píše desetinnou čárku a number-pole by ji zahodilo.
  const draft = row.draft ?? null;
  const shownWeight = row.logged ? row.logged.weightKg : draft?.weightKg;
  const shownReps = row.logged ? row.logged.reps : draft?.reps;

  const weightInput = h('input', {
    class: 'set-input', type: 'text', inputmode: 'decimal',
    placeholder: target.weightKg != null ? fmtInput(target.weightKg) : 'kg',
    value: shownWeight != null ? fmtInput(shownWeight) : '',
    disabled: done,
  });
  const repsInput = h('input', {
    class: 'set-input', type: 'text', inputmode: 'numeric',
    placeholder: target.reps != null ? String(target.reps) : (row.kind === 'drop' ? 'selh.' : 'op.'),
    value: shownReps != null ? String(shownReps) : '',
    disabled: done,
  });

  let rir = row.logged ? (row.logged.rir ?? null)
    : draft?.rir != null ? draft.rir
    : (row.kind === 'work' && !workout.deload ? def.rir[0] : null);

  const saveDraft = () => Store.mutate((s) => {
    const r = s.activeWorkout.entries[entryIndex].rows[rowIndex];
    const w = parseNum(weightInput.value);
    const rp = repsInput.value.trim();
    r.draft = { weightKg: w, reps: rp === '' ? null : parseInt(rp, 10), rir };
  }, { rerender: false });

  numericField(weightInput);
  numericField(repsInput, { decimals: false });
  weightInput.addEventListener('input', saveDraft);
  repsInput.addEventListener('input', saveDraft);

  const rirChips = row.kind === 'work'
    ? h('div', { class: 'rir-chips', role: 'group', 'aria-label': 'RIR' },
        ...[0, 1, 2, 3, 4].map((v) => {
          const chip = h('button', {
            class: `rir-chip${rir === v ? ' active' : ''}`,
            disabled: done,
            onClick: () => {
              rir = v;
              chip.parentElement.querySelectorAll('.rir-chip').forEach((c) => c.classList.remove('active'));
              chip.classList.add('active');
              saveDraft();
            },
          }, String(v));
          return chip;
        }))
    : null;

  const label = row.kind === 'warmup' ? 'W · rozcvička' : row.kind === 'drop' ? 'Dropset (−22 %)' : `Série ${workIndex + 1}`;

  const onCheck = () => {
    if (done) {
      // Odznačení nesmí nic ztratit: zapsané hodnoty se vrátí do polí jako rozepsané
      // a cíle zbývajících sérií se přepočítají, jako by série nikdy zapsaná nebyla.
      Store.mutate((s) => {
        const e = s.activeWorkout.entries[entryIndex];
        const r = e.rows[rowIndex];
        r.draft = { weightKg: r.logged.weightKg, reps: r.logged.reps, rir: r.logged.rir ?? null };
        r.logged = null;
        recomputeEntryTargets(EXERCISES[e.exerciseId], e);
      });
      return;
    }
    // prázdné pole = beru návrh z placeholderu
    const weightKg = parseNum(weightInput.value) ?? target.weightKg;
    const typedReps = repsInput.value.trim();
    const reps = typedReps === '' ? target.reps : parseInt(typedReps, 10);
    if (reps == null || Number.isNaN(reps) || reps <= 0) { toast('Doplň opakování.'); return; }
    if ((weightKg == null || weightKg < 0) && def.incrementRule !== 'bodyweight') { toast('Doplň váhu.'); return; }
    let adjusted = null;
    Store.mutate((s) => {
      const e = s.activeWorkout.entries[entryIndex];
      const r = e.rows[rowIndex];
      r.logged = {
        weightKg: weightKg == null ? 0 : weightKg,
        reps,
        ...(row.kind === 'work' && rir != null ? { rir } : {}),
      };
      delete r.draft;
      // predikce + autoregulace: cíle zbytku cviku se počítají vždy načisto
      if (row.kind === 'work' && !s.activeWorkout.deload) {
        adjusted = recomputeEntryTargets(EXERCISES[e.exerciseId], e);
      }
    });
    if (adjusted === 'up') toast('Měl jsi rezervu — další série jde nahoru.');
    if (adjusted === 'down') toast('Bylo to na hraně — další série má nižší cíl.');
    if (row.kind !== 'warmup') {
      RestTimer.start(restSecondsFor(entry.exerciseId), nextUpLabel(Store.state.activeWorkout));
    } else {
      RestTimer.start(60, nextUpLabel(Store.state.activeWorkout));
    }
  };

  const adjNote = row.adjusted === 'up' ? '↑ přidáno — měl jsi rezervu'
    : row.adjusted === 'down' ? '↓ ubráno — bylo to na hraně' : null;
  const ghostText = adjNote ?? (row.kind === 'drop' ? 'hned, bez pauzy, do selhání' : ghost ?? (row.kind === 'warmup' ? 'lehce, bez RIR' : 'první záznam'));

  const isNext = !done && nextKey === `${entryIndex}:${rowIndex}`;
  return h('div', { class: `set-block${done ? ' done' : ''}${row.kind === 'warmup' ? ' warmup' : ''}${isNext ? ' next' : ''}` },
    h('div', { class: 'set-line' },
      h('div', { class: 'set-id' },
        h('span', { class: 'set-no' }, label),
        h('span', { class: 'ghost-val' }, ghostText),
      ),
      h('div', { class: 'set-fields' },
        weightInput,
        h('span', { class: 'set-x' }, '×'),
        repsInput,
      ),
      h('button', { class: `check-btn${done ? ' done' : ''}`, 'aria-label': done ? 'Odznačit sérii' : 'Potvrdit sérii', onClick: onCheck }, '✓'),
    ),
    rirChips ? h('div', { class: 'rir-line' },
      h('span', { class: 'label' }, 'RIR'),
      rirChips,
    ) : null,
  );
}

function nextUpLabel(workout) {
  for (const entry of workout.entries) {
    for (const row of entry.rows) {
      if (!row.logged) {
        const def = EXERCISES[entry.exerciseId];
        const t = row.target;
        const what = t.weightKg != null && t.reps != null
          ? `${fmtKg(t.weightKg, true)} kg × ${t.reps}`
          : t.reps != null ? `× ${t.reps}` : 'dropset';
        return `Další: ${def.name} ${what}`;
      }
    }
  }
  return 'Poslední série — pak Dokončit.';
}

function statTiles(summary) {

    tile(summary.avg7 != null ? fmtKg(summary.avg7, true) : '—', 'kg · 7denní ⌀'),

function tile(value, label) {
