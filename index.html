const RECIPE_IDS = RECIPES.map((r) => r.id);

function recipeById(id, customRecipes = []) {
  return RECIPES.find((r) => r.id === id) ?? customRecipes.find((r) => r.id === id) ?? null;
}

/** Recept jako jídlo appky (id r_<recept>) — makra a snědeno fungují beze změny. */
function recipeToMeal(recipe) {
  const slot = recipe.kind === 'hlavni' ? null : recipe.kind;
  return { id: `r_${recipe.id}`, name: recipe.name, slot, items: recipe.items.map((it) => ({ ...it })), recipeId: recipe.id, starter: true };
}

/** Makra referenční porce receptu. */
function recipeMacros(recipe, customFoods = []) {
  return roundMacros(mealMacros({ items: recipe.items }, customFoods));
}


// ===== src/engine/cooking.js =====
// Plán vaření do krabiček: dvě vaření týdně (neděle → Po–St, středa → Čt–Ne),
// každé vaření 2 jídla, krabičky pro oba podle jejich kalorií, snídaně a svačiny
// na každého zvlášť. Deterministické podle seedu (stejný vstup = stejný plán),
// s pestrostí (jiná bílkovina v každém jídle, nic z minulého týdne).

const BOX_SLOTS = ['obed', 'vecere'];
const BOX_SHARE = (FOOD_SLOTS.find((s) => s.id === 'obed').share + FOOD_SLOTS.find((s) => s.id === 'vecere').share) / 2; // 0,275
const BREAKFAST_SHARE = FOOD_SLOTS.find((s) => s.id === 'snidane').share; // 0,25
const SNACK_SHARE = FOOD_SLOTS.find((s) => s.id === 'svacina1').share;    // 0,10
const PORTION_STEP_BOX = 0.05;

// Neděle a středa: vaření pokrývá Po–St (3 dny) a Čt–Ne (4 dny).
function cookSessionsFor(weekStart, cookDays = [0, 3]) {
  const days = weekDays(weekStart);
  const [a, b] = cookDays.length === 2 ? cookDays : [0, 3];
  // cookDays: den v týdnu (0 = Ne). Neděle před týdnem = weekStart − 1.
  const cookDate = (dow) => (dow === 0 ? addDays(weekStart, -1) : addDays(weekStart, dow - 1));
  const splitAt = b === 0 ? 7 : b - 1; // index prvního dne druhého vaření (St = 2 → Čt = 3)
  return [
    { id: 'A', cookDate: cookDate(a), coversDays: days.slice(0, Math.max(1, Math.min(7, splitAt + 1))) },
    { id: 'B', cookDate: cookDate(b), coversDays: days.slice(Math.max(1, Math.min(7, splitAt + 1))) },
  ].filter((s) => s.coversDays.length);
}

// Násobek referenční porce pro člověka a jídlo (kolikrát víc než referenční porce).
function portionFactor(memberKcal, share, recipeKcal) {
  if (!(recipeKcal > 0) || !(memberKcal > 0)) return 1;
  const raw = (memberKcal * share) / recipeKcal;
  return Math.round(Math.round(clamp(raw, 0.5, 2.2) / PORTION_STEP_BOX) * PORTION_STEP_BOX * 100) / 100;
}

function seededRandom(seed) {
  let s = 0;
  for (const ch of String(seed)) s = (s * 31 + ch.charCodeAt(0)) >>> 0;
  return () => { s = (s * 1664525 + 1013904223) >>> 0; return s / 4294967296; };
}

/**
 * Výběr jídel do vaření: pestrá bílkovina, vydrží do posledního dne (nebo mrazák),
 * přednost tomu, co je v akci, nic z minulého týdne, nic vyloučeného.
 */
function pickDishes(candidates, count, { minFridgeDays, used, proteins, rnd, discounted, customFoods }) {
  const scored = candidates
    .filter((r) => !used.has(r.id))
    .filter((r) => r.fridgeDays >= minFridgeDays || r.freezer)
    .map((r) => {
      const disc = mealDiscountShare({ items: r.items }, discounted);
      const m = recipeMacros(r, customFoods);
      const density = m.p / Math.max(m.kcal, 1);
      const sameProtein = proteins.has(r.protein) ? -2 : 0;
      const fits = r.fridgeDays >= minFridgeDays ? 0.4 : 0; // bez mrazení je jednodušší
      return { r, score: disc * 2 + density * 6 + sameProtein + fits + rnd() * 0.8 };
    })
    .sort((a, b) => b.score - a.score);
  const out = [];
  for (const { r } of scored) {
    if (out.length >= count) break;
    if (out.some((x) => x.protein === r.protein)) continue;
    out.push(r);
    used.add(r.id);
    proteins.add(r.protein);
  }
  // kdyby pestrost nešla dodržet, doplň bez ohledu na bílkovinu
  for (const { r } of scored) {
    if (out.length >= count) break;
    if (out.includes(r) || used.has(r.id)) continue;
    out.push(r); used.add(r.id);
  }
  return out;
}

/**
 * Naplánuje týden vaření.
 * @param members { [userId]: { name, kcal, proteinG } } — oba lidé (kdo chybí, ten se neplánuje)
 * @param previous pole receptů z minulého týdne (pestrost mezi týdny)
 * @param pick volitelný výběr (z AI návrhu): { A: [ids], B: [ids], breakfasts: {userId: [ids]}, snacks: {userId: [ids]} }
 * @returns plán { weekStart, updatedAt, sessions: [{ id, cookDate, coversDays, dishes: [{ recipeId, boxes: {uid: n}, factor: {uid: f} }], cooked }], breakfasts, snacks, assignments: { iso: { obed: recipeId, vecere: recipeId } } }
 */
function planCookWeek({ weekStart, members, customRecipes = [], customFoods = [], discounted = {}, cookDays = [0, 3], previous = [], seed = weekStart, pick = null, exclude = [] }) {
  const memberIds = Object.keys(members).filter((id) => members[id]?.kcal > 0);
  if (!memberIds.length) return null;
  const all = [...RECIPES, ...customRecipes].filter((r) => !exclude.includes(r.id));
  const mains = all.filter((r) => r.kind === 'hlavni');
  const rnd = seededRandom(seed);
  const used = new Set(previous);
  const proteins = new Set();
  const sessions = cookSessionsFor(weekStart, cookDays).map((s) => {
    const wanted = pick?.[s.id]?.map((id) => recipeById(id, customRecipes)).filter(Boolean) ?? [];
    for (const r of wanted) { used.add(r.id); proteins.add(r.protein); }
    const dishes = wanted.length >= 2 ? wanted.slice(0, 2)
      : [...wanted, ...pickDishes(mains, 2 - wanted.length, { minFridgeDays: s.coversDays.length, used, proteins, rnd, discounted, customFoods })];
    return { ...s, dishes, cooked: false };
  });

  // Přiřazení: den 1 oběd = jídlo 1, večeře = jídlo 2; další den prohodit — nikdy totéž dvakrát za den.
  const assignments = {};
  for (const s of sessions) {
    s.coversDays.forEach((iso, i) => {
      const [d1, d2] = s.dishes.length >= 2 ? s.dishes : [s.dishes[0], s.dishes[0]];
      assignments[iso] = i % 2 === 0 ? { obed: d1?.id ?? null, vecere: d2?.id ?? null } : { obed: d2?.id ?? null, vecere: d1?.id ?? null };
    });
  }

  // Krabičky a násobky porcí na člověka a jídlo.
  const outSessions = sessions.map((s) => ({
    id: s.id, cookDate: s.cookDate, coversDays: s.coversDays, cooked: false,
    dishes: s.dishes.map((r) => {
      const m = recipeMacros(r, customFoods);
      const boxes = {}; const factor = {};
      for (const uid of memberIds) {
        boxes[uid] = s.coversDays.reduce((n, iso) => n + BOX_SLOTS.filter((slot) => assignments[iso][slot] === r.id).length, 0);
        factor[uid] = portionFactor(members[uid].kcal, BOX_SHARE, m.kcal);
      }
      return { recipeId: r.id, boxes, factor };
    }),
  }));

  // Snídaně a svačiny: 2 + 2 na člověka, střídají se po dnech (Po–Čt / Pá–Ne).
  const breakfasts = {}; const snacks = {};
  const bfAll = all.filter((r) => r.kind === 'snidane');
  const snAll = all.filter((r) => r.kind === 'svacina');
  const rotate = (arr, n, offset) => arr.length ? Array.from({ length: n }, (_, i) => arr[(i + offset) % arr.length]) : [];
  memberIds.forEach((uid, idx) => {
    const wantedB = pick?.breakfasts?.[uid]?.map((id) => recipeById(id, customRecipes)).filter(Boolean);
    const wantedS = pick?.snacks?.[uid]?.map((id) => recipeById(id, customRecipes)).filter(Boolean);
    const bf = wantedB?.length ? wantedB.slice(0, 2) : rotate([...bfAll].sort(() => rnd() - 0.5), 2, idx);
    const sn = wantedS?.length ? wantedS.slice(0, 2) : rotate([...snAll].sort(() => rnd() - 0.5), 2, idx);
    breakfasts[uid] = bf.map((r) => ({ recipeId: r.id, factor: portionFactor(members[uid].kcal, BREAKFAST_SHARE, recipeMacros(r, customFoods).kcal) }));
    snacks[uid] = sn.map((r) => ({ recipeId: r.id, factor: portionFactor(members[uid].kcal, SNACK_SHARE, recipeMacros(r, customFoods).kcal) }));
  });

  return { weekStart, updatedAt: new Date().toISOString(), cookDays, members: memberIds, sessions: outSessions, breakfasts, snacks, assignments };
}

/** Vymění jídlo ve vaření (zachová krabičky, přepočítá násobky). */
function swapDish(plan, sessionId, oldRecipeId, newRecipeId, members, customRecipes = [], customFoods = []) {
  const s = plan.sessions.find((x) => x.id === sessionId);
  const dish = s?.dishes.find((d) => d.recipeId === oldRecipeId);
  const r = recipeById(newRecipeId, customRecipes);
  if (!s || !dish || !r) return plan;
  const m = recipeMacros(r, customFoods);
  dish.recipeId = newRecipeId;
  for (const uid of Object.keys(dish.factor)) dish.factor[uid] = portionFactor(members[uid]?.kcal, BOX_SHARE, m.kcal);
  for (const iso of s.coversDays) for (const slot of BOX_SLOTS) if (plan.assignments[iso]?.[slot] === oldRecipeId) plan.assignments[iso][slot] = newRecipeId;
  plan.updatedAt = new Date().toISOString();
  return plan;
}

/** Denní rozpis jednoho člověka z plánu vaření — přesně ve tvaru, který appka používá pro „Dnes“. */
function userDayPlans(plan, userId, customRecipes = []) {
  if (!plan?.assignments || !plan.members?.includes(userId)) return null;
  const days = {};
  const dayList = weekDays(plan.weekStart);
  const bf = plan.breakfasts?.[userId] ?? [];
  const sn = plan.snacks?.[userId] ?? [];
  dayList.forEach((iso, i) => {
    const day = {};
    const b = bf.length ? bf[i < 4 ? 0 : 1 % bf.length] : null;
    if (b) day.snidane = { mealId: `r_${b.recipeId}`, portion: b.factor };
    if (sn[0]) day.svacina1 = { mealId: `r_${sn[0].recipeId}`, portion: sn[0].factor };
    if (sn[1] ?? sn[0]) day.svacina2 = { mealId: `r_${(sn[1] ?? sn[0]).recipeId}`, portion: (sn[1] ?? sn[0]).factor };
    for (const slot of BOX_SLOTS) {
      const rid = plan.assignments[iso]?.[slot];
      if (!rid) continue;
      const dish = plan.sessions.flatMap((s) => s.dishes).find((d) => d.recipeId === rid);
      day[slot] = { mealId: `r_${rid}`, portion: dish?.factor?.[userId] ?? 1 };
    }
    days[iso] = day;
  });
  return days;
}

/** Suroviny jednoho jídla ve vaření: celkem gramů podle krabiček obou. */
function dishIngredients(dish, recipe) {
  const portions = Object.keys(dish.boxes).reduce((a, uid) => a + (dish.boxes[uid] ?? 0) * (dish.factor[uid] ?? 1), 0);
  return { portions: Math.round(portions * 100) / 100, items: recipe.items.map((it) => ({ foodId: it.foodId, grams: Math.round(it.grams * portions), perPortion: it.grams })) };
}

/**
 * Nákupní seznam domácnosti z plánu vaření: všechna vaření + snídaně a svačiny obou
 * × dny, sečteno a zaokrouhleno na balení. Stejný tvar jako shoppingList, navíc
 * „uses“ = ve kterých jídlech se surovina používá.
 */
function householdShoppingList(plan, customRecipes = [], customFoods = [], discounted = {}) {
  const grams = {}; const uses = {};
  const add = (foodId, g, name) => { grams[foodId] = (grams[foodId] ?? 0) + g; (uses[foodId] ??= new Set()).add(name); };
  for (const s of plan?.sessions ?? []) {
    for (const d of s.dishes) {
      const r = recipeById(d.recipeId, customRecipes);
      if (!r) continue;
      const { items } = dishIngredients(d, r);
      for (const it of items) add(it.foodId, it.grams, r.name);
    }
  }
  const dayList = weekDays(plan.weekStart);
  for (const uid of plan.members ?? []) {
    const bf = plan.breakfasts?.[uid] ?? [];
    const sn = plan.snacks?.[uid] ?? [];
    dayList.forEach((iso, i) => {
      const b = bf.length ? bf[i < 4 ? 0 : 1 % bf.length] : null;
      const entries = [b, sn[0], sn[1] ?? sn[0]].filter(Boolean);
      for (const e of entries) {
        const r = recipeById(e.recipeId, customRecipes);
        if (!r) continue;
        for (const it of r.items) add(it.foodId, it.grams * e.factor, r.name);
      }
    });
  }
  const byCat = {};
  for (const [foodId, g] of Object.entries(grams)) {
    const food = foodById(foodId, customFoods);
    if (!food) continue;
    const packG = food.packG ?? 500;
    const packs = Math.max(1, Math.ceil(g / packG - 0.05));
    const countable = !!food.pieceG && (food.loose || /\bks\b/.test(food.packLabel ?? ''));
    const pieces = countable ? Math.ceil(g / food.pieceG) : null;
    const cat = food.cat ?? 'ostatni';
    (byCat[cat] ??= []).push({
      foodId, name: food.name, grams: Math.round(g), packs, pieces,
      packLabel: food.packLabel ?? (packG >= 1000 ? `${packG / 1000} kg` : `${packG} g`),
      discount: discounted[foodId] ?? null,
      uses: [...(uses[foodId] ?? [])],
    });
  }
  return Object.keys(FOOD_CATEGORIES)
    .filter((cat) => byCat[cat])
    .map((cat) => ({ cat, label: FOOD_CATEGORIES[cat], items: byCat[cat].sort((a, b) => b.grams - a.grams) }));
}

/** Kolik krabiček pro koho a jak velké (na kartu vaření). */
function dishSummary(dish, recipe, members, customFoods = []) {
  const m = recipeMacros(recipe, customFoods);
  const total = Object.values(dish.boxes).reduce((a, n) => a + n, 0);
  const per = Object.keys(dish.boxes).map((uid) => ({
    userId: uid, name: members[uid]?.name ?? uid, boxes: dish.boxes[uid], factor: dish.factor[uid],
    kcal: Math.round(m.kcal * dish.factor[uid]), p: Math.round(m.p * dish.factor[uid]),
  }));
  return { total, per, ref: m };
}

function h(tag, props = {}, ...children) {
  const el = document.createElement(tag);
  for (const [key, val] of Object.entries(props ?? {})) {
    if (val == null || val === false) continue;
    if (key === 'class') el.className = val;
    else if (key === 'text') el.textContent = val;
    else if (key === 'html') el.innerHTML = val;
    else if (key.startsWith('on')) el.addEventListener(key.slice(2).toLowerCase(), val);
    else if (key === 'dataset') Object.assign(el.dataset, val);
    else if (key in el && key !== 'type' && key !== 'value') { try { el[key] = val; } catch { el.setAttribute(key, val); } }
    else el.setAttribute(key, val === true ? '' : val);
  }
  for (const child of children.flat(Infinity)) {
    if (child == null || child === false) continue;
    el.append(child.nodeType ? child : document.createTextNode(String(child)));
  }
  return el;
}

function clearEl(el) { while (el.firstChild) el.removeChild(el.firstChild); }

// Verzi vkládá build; mimo build (dev/testy) je prázdná.

function fmtDate(iso) {

function fmtKg(kg, unitless = false) {

// iOS česká klávesnice píše čárku — parsujeme obojí, zobrazujeme čárku.
function parseNum(v) {

/**
 * Do číselného pole nepustí nic než číslice a jeden desetinný oddělovač.
 * Chrání před zbytky z diktování, chytré klávesnice nebo omylem vloženého textu.
 */
function numericField(input, { decimals = true } = {}) {
  const clean = () => {
    const before = input.value;
    let out = before.replace(decimals ? /[^0-9.,]/g : /[^0-9]/g, '');
    if (decimals) {
      const firstSep = out.search(/[.,]/);
      if (firstSep !== -1) {
        out = out.slice(0, firstSep + 1) + out.slice(firstSep + 1).replace(/[.,]/g, '');
      }
    }
    if (out !== before) {
      const pos = Math.max(0, (input.selectionStart ?? out.length) - (before.length - out.length));
      input.value = out;
      try { input.setSelectionRange(pos, pos); } catch { /* pole to nemusí umět */ }
    }
  };
  input.addEventListener('input', clean);
  return input;
}

function fmtSigned(n, digits = 0) {
  const v = digits ? Math.abs(n).toFixed(digits).replace('.', ',') : String(Math.abs(n));
  return n >= 0 ? `+${v}` : `−${v}`;
}

let toastTimeout = null;

function openModal(...content) {

  backdrop.append(modal);

  const close = () => backdrop.remove();
  return { close, modal };
}

// ===== src/app/storage.js =====
// Úložiště: localStorage (rychlé, per zařízení) + samo-publikace artifactu (trvalé, přežije
// i ztrátu telefonu — stav je vložený přímo v HTML stránky). Publikace RELOADUJE otevřený
// pohled, proto se volá jen na bezpečných hranicích (konec tréninku, onboarding, vážení),
// nikdy uprostřed zápisu série. Záloha: export/import JSON.

const STATE_BASE_KEY = 'fitko-state-v1';
const BACKUP_BASE_KEY = 'fitko-state-backup-v1';
const stateKey = () => userKey(STATE_BASE_KEY);
const backupKey = () => userKey(BACKUP_BASE_KEY);
const STATE_SCRIPT_RE = /(<script type="application\/json" id="fitko-state">)[\s\S]*?(<\/script>)/;

let originalHtml = null; // snímek dokumentu před prvním renderem — šablona pro publish
let artifactNs;          // Promise<namespace|null>
let downloadsNs;

const storageInfo = {
  localOk: false, artifactOk: null, lastPublish: null, publishError: null,
  hadStoredData: false, damagedFound: false, persisted: null,
};

// Jakmile jednou uvidíme uložené tréninky, prázdný stav je už NIKDY nesmí přepsat.
let hadStoredData = false;

function captureDocument() {
  originalHtml = `<!doctype html>\n${document.documentElement.outerHTML}`;
}

function initCapabilities() {
  const use = (name) => {
    try {
      if (typeof window !== 'undefined' && window.claude?.use) return window.claude.use(name);
    } catch { /* mimo artifact runtime */ }
    return Promise.resolve(null);
  };
  artifactNs = use('artifact');
  downloadsNs = use('downloads');
  artifactNs.then((ns) => { storageInfo.artifactOk = ns != null; });
}

function detectLocal() {
  try {
    localStorage.setItem('fitko-probe', '1');
    localStorage.removeItem('fitko-probe');
    return true;
  } catch { return false; }
}

function loadPersistedState() {
  storageInfo.localOk = detectLocal();

  let embedded = null;
  try {
    const node = document.getElementById('fitko-state');
    if (node) {
      const parsed = JSON.parse(node.textContent);
      if (!parsed.__empty) embedded = parsed;
    }
  } catch { embedded = null; }

  let local = null;
  if (storageInfo.localOk) {
    const raw = localStorage.getItem(stateKey());
    if (raw) {
      try {
        local = JSON.parse(raw);
      } catch {
        // Poškozený zápis nesmíme přepsat — uschováme ho stranou k případné záchraně.
        try { localStorage.setItem(`${userKey('fitko-state-damaged')}-${Date.now()}`, raw); } catch { /* plno */ }
        storageInfo.damagedFound = true;
        local = null;
      }
    }
  }

  const chosen = local && embedded
    ? ((local.updatedAt ?? '') >= (embedded.updatedAt ?? '') ? local : embedded)
    : (local ?? embedded ?? null);

  // Zapamatuj si, že v zařízení JSOU data (i když je zrovna nešlo načíst) —
  // saveLocal pak odmítne přepsat je prázdným stavem.
  hadStoredData = !!(chosen?.sessions?.length) || storageInfo.damagedFound
    || !!(readBackup()?.state?.sessions?.length);
  storageInfo.hadStoredData = hadStoredData;

  try { navigator.storage?.persisted?.().then((p) => { storageInfo.persisted = p; }); } catch { /* nepodstatné */ }

  return chosen;
}

/**
 * Pojistka: snímek stavu, jak vypadal PŘED tímhle spuštěním appky.
 * Kdyby cokoli (nová verze, chyba, omylem smazaná data) rozbilo aktuální stav,
 * odcvičené tréninky jdou vrátit z Nastavení. Ukládá se jen neprázdný stav.
 */
function backupState(state) {
  if (!storageInfo.localOk || !state?.sessions?.length) return;
  try {
    localStorage.setItem(backupKey(), JSON.stringify({ savedAt: new Date().toISOString(), state }));
  } catch { /* plné úložiště — záloha není kritická */ }
}

function readBackup() {
  if (!storageInfo.localOk) return null;
  try {
    const parsed = JSON.parse(localStorage.getItem(backupKey()) ?? 'null');
    return parsed?.state?.profile && Array.isArray(parsed.state.sessions) ? parsed : null;
  } catch { return null; }
}

function saveLocal(state, { force = false } = {}) {
  if (!storageInfo.localOk) return;
  // TVRDÁ POJISTKA: stav bez odcvičených tréninků nikdy nepřepíše uložená data.
  // (Selhalo načtení, jiné okno v onboardingu, chyba při startu… data mají přednost.)
  if (!force && hadStoredData && !state?.sessions?.length) return;
  try {
    localStorage.setItem(stateKey(), JSON.stringify(state));
    if (state?.sessions?.length) { hadStoredData = true; storageInfo.hadStoredData = true; }
  } catch { storageInfo.localOk = false; }
}

/**
 * Prohledá úložiště zařízení na VŠECHNY záznamy Fitka (hlavní stav, automatická
 * záloha, poškozené i staré zápisy) a vrátí, co se z nich dá zachránit.
 */
function scanStoredStates() {
  if (!storageInfo.localOk) return [];
  const out = [];
  let keys = [];
  try { keys = Object.keys(localStorage).filter((k) => k.startsWith('fitko-')); } catch { return []; }
  for (const key of keys) {
    let raw = '';
    try { raw = localStorage.getItem(key) ?? ''; } catch { continue; }
    if (!raw || raw.length < 40) continue;
    let state = null;
    try {
      const parsed = JSON.parse(raw);
      state = parsed?.state?.profile ? parsed.state : (parsed?.profile ? parsed : null);
    } catch { state = null; }
    out.push({
      key,
      sizeKb: Math.round(raw.length / 1024),
      sessions: state?.sessions?.length ?? 0,
      lastDate: state?.sessions?.length ? state.sessions[state.sessions.length - 1].date : null,
      readable: !!state,
      state,
    });
  }
  return out.sort((a, b) => b.sessions - a.sessions || b.sizeKb - a.sizeKb);
}

// Vědomé smazání všeho uživatelem — jediná cesta, jak pojistku obejít.
// Maže jen data TOHOHLE uživatele (druhý člověk na stejném telefonu o nic nepřijde)
// a nastavení zálohy; volba uživatele zůstává.
function wipeAllData() {
  hadStoredData = false;
  storageInfo.hadStoredData = false;
  try {
    const other = otherUser();
    for (const key of Object.keys(localStorage)) {
      if (!key.startsWith('fitko-') || key === USER_KEY) continue;
      if (other && key.includes(`-${other}`)) continue;
      if (activeUser !== 'niklas' && /^fitko-state(-backup)?-v1$/.test(key)) continue; // data Niklase
      localStorage.removeItem(key);
    }
  } catch { /* noop */ }
}

function escapeForScriptTag(json) {
  return json.replace(/</g, '\\u003c');
}

// Publikace nové verze artifactu se stavem vloženým do HTML. Reloaduje stránku!
async function publishState(state) {
  const ns = await artifactNs;
  if (!ns || !originalHtml) return { ok: false, reason: 'unavailable' };
  const json = escapeForScriptTag(JSON.stringify(state));
  const html = originalHtml.replace(STATE_SCRIPT_RE, (m, open, close) => `${open}${json}${close}`);
  try {
    await ns.publish(html);
    storageInfo.lastPublish = new Date().toISOString();
    return { ok: true };
  } catch (err) {
    storageInfo.publishError = err?.code ?? String(err);
    // conflict → jiný pohled publikoval první, stránka se sama reloadne na vítěze
    return { ok: false, reason: storageInfo.publishError };
  }
}

async function exportJSON(state) {
  const data = JSON.stringify(state, null, 2);
  const filename = `fitko-zaloha-${currentUser() ?? 'export'}-${(state.updatedAt ?? '').slice(0, 10) || 'export'}.json`;
  const ns = await downloadsNs;
  if (ns) {
    try {
      await ns.save({ filename, data });
      return { ok: true, via: 'downloads' };
    } catch { /* pokračuj fallbackem */ }
  }
  try {
    await navigator.clipboard.writeText(data);
    return { ok: true, via: 'clipboard' };
  } catch {
    return { ok: false, data };
  }
}

function parseImportedJSON(text) {
  const parsed = JSON.parse(text);
  if (typeof parsed !== 'object' || parsed == null || !parsed.profile || !parsed.version) {
    throw new Error('Tohle nevypadá jako záloha Fitka.');
  }
  return parsed;
}


// ===== src/app/cloud.js =====
// Automatická záloha na GitHub (privátní gist). Bez serveru: appka mluví přímo
// s GitHub API tvým osobním tokenem. Token žije JEN v tomhle zařízení
// (localStorage, mimo stav) — nikdy se neposílá nikam jinam a není v exportu dat.

const TOKEN_KEY = 'fitko-gh-token';
const GIST_KEY = 'fitko-gh-gist';
const SYNC_KEY = 'fitko-gh-lastsync';
const REMOTE_SESSIONS_KEY = 'fitko-gh-remote-sessions'; // kolik tréninků měla záloha tohohle uživatele, když jsme ji naposled viděli
const DEBOUNCE_MS = 8000;
// Soubor zálohy tohohle uživatele v gistu (Niklas = původní název, Matilda = s příponou).
const backupFile = () => backupFileFor(currentUser() ?? 'niklas');

const cloudInfo = { enabled: false, syncing: false, lastSync: null, lastError: null };

function ls(key) { try { return localStorage.getItem(key) ?? ''; } catch { return ''; } }
function lsSet(key, value) { try { localStorage.setItem(key, value); } catch { /* plno */ } }
function lsDel(key) { try { localStorage.removeItem(key); } catch { /* noop */ } }

function cloudToken() { return ls(TOKEN_KEY); }
function cloudEnabled() { return !!cloudToken(); }

function initCloud() {
  cloudInfo.enabled = cloudEnabled();
  cloudInfo.lastSync = ls(SYNC_KEY) || null;
}

function setCloudToken(token) {
  const clean = (token ?? '').trim();
  if (clean) lsSet(TOKEN_KEY, clean); else lsDel(TOKEN_KEY);
  cloudInfo.enabled = !!clean;
  cloudInfo.lastError = null;
}

function disableCloud() {
  lsDel(TOKEN_KEY);
  lsDel(GIST_KEY);
  lsDel(SYNC_KEY);
  lsDel(userKey(REMOTE_SESSIONS_KEY));
  cloudInfo.enabled = false;
  cloudInfo.lastSync = null;
  cloudInfo.lastError = null;
}

async function api(path, options = {}) {
  const token = cloudToken();
  if (!token) throw new Error('Chybí token');
  const res = await fetch(`https://api.github.com${path}`, {
    ...options,
    headers: {
      Accept: 'application/vnd.github+json',
      Authorization: `Bearer ${token}`,
      'X-GitHub-Api-Version': '2022-11-28',
      'Content-Type': 'application/json',
    },
  });
  if (res.status === 401) throw new Error('Token neplatí (401)');
  if (res.status === 403) throw new Error('Token nemá právo na gisty (403)');
  if (res.status === 404) throw new Error('Záloha nenalezena (404)');
  if (!res.ok) throw new Error(`GitHub odpověděl ${res.status}`);
  return res.json();
}

async function readGistFile(gist, name) {
  const file = gist.files?.[name];
  if (!file) return null;
  const content = file.truncated && file.raw_url ? await (await fetch(file.raw_url)).text() : file.content;
  return content;
}

/** Zapíše libovolné soubory do gistu domácnosti (založí ho, když ještě není). */
async function cloudWriteFiles(filesObj, { allowCreate = true } = {}) {
  if (!cloudEnabled()) return { ok: false, reason: 'off' };
  const files = Object.fromEntries(Object.entries(filesObj).map(([name, data]) => [name, { content: JSON.stringify(data, null, 1) }]));
  try {
    const id = ls(GIST_KEY);
    let gist;
    if (id) {
      gist = await api(`/gists/${id}`, { method: 'PATCH', body: JSON.stringify({ files }) });
    } else {
      if (!allowCreate) return { ok: false, reason: 'gist ještě není' };
      gist = await api('/gists', {
        method: 'POST',
        body: JSON.stringify({ description: 'Fitko — automatická záloha (oba telefony + domácnost)', public: false, files }),
      });
      lsSet(GIST_KEY, gist.id);
    }
    return { ok: true, gistId: gist.id };
  } catch (err) {
    return { ok: false, reason: err?.message ?? String(err) };
  }
}

/** Nahraje aktuální stav tohohle uživatele do gistu (poprvé ho založí). */
async function cloudBackup(state) {
  if (!cloudEnabled() || cloudInfo.syncing) return { ok: false, reason: 'off' };
  // POJISTKA: stav bez tréninků nikdy nepřepíše zálohu, ve které tréninky byly.
  // (Nenačtená data, rozdělaný onboarding v druhém okně, chyba při startu…)
  if (!state?.sessions?.length && Number(ls(userKey(REMOTE_SESSIONS_KEY)) || 0) > 0) {
    cloudInfo.lastError = null;
    return { ok: false, reason: 'prázdný stav — záloha ponechána' };
  }
  cloudInfo.syncing = true;
  try {
    const r = await cloudWriteFiles({ [backupFile()]: state });
    if (!r.ok) throw new Error(r.reason);
    cloudInfo.lastSync = new Date().toISOString();
    cloudInfo.lastError = null;
    lsSet(SYNC_KEY, cloudInfo.lastSync);
    lsSet(userKey(REMOTE_SESSIONS_KEY), String(state?.sessions?.length ?? 0));
    return { ok: true, gistId: r.gistId };
  } catch (err) {
    cloudInfo.lastError = err?.message ?? String(err);
    return { ok: false, reason: cloudInfo.lastError };
  } finally {
    cloudInfo.syncing = false;
  }
}

/** Najde gist domácnosti na účtu (podle kteréhokoli souboru Fitka) a zapamatuje si ho. */
async function findFitkoGist() {
  if (ls(GIST_KEY)) return api(`/gists/${ls(GIST_KEY)}`);
  const list = await api('/gists?per_page=100');
  const found = list.find(isFitkoGist);
  if (!found) return null;
  lsSet(GIST_KEY, found.id);
  return api(`/gists/${found.id}`);
}

/**
 * Najde už existující zálohu na účtu (po přeinstalaci telefonu / novém zařízení /
 * druhý telefon domácnosti), aby se nezaložil druhý gist a ten původní nezůstal
 * nedosažitelný.
 * @returns { ok, gistId, sessions, found } — sessions = kolik tréninků má záloha TOHOHLE uživatele
 */
async function adoptExistingBackup() {
  if (!cloudEnabled()) return { ok: false, reason: 'Nejdřív vlož token' };
  try {
    const gist = await findFitkoGist();
    if (!gist) return { ok: true, gistId: null, sessions: 0, found: false };
    const content = await readGistFile(gist, backupFile());
    const st = content ? JSON.parse(content) : null;
    const sessions = st?.sessions?.length ?? 0;
    if (st) lsSet(userKey(REMOTE_SESSIONS_KEY), String(sessions));
    return { ok: true, gistId: gist.id, sessions, found: !!st };
  } catch (err) {
    return { ok: false, reason: err?.message ?? String(err) };
  }
}

/** Stáhne poslední zálohu tohohle uživatele z GitHubu (najde gist i po přeinstalaci telefonu). */
async function cloudRestore() {
  if (!cloudEnabled()) return { ok: false, reason: 'Nejdřív zapni zálohu tokenem' };
  try {
    const gist = await findFitkoGist();
    if (!gist) return { ok: false, reason: 'Na GitHubu zatím žádná záloha není' };
    const content = await readGistFile(gist, backupFile());
    if (!content) return { ok: false, reason: `Pro ${userInfo()?.name ?? 'tebe'} v záloze zatím nic není`, empty: true };
    const state = JSON.parse(content);
    if (!state?.profile || !Array.isArray(state.sessions)) return { ok: false, reason: 'Záloha je poškozená' };
    lsSet(userKey(REMOTE_SESSIONS_KEY), String(state.sessions.length));
    return { ok: true, state, updatedAt: gist.updated_at };
  } catch (err) {
    return { ok: false, reason: err?.message ?? String(err) };
  }
}

/** Přečte vedlejší soubor z gistu (fitko-notif.json od GitHub Action, fitko-domacnost.json…). */
async function cloudReadFile(name) {
  if (!cloudEnabled()) return null;
  try {
    const gist = await findFitkoGist();
    if (!gist) return null;
    const content = await readGistFile(gist, name);
    return content ? JSON.parse(content) : null;
  } catch { return null; }
}

// Automatika: po každé změně dat se záloha naplánuje (a shluky změn se spojí).
let timer = null;
let pending = null;

function scheduleCloudBackup(state) {
  if (!cloudEnabled()) return;
  pending = state;
  if (timer) clearTimeout(timer);
  timer = setTimeout(() => { timer = null; if (pending) cloudBackup(pending); }, DEBOUNCE_MS);
}

/** Okamžitá záloha (konec tréninku, tlačítko v Nastavení) — nečeká na debounce. */
function flushCloudBackup(state) {
  if (timer) { clearTimeout(timer); timer = null; }
  pending = null;
  return cloudBackup(state);
}


// ===== src/app/household.js =====
// Společná data domácnosti (vaření do krabiček, nákup, cíle obou lidí). Kopie žije
// v telefonu, pravda je v gistu (fitko-domacnost.json). Sloučení po částech podle
// času změny — dva telefony se nepřepisují, jen doplňují.

const HH_KEY = 'fitko-household-v1';
const HH_DEBOUNCE_MS = 6000;

const Household = {
  state: null,
  dirty: false,
  syncing: false,
  lastSync: null,
  lastError: null,
  timer: null,

  init() {
    let local = null;
    try { local = JSON.parse(localStorage.getItem(HH_KEY) ?? 'null'); } catch { local = null; }
    this.state = mergeHousehold(emptyHousehold(), local ?? {});
    try { this.dirty = localStorage.getItem(`${HH_KEY}-dirty`) === '1'; } catch { /* noop */ }
  },

  saveLocal() {
    try {
      localStorage.setItem(HH_KEY, JSON.stringify(this.state));
      localStorage.setItem(`${HH_KEY}-dirty`, this.dirty ? '1' : '0');
    } catch { /* plno */ }
  },

  mutate(fn, { rerender = true } = {}) {
    const result = fn(this.state);
    this.state.updatedAt = new Date().toISOString();
    this.dirty = true;
    this.saveLocal();
    this.schedulePush();
    if (rerender) Store.onChange?.();
    return result;
  },

  schedulePush() {
    if (!cloudEnabled()) return;
    if (this.timer) clearTimeout(this.timer);
    this.timer = setTimeout(() => { this.timer = null; this.push(); }, HH_DEBOUNCE_MS);
  },

  async push() {
    if (!cloudEnabled() || this.syncing) return;
    this.syncing = true;
    try {
      const r = await cloudWriteFiles({ [HOUSEHOLD_FILE]: this.state }, { allowCreate: false });
      if (r.ok) { this.dirty = false; this.lastSync = new Date().toISOString(); this.lastError = null; this.saveLocal(); }
      else this.lastError = r.reason;
    } finally { this.syncing = false; }
  },

  /** Stáhne domácnost z gistu a sloučí; když máme nezapsané změny, pošle je. */
  async pull({ rerender = true } = {}) {
    if (!cloudEnabled()) return;
    const remote = await cloudReadFile(HOUSEHOLD_FILE);
    if (remote) {
      const merged = mergeHousehold(this.state, remote);
      const changed = JSON.stringify(merged) !== JSON.stringify(this.state);
      if (changed) { this.state = merged; this.saveLocal(); if (rerender) Store.onChange?.(); }
      this.lastSync = new Date().toISOString();
    }
    if (this.dirty) await this.push();
  },

  /** Moje cíle výživy pro druhého (plánování krabiček počítá s oběma). */
  publishMember(state) {
    const me = currentUser();
    if (!me || !state?.targets || !state.onboarded) return;
    const m = {
      name: state.profile.name || userInfo(me)?.name,
      sex: state.profile.sex,
      kcal: state.targets.kcal,
      proteinG: state.targets.proteinG,
      phase: state.targets.phase,
      weightKg: currentAvgWeight(state.weighIns) ?? state.profile.weightKg,
    };
    const prev = this.state.members[me];
    if (prev && ['name', 'sex', 'kcal', 'proteinG', 'phase', 'weightKg'].every((k) => prev[k] === m[k])) return;
    this.mutate((hh) => { hh.members[me] = { ...m, updatedAt: new Date().toISOString() }; }, { rerender: false });
  },

  /** Členové domácnosti k plánování: já vždy z aktuálního stavu, druhý z domácnosti. */
  members(state) {
    const me = currentUser();
    const out = {};
    for (const id of USER_ORDER) {
      if (id === me && state?.targets) {
        out[id] = { id, name: state.profile.name || USERS[id].name, kcal: state.targets.kcal, proteinG: state.targets.proteinG, phase: state.targets.phase, me: true };
      } else if (this.state.members[id]) {
        out[id] = { id, ...this.state.members[id], me: false };
      }
    }
    return out;
  },
};


// ===== src/app/updater.js =====
// Automatické aktualizace: appka se sama ptá serveru, jestli neběží novější verze,
// a umí se na ni přepnout bez mazání ikony z plochy.
//
// Proč to nestačí nechat na service workeru: v nainstalované appce na iOS zůstane
// stránka v paměti klidně několik dní, takže k novému načtení vůbec nedojde.
// Proto se ptáme sami — po startu, po návratu do appky a jednou za čas.


const CHECK_MS = 10 * 60 * 1000;
const TRIED_KEY = 'fitko-update-tried';

// Kdyby server hlásil novou verzi, ale stránka se z jakéhokoli důvodu načetla stará
// (cache CDN, částečný deploy), nesmí se appka přenačítat donekonečna.
// Každou verzi proto zkoušíme automaticky jen jednou; pak nabídneme tlačítko.
function alreadyTried(build) {
  try { return sessionStorage.getItem(TRIED_KEY) === build; } catch { return false; }
}
function markTried(build) {
  try { sessionStorage.setItem(TRIED_KEY, build); } catch { /* noop */ }
}
function clearUpdateAttempt() {
  try { sessionStorage.removeItem(TRIED_KEY); } catch { /* noop */ }
}

const updateInfo = { available: null, checking: false, lastCheck: null };

async function fetchLatestBuild() {
  const res = await fetch(`./version.json?t=${Date.now()}`, { cache: 'no-store' });
  if (!res.ok) throw new Error(String(res.status));
  const data = await res.json();
  return typeof data?.build === 'string' ? data.build : null;
}

/** Zjistí, jestli je na serveru novější verze. Vrací id nové verze, nebo null. */
async function checkForUpdate() {
  const current = buildId();
  if (!current) return null; // dev build bez verze
  updateInfo.checking = true;
  try {
    const latest = await fetchLatestBuild();
    updateInfo.lastCheck = new Date().toISOString();
    updateInfo.available = latest && latest !== current ? latest : null;
    return updateInfo.available;
  } catch {
    return null; // offline nebo výpadek — zkusíme příště
  } finally {
    updateInfo.checking = false;
  }
}

/** Zahodí cache i service worker a načte appku znovu — tedy skutečný update. */
async function applyUpdate(build = null) {
  if (build) markTried(build);
  try {
    const regs = (await navigator.serviceWorker?.getRegistrations?.()) ?? [];
    await Promise.all(regs.map((r) => r.unregister().catch(() => {})));
    const keys = (await caches?.keys?.()) ?? [];
    await Promise.all(keys.map((k) => caches.delete(k)));
  } catch { /* i tak přenačteme */ }
  // cache-busting parametr: iOS jinak umí vrátit stránku z paměti
  const url = new URL(location.href);
  url.searchParams.set('v', Date.now().toString(36));
  location.replace(url.toString());
}

/**
 * Spustí hlídání aktualizací.
 * @param onFound (build) => void — zavolá se, když je novější verze k dispozici
 */
function initUpdater(onFound) {
  const run = async () => {
    const found = await checkForUpdate();
    if (!found) { clearUpdateAttempt(); return; }
    onFound(found, alreadyTried(found));
  };
  run();
  setInterval(run, CHECK_MS);
  document.addEventListener('visibilitychange', () => { if (!document.hidden) run(); });
  window.addEventListener('online', run);
}


// ===== src/app/akce.js =====
// Akce z Lidlu: appka NEČTE kupi.cz přímo (CORS + křehkost). GitHub Action 2× týdně
// stáhne akční potraviny a uloží je jako ./akce-lidl.json vedle appky; tady je jen
// načteme, uložíme do stavu (aby fungovaly offline) a hlídáme jejich stáří.

const FEED_URL = './akce-lidl.json';
const FRESH_MS = 6 * 60 * 60 * 1000; // častěji než à 6 h nemá smysl se ptát — feed se mění 2× týdně

const akceInfo = { loading: false, lastError: null, lastAttempt: 0 };
const RETRY_MS = 60 * 1000; // po chybě / 404 se neptáme častěji než jednou za minutu

/** Stáří feedu ve dnech (null = žádný). */
function feedAgeDays(feed) {
  if (!feed?.fetchedAt) return null;
  return Math.floor((Date.now() - new Date(feed.fetchedAt).getTime()) / 86400000);
}

/** Načte feed, pokud je uložený starší než FRESH_MS. Vrací nový feed nebo null (nic nového / offline). */
async function refreshDiscounts(current) {
  const checkedAt = current?.checkedAt ? new Date(current.checkedAt).getTime() : 0;
  if (Date.now() - checkedAt < FRESH_MS) return null;
  if (akceInfo.loading || Date.now() - akceInfo.lastAttempt < RETRY_MS) return null;
  akceInfo.loading = true;
  akceInfo.lastAttempt = Date.now();
  try {
    const res = await fetch(`${FEED_URL}?t=${Date.now()}`, { cache: 'no-store' });
    if (res.status === 404) { akceInfo.lastError = 'feed zatím neexistuje'; return null; }
    if (!res.ok) throw new Error(String(res.status));
    const feed = await res.json();
    if (!Array.isArray(feed?.items)) throw new Error('neplatný feed');
    akceInfo.lastError = null;
    return { ...feed, checkedAt: new Date().toISOString() };
  } catch (err) {
    akceInfo.lastError = err?.message ?? String(err);
    return null;
  } finally {
    akceInfo.loading = false;
  }
}

/** Jen položky, které ještě platí (validTo dnes nebo později; bez data = necháme). */
function validDiscountItems(feed, todayIso) {
  return (feed?.items ?? []).filter((it) => !it.validTo || it.validTo >= todayIso);
}


// ===== src/app/push.js =====
// Notifikace: iOS je umí jen v appce přidané na plochu (iOS 16.4+) a jen po klepnutí
// uživatele. Odesílá je GitHub Action (bez serveru) — ta si přihlášení (subscription)
// přečte ze zálohy na GitHubu. Bez zapnuté zálohy proto notifikace nejdou.


const pushInfo = { supported: false, standalone: false, permission: 'default', busy: false, lastError: null };

function vapidKey() {
  try { return typeof VAPID_PUBLIC_KEY === 'string' ? VAPID_PUBLIC_KEY : ''; } catch { return ''; }
}

function initPush() {
  pushInfo.standalone = window.matchMedia?.('(display-mode: standalone)')?.matches || navigator.standalone === true;
  pushInfo.supported = 'serviceWorker' in navigator && 'PushManager' in window && 'Notification' in window && !!vapidKey();
  pushInfo.permission = typeof Notification !== 'undefined' ? Notification.permission : 'default';
}

/** Proč notifikace nejdou zapnout (null = jde). */
function pushBlocker() {
  if (!pushInfo.supported) return pushInfo.standalone ? 'Tenhle prohlížeč notifikace nepodporuje.' : 'Otevři Fitko z ikony na ploše — v Safari to iOS nedovolí.';
  if (pushInfo.permission === 'denied') return 'Notifikace jsou pro Fitko zakázané v Nastavení iPhonu → Fitko → Oznámení.';
  if (!cloudEnabled()) return 'Nejdřív zapni zálohu na GitHub — notifikace se posílají z ní.';
  return null;
}

function b64ToBytes(b64url) {
  const pad = '='.repeat((4 - (b64url.length % 4)) % 4);
  const raw = atob((b64url + pad).replace(/-/g, '+').replace(/_/g, '/'));
  return Uint8Array.from(raw, (c) => c.charCodeAt(0));
}

/** Musí běžet z kliknutí. Vrací { ok, subscription } nebo { ok: false, reason }. */
async function subscribePush() {
  const blocker = pushBlocker();
  if (blocker) return { ok: false, reason: blocker };
  pushInfo.busy = true;
  try {
    const perm = await Notification.requestPermission();
    pushInfo.permission = perm;
    if (perm !== 'granted') return { ok: false, reason: 'Nepovolil jsi notifikace.' };
    const reg = await navigator.serviceWorker.ready;
    let sub = await reg.pushManager.getSubscription();
    if (!sub) {
      sub = await reg.pushManager.subscribe({ userVisibleOnly: true, applicationServerKey: b64ToBytes(vapidKey()) });
    }
    pushInfo.lastError = null;
    return { ok: true, subscription: sub.toJSON() };
  } catch (err) {
    pushInfo.lastError = err?.message ?? String(err);
    return { ok: false, reason: pushInfo.lastError };
  } finally {
    pushInfo.busy = false;
  }
}

async function unsubscribePush() {
  try {
    const reg = await navigator.serviceWorker.ready;
    const sub = await reg.pushManager.getSubscription();
    if (sub) await sub.unsubscribe();
  } catch { /* nevadí — hlavní je smazat subscription ze stavu */ }
}

/** Lokální zkušební notifikace přes service worker — ověří, že iPhone zobrazuje. */
async function testLocalNotification() {
  try {
    const reg = await navigator.serviceWorker.ready;
    await reg.showNotification('Fitko', { body: 'Notifikace fungují. Ty ostré chodí z GitHubu.', tag: 'fitko-test', icon: './icon-192.png' });
    return true;
  } catch { return false; }
}


// ===== src/app/appstate.js =====
// Stav aplikace a orchestrace enginu. Engine počítá, tohle drží data a pravidla toku.













const APP_VERSION = 1;
const REST_SECONDS = { heavy: 180, secondary: 120, isolation: 90 };

function defaultState() {
  return {
    version: APP_VERSION,
    updatedAt: new Date().toISOString(),
    onboarded: false,
    profile: { ...DEFAULT_PROFILE, startDate: todayISO() },
    targets: null,
    nutritionLog: [],
    exercises: {},
    addedSets: {},
    enabledSlotExercises: [],
    sessions: [],
    activeWorkout: null,
    weighIns: [],
    waist: [],
    checkins: [],
    bestE1rms: {},
    prLog: [],
    deload: { active: false, sessionsLeft: 0, lastEndDate: null },
    volume: { lastChangeDate: null },
    offers: {},
    offersDismissed: {},
    minicutEndDate: null,
    introDismissed: false,
    restScale: 1, // 0.75 kratší · 1 doporučené · 1.25 delší
    food: defaultFood(),
    push: defaultPush(),
  };
}

// Jídlo: jídla (makra spočítaná při tvorbě), plán aktuálního týdne, co bylo snědeno,
// co je koupené, a poslední stažený feed akcí (kvůli offline).
function defaultFood() {
  return { meals: [], customFoods: [], plan: null, eaten: {}, bought: {}, discounts: null };
}

// Notifikace: subscription žije ve stavu, protože ji čte GitHub Action ze zálohy.
function defaultPush() {
  return {
    subscription: null,
    enabledAt: null,
    prefs: { workout: true, weigh: true, meals: true, protein: true, shopping: true, cooking: true, quietFrom: 22, quietTo: 7 },
  };
}

/** Doplní chybějící podklíče (starší zálohy) — volat před každým čtením state.food / state.push. */
function ensureFood(state) {
  if (!state.food) state.food = defaultFood();
  for (const [k, v] of Object.entries(defaultFood())) if (!(k in state.food)) state.food[k] = v;
  if (!state.push) state.push = defaultPush();
  if (!state.push.prefs) state.push.prefs = defaultPush().prefs;
  for (const [k, v] of Object.entries(defaultPush().prefs)) if (!(k in state.push.prefs)) state.push.prefs[k] = v;
  return state.food;
}

// ---------- Store ----------

const Store = {
  state: null,
  onChange: null, // nastavuje main.js (re-render)

  init(persisted) {
    this.state = persisted ?? defaultState();
    if (persisted) migrate(this.state);
  },

  // mutace: fn(state); publish = bezpečná hranice → nová verze artifactu (reload!)
  // Bez publish se změna označí jako nesynchronizovaná (pendingPublish) a doladí
  // se při příštím startu appky nebo na další bezpečné hranici.
  mutate(fn, { publish = false, rerender = true, markDirty = true, force = false } = {}) {
    const result = fn(this.state);
    this.state.updatedAt = new Date().toISOString();
    if (publish) this.state.pendingPublish = false;
    else if (markDirty) this.state.pendingPublish = true;
    saveLocal(this.state, { force });
    Household.publishMember(this.state);
    // Automatická záloha na GitHub: na hranicích (konec tréninku, onboarding…) hned,
    // jinak se shlukne a odešle po pár vteřinách klidu.
    // Na stejné hranici vzniká i lokální snímek — po dokončeném tréninku tak
    // existuje čerstvá záloha, ne až při příštím spuštění appky.
    if (publish) { backupState(this.state); publishState(this.state); flushCloudBackup(this.state); }
    else scheduleCloudBackup(this.state);
    if (rerender && this.onChange) this.onChange();
    return result;
  },
};

function migrate(state) {
  const fresh = defaultState();
  for (const key of Object.keys(fresh)) if (!(key in state)) state[key] = fresh[key];
  ensureFood(state);
}

// ---------- plán a předpisy ----------

function nextUnitDay(state) {
  const days = programDays(state);
  return days[state.sessions.length % days.length];
}

// Fáze výživy pro zobrazení.
const PHASE_LABELS = { bulk: 'lean bulk', cut: 'hubnutí', maintain: 'udržování', minicut: 'mini-cut' };
function phaseLabel(phase) { return PHASE_LABELS[phase] ?? phase ?? '—'; }

// Směr cíle: hubnutí / udržování / nabírání — řídí projekce, milníky i texty.
function goalDirection(state) {
  const phase = state.targets?.phase;
  if (phase === 'cut') return 'lose';
  if (phase === 'maintain') return 'maintain';
  return goalKind(state.profile) === 'lose' ? 'lose' : goalKind(state.profile) === 'maintain' ? 'maintain' : 'gain';
}

// Seznam cviků jednotky vč. zapnutých slot cviků a přidaných sérií.
function unitExerciseList(state, day) {
  const list = day.exercises.map((ex) => ({
    exerciseId: ex.exerciseId,
    sets: ex.sets + (state.addedSets[slotKey(day.unit, ex.exerciseId)] ?? 0),
    dropsetLast: !!ex.dropsetLast,
  }));
  for (const slot of day.slots) {
    if (slot.kind === 'add_exercise' && state.enabledSlotExercises.includes(slot.exerciseId)) {
      list.push({
        exerciseId: slot.exerciseId,
        sets: slot.sets + (state.addedSets[slotKey(day.unit, slot.exerciseId)] ?? 0),
        dropsetLast: !!EXERCISES[slot.exerciseId].dropset,
      });
    }
  }
  return list;
}

function ensureExerciseState(state, exerciseId, sets) {
  if (!state.exercises[exerciseId]) {
    state.exercises[exerciseId] = { exerciseId, status: 'calibration', loadKg: null, sets: sets ?? 3 };
  } else if (sets != null) {
    state.exercises[exerciseId].sets = sets;
  }
  return state.exercises[exerciseId];
}

// Historie výkonů cviku (bez deload týdnů — nízké zátěže nesmí mást progresi).
function recentPerformances(state, exerciseId, n = 3) {
  const out = [];
  for (let i = state.sessions.length - 1; i >= 0 && out.length < n; i--) {
    const session = state.sessions[i];
    if (session.deload) continue;
    const entry = session.entries.find((e) => e.exerciseId === exerciseId);
    if (entry && entry.sets.some((s) => !s.isWarmup)) {
      out.push({ date: session.date, sets: entry.sets });
    }
  }
  return out;
}

function prescriptionFor(state, exerciseId, sets) {
  const def = EXERCISES[exerciseId];
  const exState = { ...ensureExerciseState(state, exerciseId), sets };
  if (state.deload.active) return deloadPrescription(def, exState, loadStep);
  return computeNextPrescription(def, exState, recentPerformances(state, exerciseId));
}

function warmupsFor(exerciseId, loadKg) {
  const def = EXERCISES[exerciseId];
  if (loadKg == null || def.incrementRule === 'bodyweight' || def.type === 'isolation' || loadKg < 30) return [];
  const step = loadStep(def);
  if (def.type === 'heavy') {
    return [
      { weightKg: Math.max(step, roundToStep(loadKg * 0.5, step)), reps: 5 },
      { weightKg: Math.max(step, roundToStep(loadKg * 0.75, step)), reps: 3 },
    ];
  }
  return [{ weightKg: Math.max(step, roundToStep(loadKg * 0.6, step)), reps: 5 }];
}

function restSecondsFor(exerciseId, state = Store.state) {
  const base = REST_SECONDS[EXERCISES[exerciseId].type] ?? 120;
  const scale = state?.restScale ?? 1;
  return Math.round((base * scale) / 15) * 15; // zaokrouhleno na 15 s
}

function restPlan(state = Store.state) {
  const scale = state?.restScale ?? 1;
  return Object.entries(REST_SECONDS).map(([type, base]) => ({
    type, seconds: Math.round((base * scale) / 15) * 15,
  }));
}

function fmtRest(seconds) {
  const m = Math.floor(seconds / 60);
  const s = seconds % 60;
  return s === 0 ? `${m}:00` : `${m}:${String(s).padStart(2, '0')}`;
}

// Pozice v cyklu programu (nezávislá na dni v týdnu) — 1..délka programu.
function cyclePosition(state) {
  return (state.sessions.length % programDays(state).length) + 1;
}

// ---------- trénink ----------

// Řádkový model cviku: rozcvičky → pracovní série → případný dropset. Logged = zapsáno.
function buildEntry(state, exerciseId, sets, dropsetLast, swappedFrom = null) {
  const prescription = prescriptionFor(state, exerciseId, sets);
  const rows = [];
  for (const w of warmupsFor(exerciseId, prescription.loadKg)) {
    rows.push({ kind: 'warmup', target: { weightKg: w.weightKg, reps: w.reps }, logged: null });
  }
  for (const reps of prescription.targetReps) {
    rows.push({ kind: 'work', target: { weightKg: prescription.loadKg, reps }, logged: null });
  }
  if (dropsetLast && !state.deload.active) {
    rows.push({ kind: 'drop', target: { weightKg: null, reps: null }, logged: null });
  }
  return { exerciseId, swappedFrom, prescription, rows };
}

function buildWorkout(state, { unit = null, date = null } = {}) {
  const day = unit ? programDays(state).find((d) => d.unit === unit) ?? nextUnitDay(state) : nextUnitDay(state);
  const entries = unitExerciseList(state, day)
    .map((item) => buildEntry(state, item.exerciseId, item.sets, item.dropsetLast));
  return {
    unit: day.unit,
    unitName: day.name,
    date: date ?? todayISO(),
    backfill: !!date && date !== todayISO(),
    startedAt: Date.now(),
    deload: state.deload.active,
    entries,
  };
}

function swapWorkoutExercise(state, entryIndex, newExerciseId) {
  const workout = state.activeWorkout;
  const entry = workout.entries[entryIndex];
  const sets = entry.prescription.targetReps.length;
  workout.entries[entryIndex] = buildEntry(
    state, newExerciseId, sets, !!EXERCISES[newExerciseId].dropset, entry.exerciseId,
  );
}

// Dokončení tréninku: zápis session, update stavů cviků, PR, deload bookkeeping, nabídky.
function completeWorkout(state) {
  const workout = state.activeWorkout;
  if (!workout) return null;

  const entries = workout.entries
    .map((e) => ({
      exerciseId: e.exerciseId,
      swappedFrom: e.swappedFrom ?? undefined,
      sets: e.rows
        .filter((r) => r.logged && r.logged.reps > 0)
        .map((r) => ({
          weightKg: r.logged.weightKg,
          reps: r.logged.reps,
          ...(r.logged.rir != null ? { rir: r.logged.rir } : {}),
          ...(r.kind === 'warmup' ? { isWarmup: true } : {}),
          ...(r.kind === 'drop' ? { isDropset: true } : {}),
        })),
    }))
    .filter((e) => e.sets.some((s) => !s.isWarmup && !s.isDropset));

  const session = {
    id: `s${Date.now()}`,
    date: workout.date,
    unit: workout.unit,
    deload: workout.deload,
    durationMin: Math.max(1, Math.round((Date.now() - workout.startedAt) / 60000)),
    entries,
  };
  // Je tenhle trénink nejnovější? Zpětně dopsaný starý trénink NESMÍ přepsat
  // aktuální zátěže, PR ani stav cviků — jinak by progrese spadla o týdny zpět.
  const newest = state.sessions.length ? state.sessions[state.sessions.length - 1].date : null;
  const isNewest = !newest || session.date >= newest;

  state.sessions.push(session);
  // chronologicky — zpětně dopsaný trénink se musí zařadit podle data,
  // jinak by ho engine bral jako nejnovější výkon
  state.sessions.sort((a, b) => a.date.localeCompare(b.date));

  const prs = [];
  for (const entry of entries) {
    const def = EXERCISES[entry.exerciseId];
    const perf = { date: session.date, sets: entry.sets };

    if (!session.deload && isNewest) {
      const exState = ensureExerciseState(state, entry.exerciseId);
      const workoutEntry = workout.entries.find((e) => e.exerciseId === entry.exerciseId);
      state.exercises[entry.exerciseId] = nextStateAfterSession(def, exState, perf, workoutEntry?.prescription);

      const prev = state.bestE1rms[entry.exerciseId] ?? null;
      const { isPR, e1rm: sessionBest } = detectPR(prev, perf);
      if (sessionBest != null) {
        state.bestE1rms[entry.exerciseId] = Math.max(prev ?? 0, sessionBest);
        if (isPR && def.key) {
          prs.push({ exerciseId: entry.exerciseId, e1rm: sessionBest });
          state.prLog.push({ date: session.date, exerciseId: entry.exerciseId, e1rm: sessionBest });
        }
      }
    }
  }

  if (session.deload) {
    state.deload.sessionsLeft = Math.max(0, state.deload.sessionsLeft - 1);
    if (state.deload.sessionsLeft === 0) {
      state.deload.active = false;
      state.deload.lastEndDate = session.date;
      state.addedSets = volumeAfterDeload(state.addedSets);
      state.volume.lastChangeDate = session.date;
    }
  }

  state.activeWorkout = null;
  evaluateOffers(state);
  return { session, prs };
}

// ---------- nabídky enginu (deload / objem / mini-cut) ----------

function weeksBetween(fromISO, toISO) {
  if (!fromISO) return 0;
  return Math.floor(daysBetween(fromISO, toISO) / 7);
}

function keyRegressions(state) {
  return keyExerciseIds(programDays(state)).filter((id) => {
    const exState = state.exercises[id];
    if (!exState || exState.status !== 'active') return false;
    const p = computeNextPrescription(EXERCISES[id], exState, recentPerformances(state, id));
    return p.action === 'reduce_load';
  });
}

function progressingShare(state) {
  const active = Object.values(state.exercises).filter((e) => e.status === 'active');
  if (!active.length) return 1;
  let progressing = 0;
  for (const exState of active) {
    const p = computeNextPrescription(EXERCISES[exState.exerciseId], exState, recentPerformances(state, exState.exerciseId));
    if (p.action !== 'reduce_load' && p.note !== 'missed_bottom_once') progressing++;
  }
  return progressing / active.length;
}

const OFFER_SNOOZE_DAYS = 5;

function snoozed(state, kind) {
  const at = state.offersDismissed[kind];
  return at && daysBetween(at, todayISO()) < OFFER_SNOOZE_DAYS;
}

function evaluateOffers(state) {
  const today = todayISO();
  state.offers = state.offers ?? {};

  // Deload
  if (!state.deload.active && !snoozed(state, 'deload')) {
    const trig = detectDeloadTriggers({
      keyRegressions: keyRegressions(state),
      readinessLog: state.checkins.slice(-7),
      weeksSinceDeload: weeksBetween(state.deload.lastEndDate ?? state.profile.startDate, today),
    });
    state.offers.deload = trig.triggered ? { reasons: trig.reasons } : null;
  } else {
    state.offers.deload = null;
  }

  // Objem (jen mimo deload a mimo mini-cut)
  if (!state.deload.active && !state.offers.deload && state.targets?.phase !== 'minicut' && !snoozed(state, 'volume')) {
    const check = shouldOfferVolumeIncrease({
      weeksSinceVolumeChange: weeksBetween(state.volume.lastChangeDate ?? state.profile.startDate, today),
      deloadTriggered: false,
      readinessAvg7d: readinessAvg(state.checkins.slice(-7)),
      progressingShare: progressingShare(state),
    });
    if (check.offer) {
      const picks = pickVolumeSlots(state.addedSets, new Set(state.enabledSlotExercises), 2, programDays(state));
      state.offers.volume = picks.length ? { picks } : null;
    } else {
      state.offers.volume = null;
    }
  } else {
    state.offers.volume = null;
  }

  // Mini-cut (jen v bulku)
  if (state.targets?.phase === 'bulk' && !snoozed(state, 'minicut')) {
    const check = miniCutCheck({ waistSeries: state.waist, weightSeries: state.weighIns, heightCm: state.profile.heightCm });
    state.offers.minicut = check.recommend ? { reasons: check.reasons } : null;
  } else {
    state.offers.minicut = null;
  }
}

function acceptDeload(state) {
  state.deload.active = true;
  state.deload.sessionsLeft = programDays(state).length;
  state.offers.deload = null;
}

function dismissOffer(state, kind) {
  state.offers[kind] = null;
  state.offersDismissed[kind] = todayISO();
}

function acceptVolume(state) {
  const picks = state.offers.volume?.picks ?? [];
  for (const pick of picks) {
    if (pick.kind === 'add_exercise') {
      if (!state.enabledSlotExercises.includes(pick.exerciseId)) state.enabledSlotExercises.push(pick.exerciseId);
      ensureExerciseState(state, pick.exerciseId, pick.sets);
    } else {
      const key = slotKey(pick.unit, pick.exerciseId);
      state.addedSets[key] = (state.addedSets[key] ?? 0) + 1;
    }
  }
  state.volume.lastChangeDate = todayISO();
  state.offers.volume = null;
}

function acceptMinicut(state) {
  const avgW = currentAvgWeight(state.weighIns) ?? state.profile.weightKg;
  const proj = projectGoalDate({ weighIns: state.weighIns, goalKg: state.profile.goalWeightKg, direction: 'gain' });
  state.targets = miniCutTargets(state.targets, avgW, proj.rateKgWk, kcalFloor(state.profile, avgW));
  state.minicutEndDate = addDays(todayISO(), 49);
  state.offers.minicut = null;
  state.nutritionLog.push({ date: todayISO(), kcal: state.targets.kcal, deltaKcal: 0, reason: 'minicut_start' });
}

// ---------- denní údržba (volá se při startu appky) ----------

function dailyMaintenance(state) {
  if (!state.onboarded || !state.targets) return;
  const today = todayISO();
  const avgW = currentAvgWeight(state.weighIns);

  // konec mini-cutu → zpět do bulku s cíli podle aktuální váhy
  if (state.targets.phase === 'minicut' && state.minicutEndDate && today > state.minicutEndDate) {
    state.targets = initialTargets(state.profile, avgW ?? state.profile.weightKg);
    state.minicutEndDate = null;
    state.nutritionLog.push({ date: today, kcal: state.targets.kcal, deltaKcal: 0, reason: 'bulk_resume' });
  }

  // cílová váha dosažena (7denní průměr) → udržování; kalorie z pozorovaného tempa
  if ((state.targets.phase === 'cut' || state.targets.phase === 'bulk') && goalReached(state.targets.phase, avgW, state.profile.goalWeightKg)) {
    const proj = projectGoalDate({ weighIns: state.weighIns, goalKg: state.profile.goalWeightKg, today, direction: state.targets.phase === 'cut' ? 'lose' : 'gain' });
    state.targets = maintainTargets(state.profile, avgW, state.targets.kcal, proj.rateKgWk);
    state.profile.goal = 'maintain';
    state.nutritionLog.push({ date: today, kcal: state.targets.kcal, deltaKcal: 0, reason: 'goal_reached' });
  }

  // týdenní korekce kalorií podle trendu (max 1× za 6 dní); nikdy pod bezpečné minimum
  const lastAdjust = state.nutritionLog.at(-1)?.date ?? null;
  if (!lastAdjust || daysBetween(lastAdjust, today) >= 6) {
    const weeksOnPlan = Math.floor(daysBetween(state.profile.startDate, today) / 7) + 1;
    const kcalMin = kcalFloor(state.profile, avgW ?? state.profile.weightKg);
    const result = weeklyAdjustment({ targets: state.targets, weighIns: state.weighIns, weeksOnPlan, today, kcalMin });
    if (result.deltaKcal !== 0) {
      state.targets.kcal = result.newKcal;
      state.nutritionLog.push({ date: today, kcal: result.newKcal, deltaKcal: result.deltaKcal, reason: result.reason });
    } else if (result.reason === 'on_track' && (!lastAdjust || daysBetween(lastAdjust, today) >= 6)) {
      state.nutritionLog.push({ date: today, kcal: state.targets.kcal, deltaKcal: 0, reason: 'on_track' });
    }
  }

  // protein sleduje aktuální váhu a fázi
  if (avgW) state.targets.proteinG = Math.round(proteinPerKg(state.targets.phase) * avgW);

  evaluateOffers(state);
}

/**
 * Změna cílové váhy v Nastavení: když se tím změní směr (hubnutí ↔ nabírání ↔ udržování),
 * cíle výživy se přepočítají z aktuální váhy. Jinak zůstanou, jak je engine doladil.
 */
function applyGoalChange(state, goalWeightKg) {
  state.profile.goalWeightKg = goalWeightKg;
  state.profile.goal = null;
  const avgW = currentAvgWeight(state.weighIns) ?? state.profile.weightKg;
  const kind = goalKind(state.profile, avgW);
  const current = state.targets?.phase;
  const family = current === 'minicut' ? 'gain' : current === 'bulk' ? 'gain' : current === 'cut' ? 'lose' : 'maintain';
  if (!state.targets || kind !== family) {
    state.targets = initialTargets(state.profile, avgW);
    state.minicutEndDate = null;
    state.nutritionLog.push({ date: todayISO(), kcal: state.targets.kcal, deltaKcal: 0, reason: 'goal_changed' });
  }
}

// ---------- tělo ----------

function upsertWeighIn(state, kg) {
  const today = todayISO();
  const existing = state.weighIns.find((w) => w.date === today);
  if (existing) existing.kg = kg;
  else state.weighIns.push({ date: today, kg });
  state.weighIns.sort((a, b) => a.date.localeCompare(b.date));
}

function upsertWaist(state, cm) {
  const today = todayISO();
  const existing = state.waist.find((w) => w.date === today);
  if (existing) existing.cm = cm;
  else state.waist.push({ date: today, cm });
  state.waist.sort((a, b) => a.date.localeCompare(b.date));
}

function upsertCheckin(state, values) {
  const today = todayISO();
  const existing = state.checkins.find((c) => c.date === today);
  if (existing) Object.assign(existing, values);
  else state.checkins.push({ date: today, ...values });
  state.checkins.sort((a, b) => a.date.localeCompare(b.date));
}

// ---------- odvozená data pro obrazovky ----------

function weeklyStreakLog(state) {
  if (!state.sessions.length) return [];
  const weekKey = (iso) => {
    const d = new Date(`${iso}T12:00:00`);
    const day = (d.getDay() + 6) % 7; // Po = 0
    d.setDate(d.getDate() - day);
    return d.toISOString().slice(0, 10);
  };
  const counts = new Map();
  for (const s of state.sessions) {
    const key = weekKey(s.date);
    counts.set(key, (counts.get(key) ?? 0) + 1);
  }
  const currentWeek = weekKey(todayISO());
  const weeks = [];
  let cursor = currentWeek;
  const firstWeek = weekKey(state.sessions[0].date);
  const planned = state.profile.trainingDays?.length || 5;
  while (cursor >= firstWeek && weeks.length < 200) {
    weeks.push({
      completed: counts.get(cursor) ?? 0,
      planned,
      isCurrentWeek: cursor === currentWeek,
    });
    cursor = addDays(cursor, -7);
  }
  return weeks;
}

function e1rmSeries(state, exerciseId) {
  const out = [];
  for (const session of state.sessions) {
    if (session.deload) continue;
    const entry = session.entries.find((e) => e.exerciseId === exerciseId);
    if (!entry) continue;
    let best = null;
    for (const s of entry.sets) {
      if (s.isWarmup) continue;
      const val = e1rm(s.weightKg, s.reps, s.rir);
      if (val != null && (best == null || val > best)) best = val;
    }
    if (best != null) out.push({ date: session.date, value: best });
  }
  return out;
}

function trainingAgeMonthsNow(state) {
  return (state.profile.trainingAgeMonths ?? 0) + Math.floor(daysBetween(state.profile.startDate, todayISO()) / 30.44);
}

function progressSummary(state) {
  const avg7 = currentAvgWeight(state.weighIns);
  const direction = goalDirection(state);
  return {
    avg7,
    direction,
    projection: projectGoalDate({ weighIns: state.weighIns, goalKg: state.profile.goalWeightKg, today: todayISO(), direction }),
    quality: direction === 'lose'
      ? cutQuality({ weighIns: state.weighIns, waistSeries: state.waist, weightKg: avg7 })
      : gainQuality({ weighIns: state.weighIns, waistSeries: state.waist }),
    composition: gainComposition({ weighIns: state.weighIns, trainingAgeMonths: trainingAgeMonthsNow(state) }),
    weightMilestone: nextWeightMilestone(avg7, state.profile.weightKg, state.profile.goalWeightKg, direction),
    streak: streakWeeks(weeklyStreakLog(state)),
  };
}

/**
 * Rekapitulace odcvičeného tréninku — co jsi udělal, jak to dopadlo proti cíli
 * a co z toho engine vyvodil pro příště. Počítá se z uložené session + stavu
 * (po completeWorkout už stav obsahuje nové zátěže), takže je pravdivá i zpětně.
 */
function sessionRecap(state, session) {
  // „Příště" dává smysl jen u nejnovějšího tréninku — u starších by ukazovalo
  // dnešní zátěž, ne tu, která po něm reálně přišla.
  const isLatest = state.sessions[state.sessions.length - 1]?.id === session.id;
  const allWorkSets = [];

  const entries = session.entries.map((entry) => {
    const def = EXERCISES[entry.exerciseId];
    if (!def) return null; // cvik, který už v programu není
    const work = entry.sets.filter((s) => !s.isWarmup && !s.isDropset);
    const drops = entry.sets.filter((s) => s.isDropset);
    allWorkSets.push(...work);
    const lo = def.repRange[0];
    // strop = prodloužený rozsah, pokud ho cvik má (jinak by verdikt lhal)
    const hi = state.exercises[entry.exerciseId]?.rangeHi ?? def.repRange[1];
    const tonnage = work.reduce((a, s) => a + s.weightKg * s.reps, 0);
    const rirs = work.filter((s) => s.rir != null).map((s) => s.rir);
    const avgRir = rirs.length ? +avg(rirs).toFixed(1) : null;
    const best = work.reduce((b, s) => (b == null || e1rm(s.weightKg, s.reps, s.rir) > e1rm(b.weightKg, b.reps, b.rir) ? s : b), null);

    let verdict = 'v rozsahu';
    let tone = 'ok';
    if (work.some((s) => s.reps < lo)) { verdict = 'pod rozsahem'; tone = 'warn'; }
    else if (work.length && work.every((s) => s.reps >= hi)) { verdict = 'na stropu'; tone = 'accent'; }

    const next = session.deload || !isLatest ? null : prescriptionFor(state, entry.exerciseId, work.length);
    const nextText = next && next.loadKg != null
      ? `${fmtNum(next.loadKg)} kg × ${next.targetReps[0]}`
      : next ? `× ${next.targetReps[0]} (váhu najdeš na místě)` : null;

    return {
      exerciseId: entry.exerciseId,
      name: def.name,
      setsText: work.map((s) => `${fmtNum(s.weightKg)}×${s.reps}${s.rir != null ? `@${s.rir}` : ''}`).join(' · '),
      dropsText: drops.length ? drops.map((s) => `${fmtNum(s.weightKg)}×${s.reps}`).join(' · ') : null,
      workSets: work.length,
      tonnage: Math.round(tonnage),
      avgRir,
      bestE1rm: best ? Math.round(e1rm(best.weightKg, best.reps, best.rir)) : null,
      verdict,
      tone,
      nextText,
    };
  });

  const clean = entries.filter(Boolean);
  const workSets = clean.reduce((a, e) => a + e.workSets, 0);
  const tonnage = clean.reduce((a, e) => a + e.tonnage, 0);
  // průměr přes VŠECHNY série, ne průměr průměrů
  const rirValues = allWorkSets.filter((s) => s.rir != null).map((s) => s.rir);
  const avgRir = rirValues.length ? +avg(rirValues).toFixed(1) : null;
  const inSession = new Set(session.entries.map((e) => e.exerciseId));
  const prs = state.prLog.filter((p) => p.date === session.date && inSession.has(p.exerciseId));

  // souhrnný verdikt — jedna věta, kterou si přečteš do 2 sekund
  let headline;
  if (session.deload) headline = 'Deload odcvičen — přesně jak měl vypadat: lehce a bez selhání.';
  else if (prs.length) headline = 'Nové osobní maximum. Tohle byl silný trénink.';
  else if (clean.some((e) => e.tone === 'accent')) headline = 'Strop rozsahu na některých cvicích — příště se přidává váha.';
  else if (clean.some((e) => e.tone === 'warn')) headline = 'Část sérií spadla pod rozsah — engine příště uleví, ať se progrese rozjede.';
  else if (avgRir != null && avgRir >= 3.5) headline = 'Bylo to hodně v rezervě — příště přitlač, ať to má stimul.';
  else headline = 'Solidní práce v cílovém pásmu — přesně takhle se staví progrese.';

  return {
    date: session.date,
    unit: session.unit,
    unitName: unitName(programDays(state), session.unit),
    deload: session.deload,
    durationMin: session.durationMin,
    workSets,
    tonnage,
    avgRir,
    prs,
    headline,
    entries: clean,
  };
}

// Náhrady, které v tréninku ještě nejsou (dvakrát tentýž cvik by rozbil zápis i předpis).
function availableSubstitutes(state, exerciseId) {
  const used = new Set((state.activeWorkout?.entries ?? []).map((e) => e.exerciseId));
  return (EXERCISES[exerciseId].substitutes ?? []).filter((id) => EXERCISES[id] && !used.has(id));
}

function fmtNum(n) {
  return String(n).replace('.', ',');
}

// Týdenní zpráva kouče — šablona nad daty enginu (deterministická, poctivá).
function weeklyReview(state) {
  const today = todayISO();
  const weekAgo = addDays(today, -7);
  const sessions = state.sessions.filter((s) => s.date > weekAgo);
  const prs = state.prLog.filter((p) => p.date > weekAgo);
  const summary = progressSummary(state);
  const lines = [];

  const planned = state.profile.trainingDays?.length || 5;
  lines.push(`Tréninky: ${sessions.length}/${planned}${sessions.some((s) => s.deload) ? ' (deload)' : ''}.`);
  if (prs.length) {
    const names = prs.map((p) => EXERCISES[p.exerciseId].name).join(', ');
    lines.push(`Nová osobní maxima: ${names}. Slušná práce.`);
  }

  const p = summary.projection;
  const rate = p.rateKgWk == null ? '' : Math.abs(p.rateKgWk).toFixed(2).replace('.', ',');
  const dir = summary.direction;
  if (p.status === 'ok') {
    lines.push(dir === 'lose'
      ? `Váha klesá ${rate} kg/týden — tímhle tempem ${state.profile.goalWeightKg} kg ${fmtEta(p.etaDate)}.`
      : `Váha roste ${rate} kg/týden — tímhle tempem ${state.profile.goalWeightKg} kg ${fmtEta(p.etaDate)}.`);
  } else if (p.status === 'stalled') {
    lines.push(dir === 'lose'
      ? 'Váha stojí. Jestli se pravidelně vážíš, engine v pondělí ubere kalorie — drž porce.'
      : 'Váha stojí. Jestli se pravidelně vážíš, engine v pondělí přidá kalorie — drž příjem.');
  } else if (p.status === 'losing') {
    lines.push('Váha klesá — na bulk málo jíš. Zkontroluj kalorie.');
  } else if (p.status === 'gaining') {
    lines.push('Váha roste — na hubnutí jíš víc, než myslíš. Zkontroluj porce a věci navíc.');
  } else if (p.status === 'maintaining') {
    lines.push(`Váha drží (trend ${p.rateKgWk >= 0 ? '+' : '−'}${rate} kg/týden) — přesně to je cíl.`);
  } else if (p.status === 'reached') {
    lines.push('Cílová váha je tady. Engine přepnul na udržování.');
  } else if (p.status === 'need_more_data') {
    lines.push('Na trend váhy potřebuju víc vážení — stačí 3×/týden ráno.');
  }

  const q = summary.quality.quality;
  if (q === 'lean_gain') lines.push('Pas drží — přírůstek vypadá čistě.');
  if (q === 'too_fast' && dir !== 'lose') lines.push(`Pas roste ${String(summary.quality.waistRateCmMo).replace('.', ',')} cm/měsíc — tempo je moc, engine ubírá kalorie.`);
  if (q === 'good_cut') lines.push('Pas jde dolů — hubneš tuk, ne svaly.');
  if (q === 'too_fast' && dir === 'lose') lines.push('Hubneš přes 1 % váhy týdně — to už bere i svaly. Engine přidá kalorie.');
  if (dir === 'gain' && summary.composition.muscleShareNote === 'mostly_fat') {
    lines.push('Poctivě: tímhle tempem nabíráš hlavně tuk, ne svaly. Strop svalů je '
      + `${summary.composition.muscleBandKgMo[1].toFixed(1).replace('.', ',')} kg/měsíc.`);
  }
  if (state.offers.deload) lines.push('Tělo hlásí únavu — zvaž nabízený deload týden.');
  return lines;
}

function fmtEta(iso) {
  const d = new Date(`${iso}T12:00:00`);
  const months = ['ledna', 'února', 'března', 'dubna', 'května', 'června', 'července', 'srpna', 'září', 'října', 'listopadu', 'prosince'];
  return `vychází na ${months[d.getMonth()]} ${d.getFullYear()}`;
}

// ---------- onboarding ----------

function completeOnboarding(state, { profile, lifts, waistCm, programPrefs = null }) {
  state.profile = { ...state.profile, ...profile, startDate: todayISO() };
  if (programPrefs) state.program = { prefs: programPrefs, days: buildProgram(programPrefs) };
  state.exercises = buildInitialExerciseStates(lifts, programDays(state));
  state.targets = initialTargets(state.profile, state.profile.weightKg);
  upsertWeighIn(state, state.profile.weightKg);
  if (waistCm) upsertWaist(state, waistCm);
  state.onboarded = true;
}



// ===== src/app/timer.js =====
// Rest timer: nikdy netiká setIntervalem naslepo — drží endTime a zbytek přepočítává
// z hodin (JS v pozadí na mobilu stojí). Wake lock jako progressive enhancement.


// ---- WAV na míru (bez souborů): tichá smyčka pro sluchátka a záložní pípnutí ----

function wavDataUrl(sampleRate, samples) {
  const n = samples.length;
  const buf = new ArrayBuffer(44 + n * 2);
  const v = new DataView(buf);
  const str = (o, s) => { for (let i = 0; i < s.length; i++) v.setUint8(o + i, s.charCodeAt(i)); };
  str(0, 'RIFF'); v.setUint32(4, 36 + n * 2, true); str(8, 'WAVE'); str(12, 'fmt ');
  v.setUint32(16, 16, true); v.setUint16(20, 1, true); v.setUint16(22, 1, true);
  v.setUint32(24, sampleRate, true); v.setUint32(28, sampleRate * 2, true);
  v.setUint16(32, 2, true); v.setUint16(34, 16, true);
  str(36, 'data'); v.setUint32(40, n * 2, true);
  for (let i = 0; i < n; i++) v.setInt16(44 + i * 2, Math.max(-32768, Math.min(32767, Math.round(samples[i] * 32767))), true);
  const bytes = new Uint8Array(buf);
  let bin = '';
  for (let i = 0; i < bytes.length; i += 0x8000) bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
  return `data:audio/wav;base64,${btoa(bin)}`;
}

// Tón do pole vzorků: 20 ms náběh, 60 ms doznění — stejný zvuk jako přes Web Audio.
function mixTone(samples, sampleRate, at, freq, dur, vol) {
  const from = Math.round(at * sampleRate);
  const len = Math.round(dur * sampleRate);
  for (let i = 0; i < len && from + i < samples.length; i++) {
    const t = i / sampleRate;
    const env = Math.min(1, t / 0.02, (dur - t) / 0.06);
    samples[from + i] += Math.sin(2 * Math.PI * freq * t) * vol * Math.max(0, env);
  }
}

let silentWavUrl = null;
// 1 s „skoro ticha“ (±1 LSB): Bluetooth sluchátka berou stream jako živý a neuspí
// spojení, přitom to není slyšet.
function silentWav() {
  if (!silentWavUrl) {
    const sr = 8000;
    const s = new Float32Array(sr);
    for (let i = 0; i < sr; i++) s[i] = (i % 2 ? 1 : -1) / 32767;
    silentWavUrl = wavDataUrl(sr, s);
  }
  return silentWavUrl;
}

let beepWavUrl = null;
function beepWav() {
  if (!beepWavUrl) {
    const sr = 22050;
    const s = new Float32Array(Math.round(sr * 0.7));
    mixTone(s, sr, 0.02, 1046, 0.18, 0.5);
    mixTone(s, sr, 0.24, 1318, 0.32, 0.5);
    beepWavUrl = wavDataUrl(sr, s);
  }
  return beepWavUrl;
}

const RestTimer = {
  endTime: null,
  label: '',
  el: null,
  interval: null,
  wakeLock: null,
  audioCtx: null,
  beeped: false,
  scheduled: [],
  totalSec: null,
  tonesReady: false,
  resuming: false,
  visibilityBound: false,
  keepAlive: null,
  keepAliveTimer: null,

  start(seconds, label = '') {
    this.totalSec = seconds;
    this.endTime = Date.now() + seconds * 1000;
    this.label = label;
    this.beeped = false;
    this.ensureUI();
    this.requestWakeLock();
    this.startKeepAlive(seconds); // z gesta uživatele (✓) → smí začít hrát
    this.scheduleTones();
    this.render();
  },

  adjust(deltaSeconds) {
    if (!this.endTime) return;
    this.endTime += deltaSeconds * 1000;
    this.totalSec = Math.max(1, (this.totalSec ?? 0) + deltaSeconds);
    this.startKeepAlive(Math.max(1, (this.endTime - Date.now()) / 1000));
    this.scheduleTones();
    this.render();
  },

  stop() {
    this.endTime = null;
    if (this.interval) { clearInterval(this.interval); this.interval = null; }
    this.clearScheduled();
    this.stopKeepAlive();
    this.el?.remove();
    this.el = null;
    this.releaseWakeLock();
  },

  remainingSec() {
    if (!this.endTime) return null;
    return Math.round((this.endTime - Date.now()) / 1000);
  },

  ensureUI() {
    if (this.el) return;
    this.el = h('div', { class: 'timerbar', role: 'timer', 'aria-live': 'off' });
    (document.getElementById('dock') ?? document.body).append(this.el);
    if (!this.interval) this.interval = setInterval(() => this.render(), 500);
    // listener jen jednou za život appky a jen když časovač opravdu běží,
    // jinak by se hromadil a držel displej rozsvícený i mimo trénink
    if (!this.visibilityBound) {
      this.visibilityBound = true;
      document.addEventListener('visibilitychange', () => {
        if (document.hidden || !this.endTime) return;
        this.render();
        this.requestWakeLock();
      });
    }
  },

  render() {
    if (!this.el) return;
    const remaining = this.remainingSec();
    if (remaining == null) return;
    if (remaining <= 0 && !this.beeped) { this.beep(); this.beeped = true; }

    const overrun = remaining <= 0;
    const abs = Math.abs(remaining);
    const mm = Math.floor(abs / 60);
    const ss = String(abs % 60).padStart(2, '0');
    const soon = !overrun && remaining <= 5;
    const pct = this.totalSec ? Math.max(0, Math.min(100, (remaining / this.totalSec) * 100)) : 0;

    this.el.className = `timerbar${overrun ? ' done' : ''}`;
    this.el.replaceChildren(
      h('div', { class: 'timer-progress' }, h('div', { style: `width:${overrun ? 100 : pct}%` })),
      h('div', { class: 'timerbar-inner' },
        h('div', { class: `timer-digits${soon ? ' soon' : ''}${overrun ? ' overrun' : ''}` },
          `${overrun && remaining < 0 ? '+' : ''}${mm}:${ss}`),
        h('div', { class: 'timer-mid' },
          h('div', { class: 'label' }, overrun ? 'Jdi na to' : 'Pauza'),
          this.label ? h('div', { class: 'timer-next' }, this.label) : null,
        ),
      ),
      h('div', { class: 'timer-actions' },
        h('button', { class: 'btn small ghost', onClick: () => this.adjust(-15) }, '−15 s'),
        h('button', { class: 'btn small ghost', onClick: () => this.adjust(15) }, '+15 s'),
        h('button', { class: 'btn small', onClick: () => this.stop() }, 'Hotovo'),
      ),
    );
  },

  async requestWakeLock() {
    try {
      if ('wakeLock' in navigator && document.visibilityState === 'visible') {
        this.wakeLock = await navigator.wakeLock.request('screen');
      }
    } catch { /* starší iOS / nepovoleno — timer funguje dál, jen zhasne displej */ }
  },

  releaseWakeLock() {
    try { this.wakeLock?.release(); } catch { /* noop */ }
    this.wakeLock = null;
  },

  // ---- zvuk ----
  // Proč tolik vrstev: iOS umlčí Web Audio přepínačem tichého režimu, Bluetooth
  // sluchátka mezi tóny uspí spojení (první tón spolknou) a po přepnutí výstupu
  // skončí audio kontext ve stavu „interrupted“, ze kterého se sám nevrátí.
  // Řešení: relace „playback“ (hraje i v tichém režimu), tichá smyčka <audio> po
