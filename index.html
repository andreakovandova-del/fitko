// ---------- váha ----------

function avg7Series(weighIns) {
  const sorted = [...weighIns].sort((a, b) => a.date.localeCompare(b.date));
  return sorted.map((w, i) => {
    const from = Date.parse(w.date) - 6 * 86400000;
    const window = sorted.filter((x) => Date.parse(x.date) >= from && x.date <= w.date);
    return { date: w.date, value: window.reduce((a, x) => a + x.kg, 0) / window.length };
  });
}

function weightCard(state, summary) {
  const raw = state.weighIns.map((w) => ({ date: w.date, value: w.kg }));
  const avg = avg7Series(state.weighIns);
  const series = [
    { kind: 'dots', points: raw },
    { kind: 'line', points: avg, label: '7denní průměr' },
  ];
  const p = summary.projection;
  if (p.status === 'ok' && avg.length) {
    const last = avg.at(-1);
    const weeksToGoal = Math.min((state.profile.goalWeightKg - last.value) / p.rateKgWk, 30);
    if (weeksToGoal > 0) {
      series.push({
        kind: 'dashed',
        points: [last, { date: addDays(last.date, Math.round(weeksToGoal * 7)), value: last.value + weeksToGoal * p.rateKgWk }],
      });
    }
  }
  return h('div', { class: 'card stack' },
    h('div', { class: 'label' }, 'Váha'),
    lineChart({
      series,
      goal: { value: state.profile.goalWeightKg, label: `cíl ${state.profile.goalWeightKg} kg` },
      yUnit: ' kg',
      yFmt: (v) => v.toFixed(1).replace('.', ','),
    }),
  );
}

const QUALITY_TEXT = {
  lean_gain: { tone: 'ok', text: 'Váha roste a pas drží — přírůstek vypadá čistě. Přesně takhle.' },
  ok_gain: { tone: 'ok', text: 'Váha roste, pas mírně taky — v normě lean bulku.' },
  too_fast: { tone: 'warn', text: 'Pas roste přes 1 cm/měsíc — tempo je moc a jde do tuku. Engine ubírá kalorie.' },
  maintaining: { tone: 'plain', text: 'Váha se drží — na bulk je potřeba jíst víc. Sleduj úpravy kalorií.' },
  losing: { tone: 'warn', text: 'Váha klesá. Jestli neběží mini-cut, chybí ti jídlo.' },
  need_more_data: { tone: 'plain', text: 'Na hodnocení kvality přírůstku potřebuju pravidelnou váhu a pas.' },
};

function honestyCard(state, summary) {
  const p = summary.projection;
  const q = QUALITY_TEXT[summary.quality.quality];
  const comp = summary.composition;
  const lines = [];

  if (p.status === 'ok') {
    lines.push(`Tímhle tempem (${p.rateKgWk.toFixed(2).replace('.', ',')} kg/týden) vychází ${state.profile.goalWeightKg} kg na ${fmtDate(p.etaDate)} ${p.etaDate.slice(0, 4)}.`);
  } else if (p.status === 'stalled') {
    lines.push('Váha stagnuje — projekce k cíli teď neexistuje. Engine přidá kalorie, drž příjem.');
  } else if (p.status === 'losing') {
    lines.push('Váha klesá — od cíle se vzdaluješ (pokud neběží mini-cut, je to problém příjmu).');
  } else if (p.status === 'reached') {
    lines.push('Cílová váha dosažena. Teď rozhoduje pas a zrcadlo.');
  } else {
    lines.push('Na projekci potřebuju ~2 týdny vážení (stačí 3× týdně ráno).');
  }

  if (comp.rateKgMo != null && comp.muscleShareNote) {
    const band = comp.muscleBandKgMo;
    if (comp.muscleShareNote === 'mostly_fat') {
      lines.push(`Poctivě: nabíráš ${comp.rateKgMo.toFixed(1).replace('.', ',')} kg/měsíc, ale svaly teď rostou max ~${band[1].toFixed(1).replace('.', ',')} kg/měsíc — zbytek je tuk. Zpomal.`);
    } else if (comp.muscleShareNote === 'part_fat') {
      lines.push(`Tempo ${comp.rateKgMo.toFixed(1).replace('.', ',')} kg/měsíc je nad stropem svalů (~${band[1].toFixed(1).replace('.', ',')} kg/měsíc) — část jde do tuku.`);
    }
  }

  return h('div', { class: 'card stack' },
    h('div', { class: 'row between' },
      h('div', { class: 'label' }, 'Poctivá projekce'),
      q ? h('span', { class: `badge ${q.tone}` }, summary.quality.quality === 'lean_gain' ? 'čistý gain'
        : summary.quality.quality === 'too_fast' ? 'moc rychle'
        : summary.quality.quality === 'ok_gain' ? 'v normě' : '—') : null,
    ),
    ...lines.map((l) => h('p', { class: 'small' }, l)),
    q ? h('p', { class: 'muted small' }, q.text) : null,
  );
}

function reviewCard(state) {
  const lines = weeklyReview(state);
  if (!lines.length) return null;
  return h('div', { class: 'card stack' },
    h('div', { class: 'label' }, 'Týdenní zpráva'),
    ...lines.map((l) => h('p', { class: 'small' }, l)),
  );
}

// Historie tréninků — ťuknutím se otevře plná rekapitulace.

// Zpětný zápis tréninku: vybereš jednotku a den, pak se otevře normální
// obrazovka tréninku — jen se uloží pod zvoleným datem.
function backfillModal(state) {
  let dateInput;
  let unit = 'push';
  const { close } = openModal(
    h('h3', {}, 'Zapsat dřívější trénink'),

// Fázové milníky se počítají živě z profilu a AKTUÁLNÍ váhy —
// změna cíle v Nastavení je okamžitě přepíše.
function phaseRows(state, avg7) {
  const p = state.profile;
  const plan = honestPlan({
    startWeightKg: avg7 ?? p.weightKg,
    goalWeightKg: p.goalWeightKg,
    priority: p.priority,
    trainingAgeMonths: trainingAgeMonthsNow(state),
    fromIso: todayISO(),
  });
  const row = (label, detail, hit) => h('div', { class: `milestone${hit ? ' hit' : ''}` },
    h('span', { class: 'm-flag' }, hit ? '✓' : '·'),
    h('div', { class: 'grow' },
      h('div', { style: 'font-weight:600;font-size:14.5px' }, label),
      h('div', { class: 'muted', style: 'font-size:12.5px' }, detail),
    ),
  );
  if (plan.mode === 'there') {
    return [row(`${p.goalWeightKg} kg`, 'cílová váha dosažena — teď rozhoduje pas a zrcadlo', true)];
  }
  if (plan.mode === 'cut') {
    return [
      row(`${p.goalWeightKg} kg`, `~${fmtMonthYear(plan.etaIso)} při −0,5 % týdně`, false),
      row('Břišáky', 'řez je odhaluje — hlídej trend pasu', false),
    ];
  }
  const out = [
    row(`${p.goalWeightKg} kg na váze`, `~${fmtMonthYear(plan.etaIso)} při poctivém tempu`, avg7 != null && avg7 >= p.goalWeightKg),
  ];
  if (plan.needsCut) {
    out.push(row('Mini-cut', `po cestě ~${String(plan.fatLo).replace('.', ',')}–${String(plan.fatHi).replace('.', ',')} kg tuku — 6–8 týdnů řezu`, false));
  }
  out.push(row(`${p.goalWeightKg} kg + břišáky`,
    plan.needsCut ? `reálně ~${fmtMonthYear(plan.absEtaIso)}` : 'může přijít spolu s cílovou váhou', false));
  return out;
}

        );
      },
    }, 'Obnovit'),
  );
}

// Záchrana: ukáže všechny nalezené záznamy Fitka v zařízení a nabídne obnovu.
function recoveryModal() {
  const found = scanStoredStates();
  const usable = found.filter((f) => f.readable && f.sessions > 0);
  openModal(
    h('h3', {}, 'Co je uložené v tomhle zařízení'),
    found.length
      ? h('div', { class: 'stack', style: 'gap:8px' },
          ...found.map((f) => h('div', { class: 'row between' },
            h('div', { class: 'grow' },
              h('div', { class: 'small', style: 'font-weight:600' },
                f.key === 'fitko-state-v1' ? 'Hlavní data'
                  : f.key === 'fitko-state-backup-v1' ? 'Automatická záloha'
                  : f.key.startsWith('fitko-state-damaged') ? 'Poškozený zápis' : f.key),
              h('div', { class: 'muted', style: 'font-size:12px' },
                f.readable
                  ? `${plural(f.sessions)}${f.lastDate ? ` · poslední ${fmtDate(f.lastDate)}` : ''} · ${f.sizeKb} kB`
                  : `nečitelné · ${f.sizeKb} kB`),
            ),
            f.readable && f.sessions > 0
              ? h('button', {
                  class: 'btn small',
                  onClick: () => {
                    Store.init(f.state);
                    Store.mutate(() => {}, { publish: true, force: true });
                    toast(`Obnoveno ${plural(f.sessions)}.`);
                  },
                }, 'Obnovit')
              : null,
          )),
          usable.length ? null : h('p', { class: 'muted small' },
            'Žádný záznam s odcvičenými tréninky. Zkus otevřít appku tam, kde jsi ji používal '
            + '(ikona na ploše vs. Safari) — každé prostředí má vlastní paměť.'),
        )
      : h('p', { class: 'muted small' },
          'V tomhle prostředí není uloženo nic. Data jsou nejspíš v druhém prostředí — '
          + 'zkus ikonu na ploše, případně Safari, podle toho, kde jsi trénink zapisoval.'),
    h('div', { class: 'row between' },
      h('span', { class: 'small muted' }, 'Trvalé úložiště povoleno'),
      h('span', { class: `badge ${storageInfo.persisted ? 'ok' : 'warn'}` },
        storageInfo.persisted === null ? 'zjišťuji…' : storageInfo.persisted ? 'ano' : 'ne'),
    ),
  );
}

function showExportFallback(data) {
  openModal(
    h('h3', {}, 'Záloha'),
    h('p', { class: 'muted small' }, 'Zkopíruj si obsah a ulož kamkoli:'),
    h('textarea', { style: 'width:100%;height:180px;background:var(--surface-2);color:inherit;border:1px solid var(--line);border-radius:9px;padding:8px;font-size:12px', readonly: true }, data),
  );
}

function importModal() {
  let area;
  const { close } = openModal(
    h('h3', {}, 'Obnovit ze zálohy'),
    h('p', { class: 'muted small' }, 'Vlož obsah JSON zálohy. Přepíše aktuální data.'),
    area = h('textarea', { style: 'width:100%;height:180px;background:var(--surface-2);color:inherit;border:1px solid var(--line);border-radius:9px;padding:8px;font-size:12px', placeholder: '{ … }' }),
    h('div', { class: 'row' },
      h('button', {
        class: 'btn primary grow',
        onClick: () => {
          try {
            const parsed = parseImportedJSON(area.value);
            Store.init(parsed);
            Store.mutate(() => {}, { publish: true, force: true });
            close();
            toast('Data obnovena.');
          } catch (err) {
            toast(err.message ?? 'Neplatný soubor.');
          }
        },
      }, 'Obnovit'),
      h('button', { class: 'btn grow', onClick: () => close() }, 'Zpět'),
    ),
  );
}

function aboutCard() {
  return h('div', { class: 'card stack' },
    h('div', { class: 'label' }, 'O appce'),
    h('p', { class: 'muted', style: 'font-size:12.5px' },
      'Fitko — osobní tréninkový deník na míru. Engine: dvojitá progrese s RIR, reaktivní deloady, '
      + 'výživa řízená trendem váhy, poctivé projekce. Každé pravidlo má zdroj v meta-analýzách '
      + '(docs/PROGRAM.md a docs/research/ v repu projektu).'),
    h('div', { class: 'row between' },
      h('span', { class: 'small muted' }, 'Verze appky'),
      h('span', { class: 'num small' }, buildId() || '—'),
    ),
    h('button', {
      class: 'btn',
      onClick: async () => {
        toast('Stahuji nejnovější verzi…');
        try {
          const regs = await navigator.serviceWorker?.getRegistrations?.() ?? [];
          await Promise.all(regs.map((r) => r.unregister()));
          const keys = await caches?.keys?.() ?? [];
          await Promise.all(keys.map((k) => caches.delete(k)));
        } catch { /* i tak zkusíme reload */ }
        location.reload();
      },
    }, 'Načíst nejnovější verzi'),
    h('button', {
      class: 'btn',
      onClick: () => openModal(
        h('h3', {}, 'Přidat na plochu telefonu'),
        h('p', { class: 'small' }, 'iPhone: otevři tuhle stránku v Safari → tlačítko Sdílet → „Přidat na plochu“. Appka pak běží celoobrazovkově jako nativní.'),
        h('p', { class: 'small' }, 'Android (Chrome): menu ⋮ → „Přidat na plochu“ / „Nainstalovat aplikaci“.'),
        h('p', { class: 'muted small' }, 'Data se ukládají do zařízení a zároveň do appky samotné — přežijí i výměnu telefonu.'),
      ),
    }, 'Návod: na plochu telefonu'),
  );
}


// ===== src/app/main.js =====
// Bootstrap a router. Pořadí při startu je důležité: snímek dokumentu se bere
// PŘED prvním renderem (je šablonou pro samo-publikaci artifactu).











let currentTab = 'today';

const TABS = [
  { id: 'today', label: 'Dnes', icon: 'today', render: renderToday },
  { id: 'progress', label: 'Progres', icon: 'progress', render: renderProgress },
  { id: 'settings', label: 'Nastavení', icon: 'settings', render: renderSettings },
];

function render() {
  const root = document.getElementById('app');
  const scrollY = window.scrollY;
  const state = Store.state;

  document.querySelector('.tabbar')?.remove();

  if (!state.onboarded) {
    renderOnboarding(root);
    return;
  }

  if (state.activeWorkout) {
    renderWorkout(root);
    requestAnimationFrame(() => window.scrollTo(0, scrollY));
    return;
  }

  RestTimer.stop();
  const tab = TABS.find((t) => t.id === currentTab) ?? TABS[0];
  tab.render(root);

  document.body.append(h('nav', { class: 'tabbar' },
    h('div', { class: 'tabbar-inner' },
      ...TABS.map((t) => h('button', {
        class: `tab${t.id === currentTab ? ' active' : ''}`,
        'aria-label': t.label,
        onClick: () => { if (currentTab !== t.id) { currentTab = t.id; window.scrollTo(0, 0); render(); } },
      }, icon(t.icon), t.label)),
    ),
  ));
  requestAnimationFrame(() => window.scrollTo(0, scrollY));
}

function boot() {
  captureDocument();
  initCapabilities();

  // trvalé úložiště (instalovaná home-screen appka je přesně heuristika, na kterou to prohlížeče schválí)
  try { navigator.storage?.persist?.(); } catch { /* nepovinné */ }

  // offline režim — jen ve standalone buildu (marker: link rel=manifest)
  if ('serviceWorker' in navigator && document.querySelector('link[rel="manifest"]')) {
    try { navigator.serviceWorker.register('./sw.js'); } catch { /* nepovinné */ }
  }
  initCloud();
  const persisted = loadPersistedState();
  backupState(persisted); // snímek toho, co bylo na disku před spuštěním
  Store.init(persisted);
  Store.onChange = render;

  Store.mutate((s) => dailyMaintenance(s), { rerender: false, publish: false, markDirty: false });

  // po startu zálohuj, ať je v cloudu vždy poslední stav i bez další akce
  if (Store.state.sessions?.length) scheduleCloudBackup(Store.state);

  render();
}

if (document.readyState === 'loading') {
  document.addEventListener('DOMContentLoaded', boot);
} else {
  boot();
}

})();
</script>
