// ===== src/app/storage.js =====
// Úložiště: localStorage (rychlé, per zařízení) + samo-publikace artifactu (trvalé, přežije
// i ztrátu telefonu — stav je vložený přímo v HTML stránky). Publikace RELOADUJE otevřený
// pohled, proto se volá jen na bezpečných hranicích (konec tréninku, onboarding, vážení),
// nikdy uprostřed zápisu série. Záloha: export/import JSON.

const STORAGE_KEY = 'fitko-state-v1';
const STATE_SCRIPT_RE = /(<script type="application\/json" id="fitko-state">)[\s\S]*?(<\/script>)/;

let originalHtml = null; // snímek dokumentu před prvním renderem — šablona pro publish
let artifactNs;          // Promise<namespace|null>
let downloadsNs;

const storageInfo = { localOk: false, artifactOk: null, lastPublish: null, publishError: null };

function captureDocument() {
  originalHtml = `<!doctype html>\n${document.documentElement.outerHTML}`;
}

function initCapabilities() {
  const use = (name) => {
    try {
      if (typeof window !== 'undefined' && window.claude?.use) return window.claude.use(name);
    } catch { /* mimo artifact runtime */ }
    return Promise.resolve(null);
  };
  artifactNs = use('artifact');
  downloadsNs = use('downloads');
  artifactNs.then((ns) => { storageInfo.artifactOk = ns != null; });
}

function detectLocal() {
  try {
    localStorage.setItem('fitko-probe', '1');
    localStorage.removeItem('fitko-probe');
    return true;
  } catch { return false; }
}

function loadPersistedState() {
  storageInfo.localOk = detectLocal();

  let embedded = null;
  try {
    const node = document.getElementById('fitko-state');
    if (node) {
      const parsed = JSON.parse(node.textContent);
      if (!parsed.__empty) embedded = parsed;
    }
  } catch { embedded = null; }

  let local = null;
  if (storageInfo.localOk) {
    try {
      const raw = localStorage.getItem(STORAGE_KEY);
      if (raw) local = JSON.parse(raw);
    } catch { local = null; }
  }

  if (local && embedded) {
    return (local.updatedAt ?? '') >= (embedded.updatedAt ?? '') ? local : embedded;
  }
  return local ?? embedded ?? null;
}

function saveLocal(state) {
  if (!storageInfo.localOk) return;
  try { localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); } catch { storageInfo.localOk = false; }
}

function escapeForScriptTag(json) {
  return json.replace(/</g, '\\u003c');
}

// Publikace nové verze artifactu se stavem vloženým do HTML. Reloaduje stránku!
async function publishState(state) {
  const ns = await artifactNs;
  if (!ns || !originalHtml) return { ok: false, reason: 'unavailable' };
  const json = escapeForScriptTag(JSON.stringify(state));
  const html = originalHtml.replace(STATE_SCRIPT_RE, (m, open, close) => `${open}${json}${close}`);
  try {
    await ns.publish(html);
    storageInfo.lastPublish = new Date().toISOString();
    return { ok: true };
  } catch (err) {
    storageInfo.publishError = err?.code ?? String(err);
    // conflict → jiný pohled publikoval první, stránka se sama reloadne na vítěze
    return { ok: false, reason: storageInfo.publishError };
  }
}

async function exportJSON(state) {
  const data = JSON.stringify(state, null, 2);
  const filename = `fitko-zaloha-${(state.updatedAt ?? '').slice(0, 10) || 'export'}.json`;
  const ns = await downloadsNs;
  if (ns) {
    try {
      await ns.save({ filename, data });
      return { ok: true, via: 'downloads' };
    } catch { /* pokračuj fallbackem */ }
  }
  try {
    await navigator.clipboard.writeText(data);
    return { ok: true, via: 'clipboard' };
  } catch {
    return { ok: false, data };
  }
}

function parseImportedJSON(text) {
  const parsed = JSON.parse(text);
  if (typeof parsed !== 'object' || parsed == null || !parsed.profile || !parsed.version) {
    throw new Error('Tohle nevypadá jako záloha Fitka.');
  }
  return parsed;
}


// ===== src/app/appstate.js =====
// Stav aplikace a orchestrace enginu. Engine počítá, tohle drží data a pravidla toku.












const APP_VERSION = 1;
const REST_SECONDS = { heavy: 180, secondary: 120, isolation: 90 };

function defaultState() {
  return {
    version: APP_VERSION,
    updatedAt: new Date().toISOString(),
    onboarded: false,
    profile: { ...DEFAULT_PROFILE, startDate: todayISO() },
    targets: null,
    nutritionLog: [],
    exercises: {},
    addedSets: {},
    enabledSlotExercises: [],
    sessions: [],
    activeWorkout: null,
    weighIns: [],
    waist: [],
    checkins: [],
    bestE1rms: {},
    prLog: [],
    deload: { active: false, sessionsLeft: 0, lastEndDate: null },
    volume: { lastChangeDate: null },
    offers: {},
    offersDismissed: {},
    minicutEndDate: null,
    introDismissed: false,
  };
}

// ---------- Store ----------

const Store = {
  state: null,
  onChange: null, // nastavuje main.js (re-render)

  init(persisted) {
    this.state = persisted ?? defaultState();
    if (persisted) migrate(this.state);
  },

  // mutace: fn(state); publish = bezpečná hranice → nová verze artifactu (reload!)
  // Bez publish se změna označí jako nesynchronizovaná (pendingPublish) a doladí
  // se při příštím startu appky nebo na další bezpečné hranici.
  mutate(fn, { publish = false, rerender = true, markDirty = true } = {}) {
    const result = fn(this.state);
    this.state.updatedAt = new Date().toISOString();
    if (publish) this.state.pendingPublish = false;
    else if (markDirty) this.state.pendingPublish = true;
    saveLocal(this.state);
    if (publish) publishState(this.state); // async; při úspěchu se stránka reloadne
    if (rerender && this.onChange) this.onChange();
    return result;
  },
};

function migrate(state) {
  const fresh = defaultState();
  for (const key of Object.keys(fresh)) if (!(key in state)) state[key] = fresh[key];
}

// ---------- plán a předpisy ----------

function nextUnitDay(state) {
  return WEEK_TEMPLATE[state.sessions.length % WEEK_TEMPLATE.length];
}

// Seznam cviků jednotky vč. zapnutých slot cviků a přidaných sérií.
function unitExerciseList(state, day) {
  const list = day.exercises.map((ex) => ({
    exerciseId: ex.exerciseId,
    sets: ex.sets + (state.addedSets[slotKey(day.unit, ex.exerciseId)] ?? 0),
    dropsetLast: !!ex.dropsetLast,
  }));
  for (const slot of day.slots) {
    if (slot.kind === 'add_exercise' && state.enabledSlotExercises.includes(slot.exerciseId)) {
      list.push({
        exerciseId: slot.exerciseId,
        sets: slot.sets + (state.addedSets[slotKey(day.unit, slot.exerciseId)] ?? 0),
        dropsetLast: !!EXERCISES[slot.exerciseId].dropset,
      });
    }
  }
  return list;
}

function ensureExerciseState(state, exerciseId, sets) {
  if (!state.exercises[exerciseId]) {
    state.exercises[exerciseId] = { exerciseId, status: 'calibration', loadKg: null, sets: sets ?? 3 };
  } else if (sets != null) {
    state.exercises[exerciseId].sets = sets;
  }
  return state.exercises[exerciseId];
}

// Historie výkonů cviku (bez deload týdnů — nízké zátěže nesmí mást progresi).
function recentPerformances(state, exerciseId, n = 3) {
  const out = [];
  for (let i = state.sessions.length - 1; i >= 0 && out.length < n; i--) {
    const session = state.sessions[i];
    if (session.deload) continue;
    const entry = session.entries.find((e) => e.exerciseId === exerciseId);
    if (entry && entry.sets.some((s) => !s.isWarmup)) {
      out.push({ date: session.date, sets: entry.sets });
    }
  }
  return out;
}

function prescriptionFor(state, exerciseId, sets) {
  const def = EXERCISES[exerciseId];
  const exState = { ...ensureExerciseState(state, exerciseId), sets };
  if (state.deload.active) return deloadPrescription(def, exState, loadStep);
  return computeNextPrescription(def, exState, recentPerformances(state, exerciseId));
}

function warmupsFor(exerciseId, loadKg) {
  const def = EXERCISES[exerciseId];
  if (loadKg == null || def.incrementRule === 'bodyweight' || def.type === 'isolation' || loadKg < 30) return [];
  const step = loadStep(def);
  if (def.type === 'heavy') {
    return [
      { weightKg: Math.max(step, roundToStep(loadKg * 0.5, step)), reps: 5 },
      { weightKg: Math.max(step, roundToStep(loadKg * 0.75, step)), reps: 3 },
    ];
  }
  return [{ weightKg: Math.max(step, roundToStep(loadKg * 0.6, step)), reps: 5 }];
}

function restSecondsFor(exerciseId) {
  return REST_SECONDS[EXERCISES[exerciseId].type] ?? 120;
}

// ---------- trénink ----------

// Řádkový model cviku: rozcvičky → pracovní série → případný dropset. Logged = zapsáno.
function buildEntry(state, exerciseId, sets, dropsetLast, swappedFrom = null) {
  const prescription = prescriptionFor(state, exerciseId, sets);
  const rows = [];
  for (const w of warmupsFor(exerciseId, prescription.loadKg)) {
    rows.push({ kind: 'warmup', target: { weightKg: w.weightKg, reps: w.reps }, logged: null });
  }
  for (const reps of prescription.targetReps) {
    rows.push({ kind: 'work', target: { weightKg: prescription.loadKg, reps }, logged: null });
  }
  if (dropsetLast && !state.deload.active) {
    rows.push({ kind: 'drop', target: { weightKg: null, reps: null }, logged: null });
  }
  return { exerciseId, swappedFrom, prescription, rows };
}

function buildWorkout(state) {
  const day = nextUnitDay(state);
  const entries = unitExerciseList(state, day)
    .map((item) => buildEntry(state, item.exerciseId, item.sets, item.dropsetLast));
  return {
    unit: day.unit,
    unitName: day.name,
    date: todayISO(),
    startedAt: Date.now(),
    deload: state.deload.active,
    entries,
  };
}

function swapWorkoutExercise(state, entryIndex, newExerciseId) {
  const workout = state.activeWorkout;
  const entry = workout.entries[entryIndex];
  const sets = entry.prescription.targetReps.length;
  workout.entries[entryIndex] = buildEntry(
    state, newExerciseId, sets, !!EXERCISES[newExerciseId].dropset, entry.exerciseId,
  );
}

// Dokončení tréninku: zápis session, update stavů cviků, PR, deload bookkeeping, nabídky.
function completeWorkout(state) {
  const workout = state.activeWorkout;
  if (!workout) return null;

  const entries = workout.entries
    .map((e) => ({
      exerciseId: e.exerciseId,
      swappedFrom: e.swappedFrom ?? undefined,
      sets: e.rows
        .filter((r) => r.logged && r.logged.reps > 0)
        .map((r) => ({
          weightKg: r.logged.weightKg,
          reps: r.logged.reps,
          ...(r.logged.rir != null ? { rir: r.logged.rir } : {}),
          ...(r.kind === 'warmup' ? { isWarmup: true } : {}),
          ...(r.kind === 'drop' ? { isDropset: true } : {}),
        })),
    }))
    .filter((e) => e.sets.some((s) => !s.isWarmup && !s.isDropset));

  const session = {
    id: `s${Date.now()}`,
    date: workout.date,
    unit: workout.unit,
    deload: workout.deload,
    durationMin: Math.max(1, Math.round((Date.now() - workout.startedAt) / 60000)),
    entries,
  };
  state.sessions.push(session);

  const prs = [];
  for (const entry of entries) {
    const def = EXERCISES[entry.exerciseId];
    const perf = { date: session.date, sets: entry.sets };

    if (!session.deload) {
      const exState = ensureExerciseState(state, entry.exerciseId);
      const workoutEntry = workout.entries.find((e) => e.exerciseId === entry.exerciseId);
      state.exercises[entry.exerciseId] = nextStateAfterSession(def, exState, perf, workoutEntry?.prescription);

      const prev = state.bestE1rms[entry.exerciseId] ?? null;
      const { isPR, e1rm: sessionBest } = detectPR(prev, perf);
      if (sessionBest != null) {
        state.bestE1rms[entry.exerciseId] = Math.max(prev ?? 0, sessionBest);
        if (isPR && def.key) {
          prs.push({ exerciseId: entry.exerciseId, e1rm: sessionBest });
          state.prLog.push({ date: session.date, exerciseId: entry.exerciseId, e1rm: sessionBest });
        }
      }
    }
  }

  if (session.deload) {
    state.deload.sessionsLeft = Math.max(0, state.deload.sessionsLeft - 1);
    if (state.deload.sessionsLeft === 0) {
      state.deload.active = false;
      state.deload.lastEndDate = session.date;
      state.addedSets = volumeAfterDeload(state.addedSets);
      state.volume.lastChangeDate = session.date;
    }
  }

  state.activeWorkout = null;
  evaluateOffers(state);
  return { session, prs };
}

// ---------- nabídky enginu (deload / objem / mini-cut) ----------

function weeksBetween(fromISO, toISO) {
  if (!fromISO) return 0;
  return Math.floor(daysBetween(fromISO, toISO) / 7);
}

function keyRegressions(state) {
  return keyExerciseIds().filter((id) => {
    const exState = state.exercises[id];
    if (!exState || exState.status !== 'active') return false;
    const p = computeNextPrescription(EXERCISES[id], exState, recentPerformances(state, id));
    return p.action === 'reduce_load';
  });
}

function progressingShare(state) {
  const active = Object.values(state.exercises).filter((e) => e.status === 'active');
  if (!active.length) return 1;
  let progressing = 0;
  for (const exState of active) {
    const p = computeNextPrescription(EXERCISES[exState.exerciseId], exState, recentPerformances(state, exState.exerciseId));
    if (p.action !== 'reduce_load' && p.note !== 'missed_bottom_once') progressing++;
  }
  return progressing / active.length;
}

const OFFER_SNOOZE_DAYS = 5;

function snoozed(state, kind) {
  const at = state.offersDismissed[kind];
  return at && daysBetween(at, todayISO()) < OFFER_SNOOZE_DAYS;
}

function evaluateOffers(state) {
  const today = todayISO();
  state.offers = state.offers ?? {};

  // Deload
  if (!state.deload.active && !snoozed(state, 'deload')) {
    const trig = detectDeloadTriggers({
      keyRegressions: keyRegressions(state),
      readinessLog: state.checkins.slice(-7),
      weeksSinceDeload: weeksBetween(state.deload.lastEndDate ?? state.profile.startDate, today),
    });
    state.offers.deload = trig.triggered ? { reasons: trig.reasons } : null;
  } else {
    state.offers.deload = null;
  }

  // Objem (jen mimo deload a mimo mini-cut)
  if (!state.deload.active && !state.offers.deload && state.targets?.phase !== 'minicut' && !snoozed(state, 'volume')) {
    const check = shouldOfferVolumeIncrease({
      weeksSinceVolumeChange: weeksBetween(state.volume.lastChangeDate ?? state.profile.startDate, today),
      deloadTriggered: false,
      readinessAvg7d: readinessAvg(state.checkins.slice(-7)),
      progressingShare: progressingShare(state),
    });
    if (check.offer) {
      const picks = pickVolumeSlots(state.addedSets, new Set(state.enabledSlotExercises), 2);
      state.offers.volume = picks.length ? { picks } : null;
    } else {
      state.offers.volume = null;
    }
  } else {
    state.offers.volume = null;
  }

  // Mini-cut (jen v bulku)
  if (state.targets?.phase === 'bulk' && !snoozed(state, 'minicut')) {
    const check = miniCutCheck({ waistSeries: state.waist, weightSeries: state.weighIns, heightCm: state.profile.heightCm });
    state.offers.minicut = check.recommend ? { reasons: check.reasons } : null;
  } else {
    state.offers.minicut = null;
  }
}

function acceptDeload(state) {
  state.deload.active = true;
  state.deload.sessionsLeft = WEEK_TEMPLATE.length;
  state.offers.deload = null;
}

function dismissOffer(state, kind) {
  state.offers[kind] = null;
  state.offersDismissed[kind] = todayISO();
}

function acceptVolume(state) {
  const picks = state.offers.volume?.picks ?? [];
  for (const pick of picks) {
    if (pick.kind === 'add_exercise') {
      if (!state.enabledSlotExercises.includes(pick.exerciseId)) state.enabledSlotExercises.push(pick.exerciseId);
      ensureExerciseState(state, pick.exerciseId, pick.sets);
    } else {
      const key = slotKey(pick.unit, pick.exerciseId);
      state.addedSets[key] = (state.addedSets[key] ?? 0) + 1;
    }
  }
  state.volume.lastChangeDate = todayISO();
  state.offers.volume = null;
}

function acceptMinicut(state) {
  const avgW = currentAvgWeight(state.weighIns) ?? state.profile.weightKg;
  const proj = projectGoalDate({ weighIns: state.weighIns, goalKg: state.profile.goalWeightKg });
  state.targets = miniCutTargets(state.targets, avgW, proj.rateKgWk);
  state.minicutEndDate = addDays(todayISO(), 49);
  state.offers.minicut = null;
  state.nutritionLog.push({ date: todayISO(), kcal: state.targets.kcal, deltaKcal: 0, reason: 'minicut_start' });
}

// ---------- denní údržba (volá se při startu appky) ----------

function dailyMaintenance(state) {
  if (!state.onboarded || !state.targets) return;
  const today = todayISO();

  // konec mini-cutu → zpět do bulku s cíli podle aktuální váhy
  if (state.targets.phase === 'minicut' && state.minicutEndDate && today > state.minicutEndDate) {
    const avgW = currentAvgWeight(state.weighIns) ?? state.profile.weightKg;
    state.targets = initialTargets(state.profile, avgW);
    state.minicutEndDate = null;
    state.nutritionLog.push({ date: today, kcal: state.targets.kcal, deltaKcal: 0, reason: 'bulk_resume' });
  }

  // týdenní korekce kalorií podle trendu (max 1× za 6 dní)
  const lastAdjust = state.nutritionLog.at(-1)?.date ?? null;
  if (!lastAdjust || daysBetween(lastAdjust, today) >= 6) {
    const weeksOnPlan = Math.floor(daysBetween(state.profile.startDate, today) / 7) + 1;
    const result = weeklyAdjustment({ targets: state.targets, weighIns: state.weighIns, weeksOnPlan });
    if (result.deltaKcal !== 0) {
      state.targets.kcal = result.newKcal;
      state.nutritionLog.push({ date: today, kcal: result.newKcal, deltaKcal: result.deltaKcal, reason: result.reason });
    } else if (result.reason === 'on_track' && (!lastAdjust || daysBetween(lastAdjust, today) >= 6)) {
      state.nutritionLog.push({ date: today, kcal: state.targets.kcal, deltaKcal: 0, reason: 'on_track' });
    }
  }

  // protein sleduje aktuální váhu
  const avgW = currentAvgWeight(state.weighIns);
  if (avgW) {
    const gPerKg = state.targets.phase === 'minicut' ? 2.1 : 1.8;
    state.targets.proteinG = Math.round(gPerKg * avgW);
  }

  evaluateOffers(state);
}

// ---------- tělo ----------

function upsertWeighIn(state, kg) {
  const today = todayISO();
  const existing = state.weighIns.find((w) => w.date === today);
  if (existing) existing.kg = kg;
  else state.weighIns.push({ date: today, kg });
  state.weighIns.sort((a, b) => a.date.localeCompare(b.date));
}

function upsertWaist(state, cm) {
  const today = todayISO();
  const existing = state.waist.find((w) => w.date === today);
  if (existing) existing.cm = cm;
  else state.waist.push({ date: today, cm });
  state.waist.sort((a, b) => a.date.localeCompare(b.date));
}

function upsertCheckin(state, values) {
  const today = todayISO();
  const existing = state.checkins.find((c) => c.date === today);
  if (existing) Object.assign(existing, values);
  else state.checkins.push({ date: today, ...values });
  state.checkins.sort((a, b) => a.date.localeCompare(b.date));
}

// ---------- odvozená data pro obrazovky ----------

function weeklyStreakLog(state) {
  if (!state.sessions.length) return [];
  const weekKey = (iso) => {
    const d = new Date(`${iso}T12:00:00`);
    const day = (d.getDay() + 6) % 7; // Po = 0
    d.setDate(d.getDate() - day);
    return d.toISOString().slice(0, 10);
  };
  const counts = new Map();
  for (const s of state.sessions) {
    const key = weekKey(s.date);
    counts.set(key, (counts.get(key) ?? 0) + 1);
  }
  const currentWeek = weekKey(todayISO());
  const weeks = [];
  let cursor = currentWeek;
  const firstWeek = weekKey(state.sessions[0].date);
  while (cursor >= firstWeek && weeks.length < 200) {
    weeks.push({
      completed: counts.get(cursor) ?? 0,
      planned: 5,
      isCurrentWeek: cursor === currentWeek,
    });
    cursor = addDays(cursor, -7);
  }
  return weeks;
}

function e1rmSeries(state, exerciseId) {
  const out = [];
  for (const session of state.sessions) {
    if (session.deload) continue;
    const entry = session.entries.find((e) => e.exerciseId === exerciseId);
    if (!entry) continue;
    let best = null;
    for (const s of entry.sets) {
      if (s.isWarmup) continue;
      const val = e1rm(s.weightKg, s.reps, s.rir);
      if (val != null && (best == null || val > best)) best = val;
    }
    if (best != null) out.push({ date: session.date, value: best });
  }
  return out;
}

function trainingAgeMonthsNow(state) {
  return (state.profile.trainingAgeMonths ?? 0) + Math.floor(daysBetween(state.profile.startDate, todayISO()) / 30.44);
}

function progressSummary(state) {
  const avg7 = currentAvgWeight(state.weighIns);
  return {
    avg7,
    projection: projectGoalDate({ weighIns: state.weighIns, goalKg: state.profile.goalWeightKg }),
    quality: gainQuality({ weighIns: state.weighIns, waistSeries: state.waist }),
    composition: gainComposition({ weighIns: state.weighIns, trainingAgeMonths: trainingAgeMonthsNow(state) }),
    weightMilestone: nextWeightMilestone(avg7, state.profile.weightKg, state.profile.goalWeightKg),
    streak: streakWeeks(weeklyStreakLog(state)),
  };
}

// Týdenní zpráva kouče — šablona nad daty enginu (deterministická, poctivá).
function weeklyReview(state) {
  const today = todayISO();
  const weekAgo = addDays(today, -7);
  const sessions = state.sessions.filter((s) => s.date > weekAgo);
  const prs = state.prLog.filter((p) => p.date > weekAgo);
  const summary = progressSummary(state);
  const lines = [];

  lines.push(`Tréninky: ${sessions.length}/5${sessions.some((s) => s.deload) ? ' (deload)' : ''}.`);
  if (prs.length) {
    const names = prs.map((p) => EXERCISES[p.exerciseId].name).join(', ');
    lines.push(`Nová osobní maxima: ${names}. Slušná práce.`);
  }

  const p = summary.projection;
  if (p.status === 'ok') {
    lines.push(`Váha roste ${p.rateKgWk.toFixed(2).replace('.', ',')} kg/týden — tímhle tempem ${state.profile.goalWeightKg} kg ${fmtEta(p.etaDate)}.`);
  } else if (p.status === 'stalled') {
    lines.push('Váha stojí. Jestli se pravidelně vážíš, engine v pondělí přidá kalorie — drž příjem.');
  } else if (p.status === 'losing') {
    lines.push('Váha klesá — na bulk málo jíš. Zkontroluj kalorie.');
  } else if (p.status === 'need_more_data') {
    lines.push('Na trend váhy potřebuju víc vážení — stačí 3×/týden ráno.');
  }

  if (summary.quality.quality === 'lean_gain') lines.push('Pas drží — přírůstek vypadá čistě.');
  if (summary.quality.quality === 'too_fast') lines.push(`Pas roste ${String(summary.quality.waistRateCmMo).replace('.', ',')} cm/měsíc — tempo je moc, engine ubírá kalorie.`);
  if (summary.composition.muscleShareNote === 'mostly_fat') {
    lines.push('Poctivě: tímhle tempem nabíráš hlavně tuk, ne svaly. Strop svalů je '
      + `${summary.composition.muscleBandKgMo[1].toFixed(1).replace('.', ',')} kg/měsíc.`);
  }
  if (state.offers.deload) lines.push('Tělo hlásí únavu — zvaž nabízený deload týden.');
  return lines;
}

function fmtEta(iso) {
  const d = new Date(`${iso}T12:00:00`);
  const months = ['ledna', 'února', 'března', 'dubna', 'května', 'června', 'července', 'srpna', 'září', 'října', 'listopadu', 'prosince'];
  return `vychází na ${months[d.getMonth()]} ${d.getFullYear()}`;
}

// ---------- onboarding ----------

function completeOnboarding(state, { profile, lifts, waistCm }) {
  state.profile = { ...state.profile, ...profile, startDate: todayISO() };
  state.exercises = buildInitialExerciseStates(lifts);
  state.targets = initialTargets(state.profile, state.profile.weightKg);
  upsertWeighIn(state, state.profile.weightKg);
  if (waistCm) upsertWaist(state, waistCm);
  state.onboarded = true;
}



// ===== src/app/timer.js =====
// Rest timer: nikdy netiká setIntervalem naslepo — drží endTime a zbytek přepočítává
// z hodin (JS v pozadí na mobilu stojí). Wake lock jako progressive enhancement.


const RestTimer = {
  endTime: null,
  label: '',
  el: null,
  interval: null,
  wakeLock: null,
  audioCtx: null,
  beeped: false,

  start(seconds, label = '') {
    this.endTime = Date.now() + seconds * 1000;
    this.label = label;
    this.beeped = false;
    this.ensureUI();
    this.requestWakeLock();
    this.render();
  },

  adjust(deltaSeconds) {
    if (!this.endTime) return;
    this.endTime += deltaSeconds * 1000;
    this.render();
  },

  stop() {
    this.endTime = null;
    if (this.interval) { clearInterval(this.interval); this.interval = null; }
    this.el?.remove();
    this.el = null;
    this.releaseWakeLock();
  },

  remainingSec() {
    if (!this.endTime) return null;
    return Math.round((this.endTime - Date.now()) / 1000);
  },

  ensureUI() {
    if (this.el) return;
    this.el = h('div', { class: 'timerbar', role: 'timer' });
    document.body.append(this.el);
    if (!this.interval) this.interval = setInterval(() => this.render(), 500);
    document.addEventListener('visibilitychange', () => {
      if (!document.hidden) { this.render(); this.requestWakeLock(); }
    });
  },

  render() {
    if (!this.el) return;
    const remaining = this.remainingSec();
    if (remaining == null) return;
    if (remaining <= 0 && !this.beeped) { this.beep(); this.beeped = true; }

    const overrun = remaining < 0;
    const abs = Math.abs(remaining);
    const mm = Math.floor(abs / 60);
    const ss = String(abs % 60).padStart(2, '0');

    this.el.replaceChildren(h('div', { class: 'timerbar-inner' },
      h('div', { class: `timer-digits${overrun ? ' overrun' : ''}` }, `${overrun ? '+' : ''}${mm}:${ss}`),
      h('div', { class: 'timer-mid' },
        h('div', { class: 'label' }, 'Pauza'),
        this.label ? h('div', { class: 'timer-next' }, this.label) : null,
      ),
      h('button', { class: 'btn small ghost', onClick: () => this.adjust(-15) }, '−15'),
      h('button', { class: 'btn small ghost', onClick: () => this.adjust(15) }, '+15'),
      h('button', { class: 'btn small', 'aria-label': 'Přeskočit pauzu', onClick: () => this.stop() }, '✕'),
    ));
  },

  async requestWakeLock() {
    try {
      if ('wakeLock' in navigator && document.visibilityState === 'visible') {
        this.wakeLock = await navigator.wakeLock.request('screen');
      }
    } catch { /* starší iOS / nepovoleno — timer funguje dál, jen zhasne displej */ }
  },

  releaseWakeLock() {
    try { this.wakeLock?.release(); } catch { /* noop */ }
    this.wakeLock = null;
  },

  beep() {
    try {
      this.audioCtx = this.audioCtx ?? new (window.AudioContext ?? window.webkitAudioContext)();
      const ctx = this.audioCtx;
      const now = ctx.currentTime;
      for (const [offset, freq] of [[0, 880], [0.18, 880], [0.36, 1175]]) {
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        osc.frequency.value = freq;
        osc.type = 'sine';
        gain.gain.setValueAtTime(0.001, now + offset);
        gain.gain.exponentialRampToValueAtTime(0.25, now + offset + 0.02);
        gain.gain.exponentialRampToValueAtTime(0.001, now + offset + 0.15);
        osc.connect(gain).connect(ctx.destination);
        osc.start(now + offset);
        osc.stop(now + offset + 0.16);
      }
      if (navigator.vibrate) navigator.vibrate([120, 60, 120]);
    } catch { /* zvuk není kritický */ }
  },
};


// ===== src/app/charts.js =====
// SVG čárové grafy: tenké čáry, recesivní mřížka, crosshair + tooltip, přímé popisky.
// Barva dat = --chart-data (validováno vůči oběma povrchům), text v textových tokenech.


const NS = 'http://www.w3.org/2000/svg';

let chartUid = 0; // unikátní id gradientů (na stránce je víc grafů)

function svgEl(tag, attrs = {}) {
  const el = document.createElementNS(NS, tag);
  for (const [k, v] of Object.entries(attrs)) el.setAttribute(k, v);
  return el;
}

/**
 * Čárový graf časové řady.
 * @param cfg {
 *   series: [{ points: [{date, value}], kind: 'line'|'dots'|'dashed', label?, emphasizeLast? }],
 *   goal?: { value, label },
 *   height?, yUnit?, yFmt?: (v)=>string
 * }
 * Barvy: line/dots = var(--chart-data), dashed = var(--muted), goal = var(--faint).
 */
function lineChart(cfg) {
  const W = 448;
  const H = cfg.height ?? 190;
  const PAD = { top: 16, right: 12, bottom: 24, left: 40 };
  const yFmt = cfg.yFmt ?? ((v) => String(Math.round(v)));

  const allPoints = cfg.series.flatMap((s) => s.points);
  if (!allPoints.length) {
    return h('div', { class: 'muted small', style: 'padding:12px 0' }, 'Zatím žádná data.');
  }

  const dates = allPoints.map((p) => Date.parse(p.date));
  const values = allPoints.map((p) => p.value).concat(cfg.goal ? [cfg.goal.value] : []);
  let x0 = Math.min(...dates);
  let x1 = Math.max(...dates);
  if (x1 - x0 < 86400000 * 7) x1 = x0 + 86400000 * 7; // ať graf nevypadá rozplácle první týden
  let yMin = Math.min(...values);
  let yMax = Math.max(...values);
  const span = Math.max(yMax - yMin, 1);
  yMin -= span * 0.12;
  yMax += span * 0.12;

  const px = (d) => PAD.left + ((Date.parse(d) - x0) / (x1 - x0)) * (W - PAD.left - PAD.right);
  const py = (v) => PAD.top + (1 - (v - yMin) / (yMax - yMin)) * (H - PAD.top - PAD.bottom);

  const svg = svgEl('svg', { viewBox: `0 0 ${W} ${H}`, role: 'img' });

  // mřížka + osy Y (3 ticky)
  for (let i = 0; i <= 2; i++) {
    const v = yMin + ((yMax - yMin) * i) / 2;
    const y = py(v);
    svg.append(svgEl('line', { x1: PAD.left, x2: W - PAD.right, y1: y, y2: y, stroke: 'var(--chart-grid)', 'stroke-width': 1 }));
    const label = svgEl('text', {
      x: PAD.left - 6, y: y + 3.5, 'text-anchor': 'end',
      fill: 'var(--muted)', 'font-size': 10.5, 'font-family': 'var(--font-num)',
    });
    label.textContent = yFmt(v);
    svg.append(label);
  }

  // osy X — max 4 popisky dat
  const tickCount = Math.min(4, Math.max(2, Math.round((x1 - x0) / (86400000 * 21))));
  for (let i = 0; i <= tickCount; i++) {
    const t = x0 + ((x1 - x0) * i) / tickCount;
    const iso = new Date(t).toISOString().slice(0, 10);
    const label = svgEl('text', {
      x: px(iso), y: H - 7, 'text-anchor': i === 0 ? 'start' : i === tickCount ? 'end' : 'middle',
      fill: 'var(--faint)', 'font-size': 10.5, 'font-family': 'var(--font-num)',
    });
    label.textContent = fmtDate(iso);
    svg.append(label);
  }

  // cílová linka
  if (cfg.goal) {
    const y = py(cfg.goal.value);
    svg.append(svgEl('line', {
      x1: PAD.left, x2: W - PAD.right, y1: y, y2: y,
      stroke: 'var(--faint)', 'stroke-width': 1, 'stroke-dasharray': '2 4',
    }));
    const label = svgEl('text', {
      x: W - PAD.right, y: y - 4, 'text-anchor': 'end',
      fill: 'var(--muted)', 'font-size': 10.5, 'font-family': 'var(--font-ui)',
    });
    label.textContent = cfg.goal.label;
    svg.append(label);
  }

  const linePath = (points) => points
    .map((p, i) => `${i === 0 ? 'M' : 'L'}${px(p.date).toFixed(1)},${py(p.value).toFixed(1)}`)
    .join('');

  let hoverSource = null;
  for (const s of cfg.series) {
    if (!s.points.length) continue;
    if (s.kind === 'dots') {
      for (const p of s.points) {
        svg.append(svgEl('circle', { cx: px(p.date), cy: py(p.value), r: 2.1, fill: 'var(--chart-data)', opacity: 0.32 }));
      }
    } else {
      // výplň pod hlavní čarou — dodává grafu hloubku
      if (s.kind === 'line' && s.points.length >= 2) {
        const gid = `cfill${++chartUid}`;
        const defs = svgEl('defs');
        const grad = svgEl('linearGradient', { id: gid, x1: 0, y1: 0, x2: 0, y2: 1 });
        const stopTop = svgEl('stop', { offset: 0, 'stop-opacity': 0.2 });
        stopTop.setAttribute('style', 'stop-color: var(--chart-data)');
        const stopBot = svgEl('stop', { offset: 1, 'stop-opacity': 0 });
        stopBot.setAttribute('style', 'stop-color: var(--chart-data)');
        grad.append(stopTop, stopBot);
        defs.append(grad);
        svg.append(defs);
        const first = s.points[0];
        const lastP = s.points.at(-1);
        svg.append(svgEl('path', {
          d: `${linePath(s.points)}L${px(lastP.date).toFixed(1)},${H - PAD.bottom}L${px(first.date).toFixed(1)},${H - PAD.bottom}Z`,
          fill: `url(#${gid})`,
        }));
      }
      const path = svgEl('path', {
        d: linePath(s.points),
        fill: 'none',
        stroke: s.kind === 'dashed' ? 'var(--muted)' : 'var(--chart-data)',
        'stroke-width': 2,
        'stroke-linecap': 'round',
        'stroke-linejoin': 'round',
        ...(s.kind === 'dashed' ? { 'stroke-dasharray': '5 5' } : {}),
      });
      svg.append(path);
      if (s.kind === 'line') {
        hoverSource = s;
        if (s.emphasizeLast !== false) {
          const last = s.points.at(-1);
          svg.append(svgEl('circle', { cx: px(last.date), cy: py(last.value), r: 6.5, fill: 'var(--chart-data)', opacity: 0.25 }));
          svg.append(svgEl('circle', { cx: px(last.date), cy: py(last.value), r: 3.6, fill: 'var(--chart-data)' }));
        }
        if (s.label) {
          const last = s.points.at(-1);
          const label = svgEl('text', {
            x: Math.min(px(last.date) + 6, W - PAD.right - 2),
            y: Math.max(py(last.value) - 8, 11),
            'text-anchor': px(last.date) > W - 90 ? 'end' : 'start',
            fill: 'var(--muted)', 'font-size': 10.5, 'font-family': 'var(--font-ui)',
          });
          label.textContent = s.label;
          svg.append(label);
        }
      }
    }
  }

  // crosshair + tooltip
  const wrap = h('div', { class: 'chart-wrap', style: 'position:relative' });
  wrap.append(svg);
  if (hoverSource) {
    const cross = svgEl('line', { y1: PAD.top, y2: H - PAD.bottom, stroke: 'var(--faint)', 'stroke-width': 1, visibility: 'hidden' });
    const dot = svgEl('circle', { r: 4, fill: 'var(--chart-data)', stroke: 'var(--surface)', 'stroke-width': 2, visibility: 'hidden' });
    svg.append(cross, dot);
    const tip = h('div', {
      class: 'small num',
      style: 'position:absolute;top:2px;left:0;background:var(--surface-2);border:1px solid var(--line);'
        + 'border-radius:7px;padding:3px 8px;pointer-events:none;visibility:hidden;white-space:nowrap;z-index:5',
    });
    wrap.append(tip);

    const onMove = (clientX) => {
      const rect = svg.getBoundingClientRect();
      const relX = ((clientX - rect.left) / rect.width) * W;
      let nearest = null;
      let bestDist = Infinity;
      for (const p of hoverSource.points) {
        const d = Math.abs(px(p.date) - relX);
        if (d < bestDist) { bestDist = d; nearest = p; }
      }
      if (!nearest) return;
      const cx = px(nearest.date);
      cross.setAttribute('x1', cx); cross.setAttribute('x2', cx);
      cross.setAttribute('visibility', 'visible');
      dot.setAttribute('cx', cx); dot.setAttribute('cy', py(nearest.value));
      dot.setAttribute('visibility', 'visible');
      tip.textContent = `${fmtDate(nearest.date)} · ${yFmt(nearest.value)}${cfg.yUnit ?? ''}`;
      tip.style.visibility = 'visible';
      const tipX = Math.min(Math.max((cx / W) * rect.width - 40, 2), rect.width - 110);
      tip.style.left = `${tipX}px`;
    };
    const hide = () => {
      cross.setAttribute('visibility', 'hidden');
      dot.setAttribute('visibility', 'hidden');
      tip.style.visibility = 'hidden';
    };
    svg.addEventListener('mousemove', (e) => onMove(e.clientX));
    svg.addEventListener('mouseleave', hide);
    svg.addEventListener('touchstart', (e) => onMove(e.touches[0].clientX), { passive: true });
    svg.addEventListener('touchmove', (e) => onMove(e.touches[0].clientX), { passive: true });
    svg.addEventListener('touchend', hide);
  }

  return wrap;
}

// ---------- hlavní karta ----------

function heroCard(state) {
  const day = nextUnitDay(state);
  const list = unitExerciseList(state, day);
  const totalSets = list.reduce((a, e) => a + e.sets, 0);
  const estMin = Math.round((totalSets * 2.4 + 8) / 5) * 5;

  return h('div', { class: 'today-hero stack' },
    h('div', { class: 'row between' },
      h('span', { class: 'label' }, state.deload.active ? `Deload — zbývá ${state.deload.sessionsLeft}` : 'Další trénink'),
      weekDots(state),
    ),
    h('div', { class: 'display unit-name' }, day.name),
    h('div', { class: 'muted small' },
      `${list.length} cviků · ${totalSets} sérií · ~${estMin} min`,
      state.deload.active ? ' · lehčí zátěže, RIR 3+' : '',
    ),
    h('div', { class: 'muted small' }, list.map((e) => EXERCISES[e.exerciseId].name).join(' · ')),
    h('button', {
      class: 'btn primary big',
      onClick: () => Store.mutate((s) => { s.activeWorkout = buildWorkout(s); }),
    }, 'Začít trénink'),
  );
}

function weekDots(state) {
  const today = new Date(`${todayISO()}T12:00:00`);
  const monday = new Date(today);
  monday.setDate(today.getDate() - ((today.getDay() + 6) % 7));
  const dots = [];
  for (let i = 0; i < 7; i++) {
    const d = new Date(monday);
    d.setDate(monday.getDate() + i);
    const iso = d.toISOString().slice(0, 10);
    const done = state.sessions.some((s) => s.date === iso);
    const isToday = iso === todayISO();
    const isTraining = state.profile.trainingDays.includes((i + 1) % 7);
    if (!isTraining && !done) continue;
    dots.push(h('span', { class: `dot${done ? ' done' : ''}${isToday ? ' today' : ''}` }));
  }
  return h('div', { class: 'weekdots' }, dots);
}

// Jednorázový průvodce — zmizí po „Rozumím".
function introCard(state) {
  if (state.introDismissed) return null;
  const step = (n, text) => h('div', { class: 'row', style: 'align-items:flex-start;gap:8px' },

  return h('div', { class: 'card stack' },
    h('div', { class: 'label' }, 'Jak Fitko funguje'),
    step(1, 'Ťukni na Začít trénink — u každé série ti appka řekne váhu i opakování.'),
    step(2, 'Po každé sérii potvrď oranžové ✓. Víc appka nechce.'),

    h('button', { class: 'btn', onClick: () => Store.mutate((s) => { s.introDismissed = true; }) }, 'Rozumím'),
  );
}

// ---------- nabídky enginu ----------

const DELOAD_REASONS = {
  performance: 'výkon u klíčových cviků padá 2 tréninky po sobě',
  readiness: 'check-iny hlásí 3 dny po sobě únavu',
  failsafe: 'jedeš už 10+ týdnů bez vydechnutí',
};

function offerCards(state) {
  const cards = [];
  const offers = state.offers ?? {};

  if (offers.deload) {
    cards.push(offerCard(
      'Deload týden', 'warn',
      `Tělo si říká o vydechnutí: ${offers.deload.reasons.map((r) => DELOAD_REASONS[r.type]).join('; ')}. `
      + 'Týden na −50 % sérií a −25 % zátěže — pak zpátky silnější.',
      [
        h('button', { class: 'btn primary', onClick: () => Store.mutate((s) => acceptDeload(s), { publish: true }) }, 'Zahájit deload'),
        h('button', { class: 'btn ghost', onClick: () => Store.mutate((s) => dismissOffer(s, 'deload')) }, 'Později'),
      ],
    ));
  }

  if (offers.volume) {
    const names = offers.volume.picks.map((p) => (p.kind === 'add_exercise'
      ? `nový cvik ${EXERCISES[p.exerciseId].name}`
      : `+1 série ${EXERCISES[p.exerciseId].name}`)).join(', ');
    cards.push(offerCard(
      'Čas přidat objem', 'accent',
      `Progrese šlape a regenerace drží — engine navrhuje: ${names}.`,
      [
        h('button', { class: 'btn primary', onClick: () => Store.mutate((s) => acceptVolume(s), { publish: true }) }, 'Přidat'),
        h('button', { class: 'btn ghost', onClick: () => Store.mutate((s) => dismissOffer(s, 'volume')) }, 'Nechat jak je'),
      ],
    ));
  }

  if (offers.minicut) {
    const why = offers.minicut.reasons.map((r) => (r.type === 'whtr'
      ? 'pas přesáhl polovinu výšky'
      : `pas roste ${String(r.detail).replace('.', ',')} cm/měsíc`)).join('; ');
    cards.push(offerCard(
      'Doporučení: mini-cut', 'warn',
      `${why}. 6–8 týdnů na −0,5 % váhy týdně vrátí břišáky a sval zůstane.`,
      [
        h('button', { class: 'btn primary', onClick: () => Store.mutate((s) => acceptMinicut(s), { publish: true }) }, 'Zahájit mini-cut'),
        h('button', { class: 'btn ghost', onClick: () => Store.mutate((s) => dismissOffer(s, 'minicut')) }, 'Později'),
      ],
    ));
  }

  return cards;
}

function offerCard(title, tone, text, buttons) {
  return h('div', { class: 'card stack' },
    h('div', { class: `label ${tone}-text` }, title),
    h('p', { class: 'small' }, text),
    h('div', { class: 'row' }, ...buttons),
  );
}

function nutritionNotice(state) {
  const last = state.nutritionLog.at(-1);
  if (!last || last.deltaKcal === 0 || daysBetween(last.date, todayISO()) > 2) return null;
  const why = last.reason === 'too_slow' ? 'váha roste pomaleji, než má' : 'váha roste rychleji, než má';
  return h('div', { class: 'card row between' },
    h('div', {},
      h('div', { class: 'label' }, 'Výživa upravena'),
      h('div', { class: 'small muted' }, why),

    h('div', { class: 'num', style: 'font-weight:600' }, `${fmtSigned(last.deltaKcal)} kcal`),

          const v = parseFloat(weightInput.value.replace(',', '.'));

          Store.mutate((s) => upsertWeighIn(s, v));
          toast(`Váha ${fmtKg(v)} uložena.`);
        },
      }, weighedToday ? 'Opravit' : 'Uložit'),
    ),
    waistDue ? h('div', { class: 'row' },
      waistInput = h('input', {
        class: 'num', type: 'number', inputmode: 'decimal',
        placeholder: lastWaist ? `pas — naposledy ${String(lastWaist.cm).replace('.', ',')} cm` : 'pas u pupku (cm) — 1× týdně',
      }),
      h('button', {
        class: 'btn',
        onClick: () => {
          const v = parseFloat(waistInput.value.replace(',', '.'));
          if (!v || v < 50 || v > 150) { toast('To nevypadá jako obvod pasu v cm.'); return; }
          Store.mutate((s) => upsertWaist(s, v));
          toast('Pas uložen.');
        },
      }, 'Uložit'),
    ) : null,
    summary.avg7 ? h('div', { class: 'row between' },
      h('span', { class: 'small muted' }, '7denní průměr'),
      h('span', { class: 'num small', style: 'font-weight:600' }, fmtKg(summary.avg7)),
    ) : null,
  );
}

function footRow(state, summary) {
  const unit = summary.streak === 1 ? 'týden' : summary.streak >= 2 && summary.streak <= 4 ? 'týdny' : 'týdnů';
  const tile = (value, unitText, label) => h('div', { class: 'card grow', style: 'padding:12px 14px' },
    h('div', { class: 'row', style: 'gap:5px;align-items:baseline' },
      h('span', { class: 'num', style: 'font-size:28px;font-weight:600' }, value),
      h('span', { class: 'muted', style: 'font-size:12px' }, unitText),
    ),
    h('div', { class: 'label', style: 'font-size:10px' }, label),
  );
  return h('div', { class: 'row', style: 'gap:8px' },
    summary.streak > 0 ? tile(String(summary.streak), unit, 'V kuse') : null,
    summary.weightMilestone ? tile(String(summary.weightMilestone.targetKg), 'kg', 'Další checkpoint') : null,
  );
}


// ===== src/app/view_workout.js =====
// Trénink: jedna scrollovací obrazovka, zápis série na jeden ťuk, auto rest timer.




function renderWorkout(root) {
  const state = Store.state;
  const workout = state.activeWorkout;
  clearEl(root);

  const elapsedMin = Math.max(0, Math.round((Date.now() - workout.startedAt) / 60000));
  const loggedWork = workout.entries.reduce(
    (a, e) => a + e.rows.filter((r) => r.kind !== 'warmup' && r.logged).length, 0);

  // první nezapsaný řádek = aktuální série (zvýrazněná)
  let nextKey = null;
  outer: for (let ei = 0; ei < workout.entries.length; ei++) {
    const rows = workout.entries[ei].rows;
    for (let ri = 0; ri < rows.length; ri++) {
      if (!rows[ri].logged) { nextKey = `${ei}:${ri}`; break outer; }
    }
  }

  root.append(h('div', { class: 'screen', style: 'padding-bottom:130px' },
    h('div', { class: 'session-head', style: `padding-top:max(6px, env(safe-area-inset-top, 0px))` },
      h('div', {},
        h('div', { class: 'row', style: 'gap:8px' },
          h('span', { class: 'label' }, workout.deload ? 'Deload trénink' : 'Trénink'),
          workout.deload ? h('span', { class: 'badge warn' }, '−50 % sérií · RIR 3+') : null,
        ),
        h('div', { class: 'display unit-name' }, workout.unitName),
      ),
      h('div', { class: 'stack', style: 'align-items:flex-end;gap:6px' },
        h('button', { class: 'icon-btn', 'aria-label': 'Zrušit trénink', onClick: confirmCancel }, '✕'),
        h('span', { class: 'muted small num' }, `${elapsedMin} min`),
      ),
    ),
    state.sessions.length < 3
      ? h('p', { class: 'muted', style: 'font-size:12.5px' },
          'Čísla jsou předvyplněná — po odcvičené sérii je jen potvrď oranžovým ✓ (nebo uprav). RIR = kolik opakování ti zbylo v rezervě.')
      : null,
    ...workout.entries.map((entry, i) => exerciseCard(state, workout, entry, i, nextKey)),
    h('button', {
      class: 'btn primary big',
      disabled: loggedWork === 0,
      onClick: finishWorkout,
    }, 'Dokončit trénink'),
  ));
}

function confirmCancel() {
  const { close } = openModal(
    h('h3', {}, 'Zahodit trénink?'),
    h('p', { class: 'muted small' }, 'Zapsané série se neuloží do historie.'),
    h('div', { class: 'row' },
      h('button', { class: 'btn danger grow', onClick: () => { RestTimer.stop(); Store.mutate((s) => { s.activeWorkout = null; }); close(); } }, 'Zahodit'),
      h('button', { class: 'btn grow', onClick: () => close() }, 'Zpět k tréninku'),
    ),
  );
}

// ---------- karta cviku ----------

function exerciseCard(state, workout, entry, entryIndex, nextKey) {
  const def = EXERCISES[entry.exerciseId];
  const p = entry.prescription;
  const calibrating = p.action === 'calibrate';
  const recent = recentPerformances(state, entry.exerciseId, 1)[0];
  const ghostSets = recent ? recent.sets.filter((s) => !s.isWarmup && !s.isDropset) : [];

  const rangeText = `${p.targetReps.length}× ${def.repRange[0]}–${p.rangeHi ?? def.repRange[1]}`;
  const rirText = workout.deload ? 'RIR 3+' : `RIR ${def.rir[0]}–${def.rir[1]}`;

  return h('div', { class: 'card ex-card' },
    h('div', { class: 'ex-head' },
      h('div', { class: 'grow' },
        h('div', { class: 'ex-title' }, def.name, entry.swappedFrom ? h('span', { class: 'muted small' }, ' (náhrada)') : null),
        h('div', { class: 'ex-sub' }, `${rangeText} · ${rirText}`,
          actionNote(p) ? h('span', { class: 'accent-text' }, actionNote(p)) : null),
      ),
      h('button', { class: 'icon-btn', 'aria-label': 'Proč tenhle cvik', onClick: () => whyModal(def) }, 'ⓘ'),
      h('button', { class: 'icon-btn', 'aria-label': 'Vyměnit cvik', onClick: () => swapModal(entryIndex, def) }, '⇄'),
    ),
    calibrating
      ? h('div', { class: 'small', style: 'padding:0 14px 10px;color:var(--accent)' },
          `Kalibrace: najdi váhu na ~${p.targetReps[0]} opakování při ${rirText}.`)
      : null,
    ...entry.rows.map((row, rowIndex) => setRow(workout, entry, entryIndex, row, rowIndex, ghostSets, nextKey)),
  );
}

function actionNote(p) {
  const notes = {
    increase_load: ' · dnes se přidává',
    reduce_load: ' · lehčí — restart progrese',
    extend_range: ' · prodloužený rozsah',
    suggest_slot: ' · rozsah na stropu',
  };
  return notes[p.action] ?? '';
}

function whyModal(def) {
  openModal(
    h('h3', {}, def.name),
    h('p', { class: 'small' }, def.why),
    h('p', { class: 'muted small' }, 'Parametry cviku vycházejí z rešerše — viz docs/PROGRAM.md v repu projektu.'),
  );
}

function swapModal(entryIndex, def) {
  const subs = (def.substitutes ?? []).filter((id) => EXERCISES[id]);
  const { close } = openModal(
    h('h3', {}, 'Vyměnit cvik'),
    h('p', { class: 'muted small' }, 'Obsazené nářadí? Náhrada dědí rozsah; váha se kalibruje znovu.'),
    ...subs.map((id) => h('button', {
      class: 'btn', style: 'justify-content:flex-start',
      onClick: () => {
        Store.mutate((s) => swapWorkoutExercise(s, entryIndex, id));
        close();
        toast(`Vyměněno za ${EXERCISES[id].name}.`);
      },
    }, EXERCISES[id].name)),
  );
}

// ---------- řádek série ----------

function setRow(workout, entry, entryIndex, row, rowIndex, ghostSets, nextKey) {
  const def = EXERCISES[entry.exerciseId];
  const step = loadStep(def);
  const done = !!row.logged;

  // dropset cíl se dopočítá z poslední zapsané pracovní série
  let target = row.target;
  if (row.kind === 'drop') {
    const lastWork = [...entry.rows].reverse().find((r) => r.kind === 'work' && r.logged);
    const base = lastWork?.logged.weightKg ?? entry.prescription.loadKg;
    const drop = base != null ? dropsetPrescription(def, base) : null;
    target = { weightKg: drop?.dropLoadKg ?? null, reps: null };
  }

  const workIndex = entry.rows.filter((r) => r.kind === 'work').indexOf(row);
  const ghost = row.kind === 'work' && ghostSets[workIndex]
    ? `min. ${fmtKg(ghostSets[workIndex].weightKg, true)}×${ghostSets[workIndex].reps}${ghostSets[workIndex].rir != null ? `@${ghostSets[workIndex].rir}` : ''}`
    : null;

  const weightInput = h('input', {
    class: 'set-input', type: 'number', inputmode: 'decimal', placeholder: 'kg',
    value: row.logged ? row.logged.weightKg : (target.weightKg ?? ''),
    disabled: done,
  });
  const repsInput = h('input', {
    class: 'set-input', type: 'number', inputmode: 'numeric', placeholder: row.kind === 'drop' ? 'do selh.' : 'op.',
    value: row.logged ? row.logged.reps : (target.reps ?? ''),
    disabled: done,
  });

  let rir = row.logged ? (row.logged.rir ?? null) : (row.kind === 'work' && !workout.deload ? def.rir[0] : null);
  const rirChips = row.kind === 'work'
    ? h('div', { class: 'rir-chips', role: 'group', 'aria-label': 'RIR' },
        ...[0, 1, 2, 3, 4].map((v) => {
          const chip = h('button', {
            class: `rir-chip${rir === v ? ' active' : ''}`,
            disabled: done,
            onClick: () => {
              rir = v;
              chip.parentElement.querySelectorAll('.rir-chip').forEach((c) => c.classList.remove('active'));
              chip.classList.add('active');
            },
          }, String(v));
          return chip;
        }))
    : null;

  const label = row.kind === 'warmup' ? 'W · rozcvička' : row.kind === 'drop' ? 'DS · dropset' : `Série ${workIndex + 1}`;

  const onCheck = () => {
    if (done) {
      Store.mutate((s) => { s.activeWorkout.entries[entryIndex].rows[rowIndex].logged = null; });
      return;
    }
    const weightKg = parseFloat(String(weightInput.value).replace(',', '.'));
    const reps = parseInt(repsInput.value, 10);
    if (Number.isNaN(reps) || reps <= 0) { toast('Doplň opakování.'); return; }
    if ((Number.isNaN(weightKg) || weightKg < 0) && def.incrementRule !== 'bodyweight') { toast('Doplň váhu.'); return; }
    Store.mutate((s) => {
      s.activeWorkout.entries[entryIndex].rows[rowIndex].logged = {
        weightKg: Number.isNaN(weightKg) ? 0 : weightKg,
        reps,
        ...(row.kind === 'work' && rir != null ? { rir } : {}),
      };
    });
    if (row.kind !== 'warmup') {
      RestTimer.start(restSecondsFor(entry.exerciseId), nextUpLabel(Store.state.activeWorkout));
    } else {
      RestTimer.start(60, nextUpLabel(Store.state.activeWorkout));
    }
  };

  const ghostText = row.kind === 'drop' ? '−22 % · do selhání' : ghost ?? (row.kind === 'warmup' ? 'lehce, bez RIR' : 'první záznam');

  const isNext = !done && nextKey === `${entryIndex}:${rowIndex}`;
  return h('div', { class: `set-block${done ? ' done' : ''}${row.kind === 'warmup' ? ' warmup' : ''}${isNext ? ' next' : ''}` },
    h('div', { class: 'set-line' },
      h('div', { class: 'set-id' },
        h('span', { class: 'set-no' }, label),
        h('span', { class: 'ghost-val' }, ghostText),
      ),
      weightInput,
      done ? null : h('div', { class: 'stepper' },
        h('button', { 'aria-label': 'víc kg', onClick: () => { weightInput.value = String((parseFloat(String(weightInput.value).replace(',', '.')) || 0) + step); } }, '+'),
        h('button', { 'aria-label': 'míň kg', onClick: () => { weightInput.value = String(Math.max(0, (parseFloat(String(weightInput.value).replace(',', '.')) || 0) - step)); } }, '−'),
      ),
      repsInput,
      done ? null : h('div', { class: 'stepper' },
        h('button', { 'aria-label': 'víc opakování', onClick: () => { repsInput.value = String((parseInt(repsInput.value, 10) || 0) + 1); } }, '+'),
        h('button', { 'aria-label': 'míň opakování', onClick: () => { repsInput.value = String(Math.max(0, (parseInt(repsInput.value, 10) || 0) - 1)); } }, '−'),
      ),
      h('button', { class: `check-btn${done ? ' done' : ''}`, 'aria-label': done ? 'Odznačit sérii' : 'Potvrdit sérii', onClick: onCheck }, '✓'),
    ),
    rirChips ? h('div', { class: 'rir-line' },
      h('span', { class: 'label' }, 'RIR'),
      rirChips,
    ) : null,
  );
}

function nextUpLabel(workout) {
  for (const entry of workout.entries) {
    for (const row of entry.rows) {
      if (!row.logged) {
        const def = EXERCISES[entry.exerciseId];
        const t = row.target;
        const what = t.weightKg != null && t.reps != null
          ? `${fmtKg(t.weightKg, true)} kg × ${t.reps}`
          : t.reps != null ? `× ${t.reps}` : 'dropset';
        return `Další: ${def.name} ${what}`;
      }
    }
  }
  return 'Poslední série — pak Dokončit.';
}

// ---------- dokončení ----------

function finishWorkout() {
  RestTimer.stop();
  const result = Store.mutate((s) => completeWorkout(s));
  if (!result) return;
  const { session, prs } = result;

  const workSets = session.entries.reduce((a, e) => a + e.sets.filter((s) => !s.isWarmup).length, 0);
  const tonnage = Math.round(session.entries.reduce(
    (a, e) => a + e.sets.filter((s) => !s.isWarmup).reduce((b, s) => b + s.weightKg * s.reps, 0), 0));

  const { close } = openModal(
    h('div', { class: 'display', style: 'font-size:38px' }, 'Hotovo'),
    h('div', { class: 'row', style: 'gap:8px' },
      statTile(String(session.durationMin), 'minut'),
      statTile(String(workSets), 'sérií'),
      statTile(`${tonnage.toLocaleString('cs-CZ')}`, 'kg celkem'),
    ),
    ...prs.map((pr) => h('div', { class: 'card row between pr-flash', style: 'border-color:var(--accent)' },
      h('span', { style: 'font-weight:700' }, `PR — ${EXERCISES[pr.exerciseId].name}`),
      h('span', { class: 'num accent-text', style: 'font-weight:600' }, `e1RM ${fmtKg(Math.round(pr.e1rm))}`),
    )),
    h('button', {
      class: 'btn primary big',
      onClick: () => { close(); Store.mutate(() => {}, { publish: true }); },
    }, 'Zavřít a uložit'),
  );
}

function statTile(value, label) {
  return h('div', { class: 'stat-tile grow' },
    h('span', { class: 'value' }, value),
    h('span', { class: 'label' }, label),
  );
}


// ===== src/app/view_progress.js =====
// Progres: trend váhy vs. poctivá projekce, síla (e1RM), pas, milníky, týdenní zpráva.






let selectedLift = 'bench';

function renderProgress(root) {
  const state = Store.state;
  clearEl(root);
  const summary = progressSummary(state);

function statTiles(summary) {
  const rate = summary.projection.rateKgWk;

    tile(summary.avg7 != null ? fmtKg(summary.avg7, true) : '—', 'kg · 7denní ⌀'),

    tile(String(summary.streak), summary.streak === 1 ? 'týden v kuse' : 'týdnů v kuse'),
  );
}

function tile(value, label) {
  return h('div', { class: 'stat-tile' },
    h('span', { class: 'value' }, value),
    h('span', { class: 'label' }, label),
  );
}

// ---------- váha ----------

function avg7Series(weighIns) {
  const sorted = [...weighIns].sort((a, b) => a.date.localeCompare(b.date));
  return sorted.map((w, i) => {
    const from = Date.parse(w.date) - 6 * 86400000;
    const window = sorted.filter((x) => Date.parse(x.date) >= from && x.date <= w.date);
    return { date: w.date, value: window.reduce((a, x) => a + x.kg, 0) / window.length };
  });
}

function weightCard(state, summary) {
  const raw = state.weighIns.map((w) => ({ date: w.date, value: w.kg }));
  const avg = avg7Series(state.weighIns);
  const series = [
    { kind: 'dots', points: raw },
    { kind: 'line', points: avg, label: '7denní průměr' },
  ];
  const p = summary.projection;
  if (p.status === 'ok' && avg.length) {
    const last = avg.at(-1);
    const weeksToGoal = Math.min((state.profile.goalWeightKg - last.value) / p.rateKgWk, 30);
    if (weeksToGoal > 0) {
      series.push({
        kind: 'dashed',
        points: [last, { date: addDays(last.date, Math.round(weeksToGoal * 7)), value: last.value + weeksToGoal * p.rateKgWk }],
      });
    }
  }
  return h('div', { class: 'card stack' },
    h('div', { class: 'label' }, 'Váha'),
    lineChart({
      series,
      goal: { value: state.profile.goalWeightKg, label: `cíl ${state.profile.goalWeightKg} kg` },
      yUnit: ' kg',
      yFmt: (v) => v.toFixed(1).replace('.', ','),
    }),
  );
}

const QUALITY_TEXT = {
  lean_gain: { tone: 'ok', text: 'Váha roste a pas drží — přírůstek vypadá čistě. Přesně takhle.' },
  ok_gain: { tone: 'ok', text: 'Váha roste, pas mírně taky — v normě lean bulku.' },
  too_fast: { tone: 'warn', text: 'Pas roste přes 1 cm/měsíc — tempo je moc a jde do tuku. Engine ubírá kalorie.' },
  maintaining: { tone: 'plain', text: 'Váha se drží — na bulk je potřeba jíst víc. Sleduj úpravy kalorií.' },
  losing: { tone: 'warn', text: 'Váha klesá. Jestli neběží mini-cut, chybí ti jídlo.' },
  need_more_data: { tone: 'plain', text: 'Na hodnocení kvality přírůstku potřebuju pravidelnou váhu a pas.' },
};

function honestyCard(state, summary) {
  const p = summary.projection;
  const q = QUALITY_TEXT[summary.quality.quality];
  const comp = summary.composition;
  const lines = [];

  if (p.status === 'ok') {
    lines.push(`Tímhle tempem (${p.rateKgWk.toFixed(2).replace('.', ',')} kg/týden) vychází ${state.profile.goalWeightKg} kg na ${fmtDate(p.etaDate)} ${p.etaDate.slice(0, 4)}.`);
  } else if (p.status === 'stalled') {
    lines.push('Váha stagnuje — projekce k cíli teď neexistuje. Engine přidá kalorie, drž příjem.');
  } else if (p.status === 'losing') {
    lines.push('Váha klesá — od cíle se vzdaluješ (pokud neběží mini-cut, je to problém příjmu).');
  } else if (p.status === 'reached') {
    lines.push('Cílová váha dosažena. Teď rozhoduje pas a zrcadlo.');
  } else {
    lines.push('Na projekci potřebuju ~2 týdny vážení (stačí 3× týdně ráno).');
  }

  if (comp.rateKgMo != null && comp.muscleShareNote) {
    const band = comp.muscleBandKgMo;
    if (comp.muscleShareNote === 'mostly_fat') {
      lines.push(`Poctivě: nabíráš ${comp.rateKgMo.toFixed(1).replace('.', ',')} kg/měsíc, ale svaly teď rostou max ~${band[1].toFixed(1).replace('.', ',')} kg/měsíc — zbytek je tuk. Zpomal.`);
    } else if (comp.muscleShareNote === 'part_fat') {
      lines.push(`Tempo ${comp.rateKgMo.toFixed(1).replace('.', ',')} kg/měsíc je nad stropem svalů (~${band[1].toFixed(1).replace('.', ',')} kg/měsíc) — část jde do tuku.`);
    }
  }

  return h('div', { class: 'card stack' },
    h('div', { class: 'row between' },
      h('div', { class: 'label' }, 'Poctivá projekce'),
      q ? h('span', { class: `badge ${q.tone}` }, summary.quality.quality === 'lean_gain' ? 'čistý gain'
        : summary.quality.quality === 'too_fast' ? 'moc rychle'
        : summary.quality.quality === 'ok_gain' ? 'v normě' : '—') : null,
    ),
    ...lines.map((l) => h('p', { class: 'small' }, l)),
    q ? h('p', { class: 'muted small' }, q.text) : null,
  );
}

function reviewCard(state) {
  const lines = weeklyReview(state);
  if (!lines.length) return null;
  return h('div', { class: 'card stack' },
    h('div', { class: 'label' }, 'Týdenní zpráva'),
    ...lines.map((l) => h('p', { class: 'small' }, l)),
  );
}

// ---------- síla ----------

function strengthCard(state) {
  const lifts = Object.keys(STRENGTH_ANCHORS);
  const series = e1rmSeries(state, selectedLift);
  const best = state.bestE1rms[selectedLift] ?? null;
  const milestone = nextStrengthMilestone(selectedLift, best);

  return h('div', { class: 'card stack' },
    h('div', { class: 'row between' },
      h('div', { class: 'label' }, 'Síla — odhad 1RM'),
      best ? h('span', { class: 'num small', style: 'font-weight:600' }, fmtKg(Math.round(best))) : null,
    ),
    h('div', { class: 'row', style: 'flex-wrap:wrap;gap:6px' },
      ...lifts.map((id) => h('button', {
        class: `chip${selectedLift === id ? ' active' : ''}`,
        onClick: () => { selectedLift = id; Store.onChange?.(); },
      }, EXERCISES[id].name.split(' ')[0])),
    ),
    series.length >= 2
      ? lineChart({ series: [{ kind: 'line', points: series }], height: 150, yUnit: ' kg', yFmt: (v) => String(Math.round(v)) })
      : h('p', { class: 'muted small' }, 'Graf se vykreslí po druhém tréninku s tímhle cvikem.'),
    best && milestone ? h('div', { class: 'stack', style: 'gap:5px' },
      h('div', { class: 'row between' },
        h('span', { class: 'muted small' }, `Další milník: ${milestone.targetE1rm} kg`),
        h('span', { class: 'num small muted' }, `${Math.round(best)} / ${milestone.targetE1rm}`),
      ),
      h('div', { class: 'progressline' },
        h('div', { style: `width:${Math.min(100, Math.round((best / milestone.targetE1rm) * 100))}%` })),
    ) : null,
  );
}

// ---------- pas ----------

function waistCard(state, summary) {
  if (!state.waist.length) {
    return h('div', { class: 'card stack' },
      h('div', { class: 'label' }, 'Pas'),
      h('p', { class: 'muted small' }, 'Měř pas 1× týdně na obrazovce Dnes — bez něj nejde poznat svaly od tuku.'),
    );
  }
  const latest = state.waist.at(-1);
  const whtr = latest.cm / state.profile.heightCm;
  return h('div', { class: 'card stack' },
    h('div', { class: 'row between' },
      h('div', { class: 'label' }, 'Pas'),
      h('span', { class: `badge ${whtr >= 0.5 ? 'warn' : 'ok'}` },
        whtr >= 0.5 ? 'WHtR ≥ 0,5 — čas na řez' : `WHtR ${whtr.toFixed(2).replace('.', ',')}`),
    ),
    lineChart({
      series: [{ kind: 'line', points: state.waist.map((w) => ({ date: w.date, value: w.cm })) }],
      height: 130,
      yUnit: ' cm',
      yFmt: (v) => v.toFixed(1).replace('.', ','),
    }),
    summary.quality.waistRateCmMo != null
      ? h('p', { class: 'muted small' }, `Trend: ${summary.quality.waistRateCmMo >= 0 ? '+' : '−'}${Math.abs(summary.quality.waistRateCmMo).toFixed(1).replace('.', ',')} cm/měsíc. Kvalitní bulk = do ±0,5.`)
      : null,
  );
}

// ---------- milníky ----------

function milestonesCard(state, summary) {
  const avg7 = summary.avg7;
  const wm = summary.weightMilestone;

  return h('div', { class: 'card stack' },
    h('div', { class: 'label' }, 'Milníky'),
    wm && avg7 != null ? h('div', { class: 'stack', style: 'gap:5px' },
      h('div', { class: 'row between' },
        h('span', { class: 'small' }, `Váha → ${wm.targetKg} kg`),
        h('span', { class: 'num small muted' }, `${fmtKg(avg7, true)} / ${wm.targetKg}`),
      ),
      h('div', { class: 'progressline' },
        h('div', { style: `width:${Math.min(100, Math.max(3, Math.round((1 - (wm.targetKg - avg7)) * 100)))}%` })),
    ) : null,
    h('hr', { class: 'rule' }),
    ...PHASE_MILESTONES.map((m) => {
      const hit = avg7 != null && (
        (m.id === 'feb27' && avg7 >= 90.5) || (m.id === 'end27' && avg7 >= 93.5) || (m.id === 'goal' && avg7 >= state.profile.goalWeightKg)
      );
      return h('div', { class: `milestone${hit ? ' hit' : ''}` },
        h('span', { class: 'm-flag' }, hit ? '✓' : '·'),
        h('div', { class: 'grow' },
          h('div', { style: 'font-weight:600;font-size:14.5px' }, m.label),
          h('div', { class: 'muted', style: 'font-size:12.5px' }, m.detail),
        ),
      );
    }),
    state.prLog.length ? h('hr', { class: 'rule' }) : null,
    ...state.prLog.slice(-3).reverse().map((pr) => h('div', { class: 'row between' },
      h('span', { class: 'small' }, `PR — ${EXERCISES[pr.exerciseId].name}`),
      h('span', { class: 'num small muted' }, `${fmtDate(pr.date)} · ${fmtKg(Math.round(pr.e1rm))}`),
    )),
  );
}


// ===== src/app/view_settings.js =====
// Nastavení: profil, priorita, výživa, deload, data (export/import/uložení), návod.







function renderSettings(root) {
  const state = Store.state;
  clearEl(root);

  root.append(h('div', { class: 'screen' },
    h('div', { class: 'topbar' }, h('h1', { class: 'display' }, 'Nastavení')),
    h('p', { class: 'screen-sub' }, 'Cíl, výživa, deload a záloha dat.'),
    profileCard(state),
    nutritionCard(state),
    deloadCard(state),
    dataCard(state),
    aboutCard(),
  ));
}

// ---------- profil ----------

const PRIORITY_LABELS = { mass: 'Hmota', balanced: 'Vyvážené', lean: 'Řez' };

function profileCard(state) {
  const p = state.profile;
  let goalInput;
  return h('div', { class: 'card stack' },
    h('div', { class: 'label' }, 'Profil a cíl'),
    h('div', { class: 'row between' },
      h('span', { class: 'small muted' }, 'Výchozí stav'),
      h('span', { class: 'num small' }, `${fmtKg(p.weightKg, true)} kg · ${p.heightCm} cm · ${p.age} let`),
    ),
    h('div', { class: 'row' },
      h('span', { class: 'small muted grow' }, 'Cílová váha'),
      goalInput = h('input', { class: 'num set-input', type: 'number', inputmode: 'decimal', value: p.goalWeightKg, style: 'width:76px' }),
      h('button', {
        class: 'btn small',
        onClick: () => {
          const v = parseFloat(goalInput.value.replace(',', '.'));
          if (!v || v < 50 || v > 180) { toast('Tohle jako cíl nedává smysl.'); return; }
          Store.mutate((s) => { s.profile.goalWeightKg = v; }, { publish: true });
        },
      }, 'Uložit'),
    ),
    h('div', { class: 'stack', style: 'gap:6px' },
      h('span', { class: 'small muted' }, 'Priorita (řídí tempo výživy)'),
      h('div', { class: 'row' },
        ...Object.entries(PRIORITY_LABELS).map(([id, label]) => h('button', {
          class: `chip${p.priority === id ? ' active' : ''}`,
          onClick: () => Store.mutate((s) => {
            s.profile.priority = id;
            if (s.targets && s.targets.phase === 'bulk') s.targets.rateBandPctWk = RATE_BANDS_PCT_WK[id];
          }, { publish: true }),
        }, label)),
      ),
    ),
  );
}

// ---------- výživa ----------

const ADJUST_REASONS = {
  too_slow: 'váha rostla pomalu → přidáno',
  too_fast: 'váha rostla rychle → ubráno',
  on_track: 'tempo v pásmu',
  minicut_start: 'start mini-cutu',
  bulk_resume: 'návrat do bulku',
};

function nutritionCard(state) {
  const t = state.targets;
  if (!t) return null;
  const log = state.nutritionLog.slice(-4).reverse();
  return h('div', { class: 'card stack' },
    h('div', { class: 'row between' },
      h('div', { class: 'label' }, 'Výživa'),
      h('span', { class: `badge ${t.phase === 'minicut' ? 'warn' : 'accent'}` }, t.phase === 'minicut' ? 'mini-cut' : 'lean bulk'),
    ),
    h('div', { class: 'row between' },
      h('span', { class: 'small muted' }, 'Denní cíl'),
      h('span', { class: 'num small', style: 'font-weight:600' }, `${t.kcal} kcal · ${t.proteinG} g bílkovin`),
    ),
    h('p', { class: 'muted', style: 'font-size:12.5px' },
      'Kalorie koriguje engine sám podle 14denního trendu váhy (±100–150 kcal/týden). K tomu kreatin 3–5 g denně.'),
    log.length ? h('div', { class: 'stack', style: 'gap:4px' },
      ...log.map((l) => h('div', { class: 'row between' },
        h('span', { class: 'muted', style: 'font-size:12.5px' }, `${fmtDate(l.date)} · ${ADJUST_REASONS[l.reason] ?? l.reason}`),
        h('span', { class: 'num muted', style: 'font-size:12.5px' }, l.deltaKcal ? `${fmtSigned(l.deltaKcal)} kcal` : `${l.kcal} kcal`),
      )),
    ) : null,
  );
}

// ---------- deload ----------

function deloadCard(state) {
  const weeks = Math.floor(daysBetween(state.deload.lastEndDate ?? state.profile.startDate, todayISO()) / 7);
  return h('div', { class: 'card stack' },
    h('div', { class: 'label' }, 'Deload'),
    h('div', { class: 'row between' },
      h('span', { class: 'small muted' }, state.deload.active ? 'Právě běží' : 'Bez deloadu'),
      h('span', { class: 'num small' }, state.deload.active ? `zbývá ${state.deload.sessionsLeft}` : `${weeks} týdnů`),
    ),
    h('p', { class: 'muted', style: 'font-size:12.5px' },
      'Nabízí se sám podle výkonu a check-inů. Cítíš se rozbitý? Spusť ho ručně.'),
    state.deload.active ? null : h('button', {
      class: 'btn',
      onClick: () => {
        const { close } = openModal(
          h('h3', {}, 'Spustit deload týden?'),
          h('p', { class: 'muted small' }, '5 tréninků na −50 % sérií a −25 % zátěže, žádné série do selhání.'),
          h('div', { class: 'row' },
            h('button', { class: 'btn primary grow', onClick: () => { Store.mutate((s) => acceptDeload(s), { publish: true }); close(); } }, 'Spustit'),
            h('button', { class: 'btn grow', onClick: () => close() }, 'Zpět'),
          ),
        );
      },
    }, 'Spustit deload ručně'),
  );
}

// ---------- data ----------

function dataCard(state) {
  return h('div', { class: 'card stack' },
    h('div', { class: 'label' }, 'Data'),
    h('div', { class: 'row between' },
      h('span', { class: 'small muted' }, 'Uloženo v zařízení'),
      h('span', { class: `badge ${storageInfo.localOk ? 'ok' : 'bad'}` }, storageInfo.localOk ? 'ano' : 'ne'),
    ),
    storageInfo.artifactOk
      ? h('div', { class: 'row between' },
          h('span', { class: 'small muted' }, 'Uloženo v appce (cloud)'),
          h('span', { class: 'badge ok' }, 'ano'),
        )
      : h('p', { class: 'muted', style: 'font-size:12.5px' },
          'Data žijí jen v tomhle zařízení — jednou za čas si stáhni zálohu.'),
    state.pendingPublish && storageInfo.artifactOk
      ? h('button', { class: 'btn', onClick: () => Store.mutate(() => {}, { publish: true }) }, 'Uložit změny do appky teď')
      : null,
    h('div', { class: 'row' },
      h('button', {
        class: 'btn grow',
        onClick: async () => {
          const r = await exportJSON(state);
          if (r.ok && r.via === 'downloads') toast('Záloha se stahuje.');
          else if (r.ok) toast('Záloha zkopírována do schránky.');
          else showExportFallback(r.data);
        },
      }, 'Exportovat zálohu'),
      h('button', { class: 'btn grow', onClick: importModal }, 'Obnovit ze zálohy'),
    ),
    h('button', {
      class: 'btn danger',
      onClick: () => {
        const { close } = openModal(
          h('h3', {}, 'Smazat úplně všechno?'),
          h('p', { class: 'muted small' }, 'Historie tréninků, váhy i nastavení. Nejde vzít zpět (leda ze zálohy).'),
          h('div', { class: 'row' },
            h('button', { class: 'btn danger grow', onClick: () => { Store.init(defaultState()); Store.mutate(() => {}, { publish: true }); close(); } }, 'Smazat vše'),
            h('button', { class: 'btn grow', onClick: () => close() }, 'Zpět'),
          ),
        );
      },
    }, 'Smazat všechna data'),
  );
}

function showExportFallback(data) {
  openModal(
    h('h3', {}, 'Záloha'),
    h('p', { class: 'muted small' }, 'Zkopíruj si obsah a ulož kamkoli:'),
    h('textarea', { style: 'width:100%;height:180px;background:var(--surface-2);color:inherit;border:1px solid var(--line);border-radius:9px;padding:8px;font-size:12px', readonly: true }, data),
  );
}

function importModal() {
  let area;
  const { close } = openModal(
    h('h3', {}, 'Obnovit ze zálohy'),
    h('p', { class: 'muted small' }, 'Vlož obsah JSON zálohy. Přepíše aktuální data.'),
    area = h('textarea', { style: 'width:100%;height:180px;background:var(--surface-2);color:inherit;border:1px solid var(--line);border-radius:9px;padding:8px;font-size:12px', placeholder: '{ … }' }),
    h('div', { class: 'row' },
      h('button', {
        class: 'btn primary grow',
        onClick: () => {
          try {
            const parsed = parseImportedJSON(area.value);
            Store.init(parsed);
            Store.mutate(() => {}, { publish: true });
            close();
            toast('Data obnovena.');
          } catch (err) {
            toast(err.message ?? 'Neplatný soubor.');
          }
        },
      }, 'Obnovit'),
      h('button', { class: 'btn grow', onClick: () => close() }, 'Zpět'),
    ),
  );
}

// ---------- o appce ----------

function aboutCard() {
  return h('div', { class: 'card stack' },
    h('div', { class: 'label' }, 'O appce'),
    h('p', { class: 'muted', style: 'font-size:12.5px' },
      'Fitko — osobní tréninkový deník na míru. Engine: dvojitá progrese s RIR, reaktivní deloady, '
      + 'výživa řízená trendem váhy, poctivé projekce. Každé pravidlo má zdroj v meta-analýzách '
      + '(docs/PROGRAM.md a docs/research/ v repu projektu).'),
    h('button', {
      class: 'btn',
      onClick: () => openModal(
        h('h3', {}, 'Přidat na plochu telefonu'),
        h('p', { class: 'small' }, 'iPhone: otevři tuhle stránku v Safari → tlačítko Sdílet → „Přidat na plochu“. Appka pak běží celoobrazovkově jako nativní.'),
        h('p', { class: 'small' }, 'Android (Chrome): menu ⋮ → „Přidat na plochu“ / „Nainstalovat aplikaci“.'),
        h('p', { class: 'muted small' }, 'Data se ukládají do zařízení a zároveň do appky samotné — přežijí i výměnu telefonu.'),
      ),
    }, 'Návod: na plochu telefonu'),

// ===== src/app/main.js =====
// Bootstrap a router. Pořadí při startu je důležité: snímek dokumentu se bere
// PŘED prvním renderem (je šablonou pro samo-publikaci artifactu).










let currentTab = 'today';

const TABS = [
  { id: 'today', label: 'Dnes', icon: 'today', render: renderToday },
  { id: 'progress', label: 'Progres', icon: 'progress', render: renderProgress },
  { id: 'settings', label: 'Nastavení', icon: 'settings', render: renderSettings },
];

function render() {
  const root = document.getElementById('app');
  const scrollY = window.scrollY;
  const state = Store.state;

  document.querySelector('.tabbar')?.remove();

  if (!state.onboarded) {
    renderOnboarding(root);
    return;
  }

  if (state.activeWorkout) {
    renderWorkout(root);
    requestAnimationFrame(() => window.scrollTo(0, scrollY));
    return;
  }

  RestTimer.stop();
  const tab = TABS.find((t) => t.id === currentTab) ?? TABS[0];
  tab.render(root);

  document.body.append(h('nav', { class: 'tabbar' },
    h('div', { class: 'tabbar-inner' },
      ...TABS.map((t) => h('button', {
        class: `tab${t.id === currentTab ? ' active' : ''}`,
        'aria-label': t.label,
        onClick: () => { if (currentTab !== t.id) { currentTab = t.id; window.scrollTo(0, 0); render(); } },
      }, icon(t.icon), t.label)),
    ),
  ));
  requestAnimationFrame(() => window.scrollTo(0, scrollY));
}

function boot() {
  captureDocument();
  initCapabilities();

  // trvalé úložiště (instalovaná home-screen appka je přesně heuristika, na kterou to prohlížeče schválí)
  try { navigator.storage?.persist?.(); } catch { /* nepovinné */ }

  // offline režim — jen ve standalone buildu (marker: link rel=manifest)
  if ('serviceWorker' in navigator && document.querySelector('link[rel="manifest"]')) {
    try { navigator.serviceWorker.register('./sw.js'); } catch { /* nepovinné */ }
  }
  Store.init(loadPersistedState());
  Store.onChange = render;

  Store.mutate((s) => dailyMaintenance(s), { rerender: false, publish: false, markDirty: false });

  render();
}

if (document.readyState === 'loading') {
  document.addEventListener('DOMContentLoaded', boot);
} else {
  boot();
}

})();
</script>
