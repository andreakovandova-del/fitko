// ---------- kontext ----------

function ctx(state) {
  const food = state.food;
  const today = todayISO();
  const weekStart = weekStartOf(today);
  const plan = food.plan && food.plan.weekStart === weekStart ? food.plan : null;
  const feed = food.discounts;
  const discounted = matchDiscounts({ items: validDiscountItems(feed, today) }, food.customFoods);
  const cookWeek = activeCookWeekStart(today);
  return {
    food, today, weekStart, plan, feed, discounted, meals: food.meals, customFoods: food.customFoods, targets: state.targets,
    cookWeek, cookPlan: Household.state.cook[cookWeek] ?? null, members: Household.members(state), customRecipes: Household.state.customRecipes ?? [],
  };
}

// V neděli už se plánuje příští týden (vaří se večer na pondělí), jinak tento.
function activeCookWeekStart(today) {
  const dow = new Date(`${today}T12:00:00`).getDay();
  const thisWeek = weekStartOf(today);
  const offset = cookWeekOffset ?? (dow === 0 ? 1 : 0);
  return addDays(thisWeek, offset * 7);
}

const fmtKcal = (n) => String(Math.round(n)).replace(/\B(?=(\d{3})+(?!\d))/g, ' ');
const fmtPortion = (p) => (p === 1 ? '1×' : `${String(Math.round(p * 100) / 100).replace('.', ',')}×`);
const slotDef = (id) => FOOD_SLOTS.find((s) => s.id === id);
const slotTime = (slot) => `${slot.hour}:${String(slot.minute).padStart(2, '0')}`;
const mealById = (c, id) => c.meals.find((m) => m.id === id) ?? null;
const SLOT_KINDS = [
  { id: 'snidane', label: 'Snídaně' }, { id: 'svacina', label: 'Svačina' },
  { id: 'obed', label: 'Oběd' }, { id: 'vecere', label: 'Večeře' }, { id: null, label: 'Kdykoli' },
];
const slotKindLabel = (slot) => SLOT_KINDS.find((k) => k.id === slot)?.label ?? 'Kdykoli';
const allRecipes = () => [...RECIPES, ...(Household.state.customRecipes ?? [])];
const findRecipe = (id) => recipeById(id, Household.state.customRecipes ?? []);

function macroText(m) {
  const r = roundMacros(m);
  return `${fmtKcal(r.kcal)} kcal · ${r.p} g B`;
}

function dayBadge(totals, targets) {
  if (!totals || !targets) return null;
  const kcalOk = Math.abs(totals.kcal - targets.kcal) <= targets.kcal * 0.07;
  const pOk = totals.p >= targets.proteinG * 0.95;
  const cls = kcalOk && pOk ? 'ok' : 'warn';
  const txt = !pOk ? `${totals.p} g B — málo` : !kcalOk ? (totals.kcal > targets.kcal ? 'přes cíl' : 'pod cílem') : 'sedí';
  return h('span', { class: `badge ${cls}` }, txt);
}

// Recepty žijí i jako „jídla“ appky (id r_…): snědeno, makra a notifikace jedou beze změny.
// A plán vaření domácnosti se promítá do denního rozpisu tohohle člověka.
function syncRecipesAndPlan(state) {
  let changed = false;
  const meals = state.food.meals;
  for (const r of allRecipes()) {
    const meal = recipeToMeal(r);
    const i = meals.findIndex((m) => m.id === meal.id);
    if (i < 0) { meals.push(meal); changed = true; }
    else if (JSON.stringify(meals[i].items) !== JSON.stringify(meal.items) || meals[i].name !== meal.name) { meals[i] = meal; changed = true; }
  }
  const me = currentUser();
  const today = todayISO();
  const weekStart = weekStartOf(today);
  const hhPlan = Household.state.cook[weekStart];
  if (hhPlan && hhPlan.members?.includes(me)) {
    const current = state.food.plan;
    if (!current || current.weekStart !== weekStart || current.sourceUpdatedAt !== hhPlan.updatedAt) {
      const days = userDayPlans(hhPlan, me, Household.state.customRecipes ?? []);
      if (days) {
        const totals = {};
        for (const iso of Object.keys(days)) totals[iso] = dayPlanMacros(days[iso], meals, state.food.customFoods);
        state.food.plan = { weekStart, days, totals, source: 'household', sourceUpdatedAt: hhPlan.updatedAt };
        changed = true;
      }
    }
  }
  if (changed) Store.mutate(() => {}, { rerender: false, markDirty: false });
}

// ---------- DNES ----------

function viewToday(state, c) {
  const dayPlan = c.plan?.days?.[c.today] ?? null;
  const eatenDay = c.food.eaten[c.today] ?? {};
  const eaten = eatenMacros(dayPlan, eatenDay, c.meals, c.customFoods);
  const t = c.targets;
  const out = [];

  if (t) {
    const kcalPct = Math.min(100, Math.round((eaten.kcal / t.kcal) * 100));
    const pPct = Math.min(100, Math.round((eaten.p / t.proteinG) * 100));
    const leftKcal = t.kcal - eaten.kcal;
    const leftP = t.proteinG - eaten.p;
    out.push(h('div', { class: 'card stack food-summary' },
      h('div', { class: 'row between' },
        h('div', { class: 'label' }, 'Dnes snědeno'),
        h('span', { class: `badge ${leftP <= 0 ? 'ok' : 'plain'}` }, leftP <= 0 ? 'bílkoviny splněny' : `zbývá ${leftP} g B`),
      ),
      h('div', { class: 'row', style: 'gap:22px;align-items:flex-end' },
        h('div', { class: 'grow' },
          h('div', { class: 'row', style: 'gap:5px;align-items:baseline' },
            h('span', { class: 'num', style: 'font-size:30px;font-weight:600' }, fmtKcal(eaten.kcal)),
            h('span', { class: 'muted', style: 'font-size:12px' }, `/ ${fmtKcal(t.kcal)} kcal`),
          ),
          h('div', { class: 'progressline', style: 'margin-top:6px' }, h('div', { style: `width:${kcalPct}%` })),
        ),
        h('div', { style: 'min-width:96px' },
          h('div', { class: 'row', style: 'gap:5px;align-items:baseline' },
            h('span', { class: 'num', style: 'font-size:22px;font-weight:600' }, String(eaten.p)),
            h('span', { class: 'muted', style: 'font-size:12px' }, `/ ${t.proteinG} g`),
          ),
          h('div', { class: 'progressline ok', style: 'margin-top:6px' }, h('div', { style: `width:${pPct}%` })),
        ),
      ),
      h('div', { class: 'muted', style: 'font-size:12.5px' },
        leftKcal > 0 ? `Zbývá ${fmtKcal(leftKcal)} kcal. Ťukni na ✓ u toho, co jsi snědl — nic nefotíš, makra jsou spočítaná předem.`
          : `Cíl dne splněn (${fmtKcal(-leftKcal)} kcal nad). Zbytek dne už jen bílkoviny, když chybí.`),
    ));
  }

  if (!dayPlan) {
    out.push(planCta(c, 'Na dnešek nemáš jídelníček.'));
  } else {
    out.push(h('div', { class: 'card stack', style: 'gap:0' },
      ...FOOD_SLOTS.map((slot) => slotRow(c, slot, dayPlan[slot.id], !!eatenDay[slot.id])),
    ));
  }

  // něco navíc — mimo plán, jen kcal a bílkoviny
  const extra = eatenDay.extra ?? [];
  out.push(h('div', { class: 'card stack' },
    h('div', { class: 'row between' },
      h('div', { class: 'label' }, 'Něco navíc'),
      h('button', { class: 'btn small', onClick: () => openExtraModal(c.today) }, '+ Přidat'),
    ),
    extra.length
      ? h('div', { class: 'stack', style: 'gap:0' }, ...extra.map((x, i) => h('div', { class: 'history-row' },
          h('span', { class: 'grow' }, x.name),
          h('span', { class: 'num muted small' }, `${fmtKcal(x.kcal)} kcal · ${x.p} g B`),
          h('button', { class: 'icon-btn', 'aria-label': 'Odebrat', onClick: () => Store.mutate((s) => { s.food.eaten[c.today].extra.splice(i, 1); }) }, '×'),
        )))
      : h('p', { class: 'muted', style: 'font-size:12.5px;margin:0' }, 'Když sníš něco mimo plán (rohlík, pivo, dort), zapiš jen kcal a bílkoviny — víc není potřeba.'),
  ));

  return out;
}

function slotRow(c, slot, entry, eaten) {
  const meal = entry ? mealById(c, entry.mealId) : null;
  const macros = meal ? mealMacros(meal, c.customFoods) : null;
  const portion = entry?.portion ?? 1;
  return h('div', { class: `food-slot${eaten ? ' done' : ''}${!meal ? ' empty' : ''}` },
    h('button', {
      class: `check-btn${eaten ? ' done' : ''}`,
      'aria-label': eaten ? 'Odznačit' : 'Snědeno',
      disabled: !meal,
      onClick: () => Store.mutate((s) => {
        const day = (s.food.eaten[c.today] ??= {});
        day[slot.id] = !day[slot.id];
      }),
    }, '✓'),
    h('button', { class: 'food-slot-body', onClick: () => openSlotModal(c, c.today, slot.id) },
      h('div', { class: 'row between' },
        h('span', { class: 'label' }, `${slot.label} · ${slotTime(slot)}`),
        meal ? h('span', { class: 'num muted', style: 'font-size:12px' }, `${fmtKcal(macros.kcal * portion)} kcal · ${Math.round(macros.p * portion)} g B`) : null,
      ),
      h('div', { class: 'food-slot-name' }, meal ? meal.name : 'nic naplánováno — ťukni a vyber'),
      meal && portion !== 1 ? h('div', { class: 'muted', style: 'font-size:12px' }, `${fmtPortion(portion)} porce`) : null,
    ),
  );
}

function planCta(c, lead) {
  return h('div', { class: 'card stack' },
    h('div', { class: 'label' }, 'Jídelníček na týden'),
    h('p', { class: 'small', style: 'margin:0' }, `${lead} Denní rozpis vzniká z plánu vaření domácnosti — dvě vaření týdně, krabičky pro oba podle kalorií, snídaně a svačiny každému zvlášť.`),
    h('button', { class: 'btn primary big', onClick: () => { sub = 'vareni'; scrollTop(0); Store.onChange?.(); } }, 'Naplánovat vaření'),
  );
}

function recomputeDay(s, iso) {
  const plan = s.food.plan;
  if (!plan?.days?.[iso]) return;
  plan.totals[iso] = dayPlanMacros(plan.days[iso], s.food.meals, s.food.customFoods);
}

// výběr jídla do slotu + porce
function openSlotModal(c, iso, slotId) {
  const slot = slotDef(slotId);
  const kind = slotId.replace(/\d$/, '');
  const entry = c.plan?.days?.[iso]?.[slotId] ?? null;
  let portion = entry?.portion ?? 1;
  let mealId = entry?.mealId ?? null;
  const target = c.targets ? Math.round(c.targets.kcal * slot.share) : null;

  const ordered = [...c.meals].sort((a, b) => (a.slot === kind ? 0 : a.slot ? 2 : 1) - (b.slot === kind ? 0 : b.slot ? 2 : 1) || a.name.localeCompare(b.name, 'cs'));
  const list = h('div', { class: 'stack', style: 'gap:0;max-height:44vh;overflow:auto' });
  const portionRow = h('div', { class: 'row', style: 'gap:6px;flex-wrap:wrap' });
  const macroLine = h('div', { class: 'muted small num' });

  const refresh = () => {
    clearEl(list);
    for (const m of ordered) {
      const mm = mealMacros(m, c.customFoods);
      list.append(h('button', {
        class: `history-row${m.id === mealId ? ' selected' : ''}`,
        onClick: () => { mealId = m.id; refresh(); },
      },
        h('span', { class: `radio${m.id === mealId ? ' on' : ''}` }),
        h('span', { class: 'grow', style: 'text-align:left' }, m.name),
        h('span', { class: 'num muted small' }, `${fmtKcal(mm.kcal * portion)} kcal`),
      ));
    }
    clearEl(portionRow);
    for (const p of [0.75, 1, 1.25, 1.5]) {
      portionRow.append(h('button', { class: `chip${Math.abs(portion - p) < 0.01 ? ' active' : ''}`, onClick: () => { portion = p; refresh(); } }, fmtPortion(p)));
    }
    const m = mealId ? mealById(c, mealId) : null;
    macroLine.textContent = m ? `${macroText({ ...mealMacros(m, c.customFoods), kcal: mealMacros(m, c.customFoods).kcal * portion, p: mealMacros(m, c.customFoods).p * portion })}${target ? ` · cíl slotu ~${fmtKcal(target)} kcal` : ''}` : '';
  };
  refresh();

  const { close } = openModal(
    h('h3', {}, `${slot.label} · ${fmtDate(iso)}`),
    list,
    h('div', { class: 'label', style: 'margin-top:4px' }, 'Porce'),
    portionRow,
    macroLine,
    h('div', { class: 'row', style: 'margin-top:6px' },
      h('button', { class: 'btn ghost', onClick: () => { setSlot(iso, slotId, null, 1); close(); } }, 'Vynechat'),
      h('button', { class: 'btn primary grow', onClick: () => { if (!mealId) { toast('Vyber jídlo.'); return; } setSlot(iso, slotId, mealId, portion); close(); } }, 'Uložit'),
    ),
  );
}

function setSlot(iso, slotId, mealId, portion) {
  Store.mutate((s) => {
    const ws = weekStartOf(iso);
    if (!s.food.plan || s.food.plan.weekStart !== ws) s.food.plan = { weekStart: ws, days: {}, totals: {} };
    const day = (s.food.plan.days[iso] ??= {});
    if (mealId) day[slotId] = { mealId, portion }; else delete day[slotId];
    recomputeDay(s, iso);
  });
}

function openExtraModal(iso) {
  let nameIn; let kcalIn; let pIn;
  const { close } = openModal(
    h('h3', {}, 'Něco navíc'),
    h('p', { class: 'small muted' }, 'Stačí odhad. Rohlík se šunkou ≈ 250 kcal / 10 g B, pivo 0,5 l ≈ 200 kcal / 2 g B.'),
    nameIn = h('input', { type: 'text', placeholder: 'co to bylo' }),
    h('div', { class: 'row' },
      kcalIn = numericField(h('input', { class: 'num', type: 'text', inputmode: 'numeric', placeholder: 'kcal' }), { decimals: false }),
      pIn = numericField(h('input', { class: 'num', type: 'text', inputmode: 'numeric', placeholder: 'g bílkovin' }), { decimals: false }),
    ),
    h('button', {
      class: 'btn primary big',
      onClick: () => {
        const kcal = parseNum(kcalIn.value); const p = parseNum(pIn.value) ?? 0;
        if (kcal == null || kcal < 0) { toast('Doplň kcal.'); return; }
        Store.mutate((s) => {
          const day = (s.food.eaten[iso] ??= {});
          (day.extra ??= []).push({ name: nameIn.value.trim() || 'navíc', kcal: Math.round(kcal), p: Math.round(p) });
        });
        close();
      },
    }, 'Zapsat'),
  );
  setTimeout(() => nameIn.focus(), 50);
}

const dayShort = (iso) => CZ_DAYS[new Date(`${iso}T12:00:00`).getDay()];

const recipeColorClass = (r) => RECIPE_COLOR[r.color] ?? 'cat-ostatni';
const PROTEIN_LABEL = { kure: 'kuřecí', kruti: 'krůtí', hovezi: 'hovězí', veprove: 'vepřové', ryba: 'ryba', vejce: 'vejce', mlecne: 'mléčné', lusteniny: 'luštěniny' };

function recipePhoto(r) {

function viewCooking(state, c) {
  const out = [];
  const memberIds = Object.keys(c.members);
  const dow = new Date(`${c.today}T12:00:00`).getDay();
  const isNext = c.cookWeek > c.weekStart;

  out.push(h('div', { class: 'card stack' },
    h('div', { class: 'row between' },
      h('div', { class: 'label' }, `${isNext ? 'Příští týden' : 'Tento týden'} · od ${fmtDate(c.cookWeek)}`),
      h('div', { class: 'row', style: 'gap:4px' },
        h('button', { class: `chip plain${!isNext ? ' active' : ''}`, style: 'padding:3px 9px;font-size:12px', onClick: () => { cookWeekOffset = 0; Store.onChange?.(); } }, 'tento'),
        h('button', { class: `chip plain${isNext ? ' active' : ''}`, style: 'padding:3px 9px;font-size:12px', onClick: () => { cookWeekOffset = 1; Store.onChange?.(); } }, 'příští'),
      ),
    ),
    h('div', { class: 'row', style: 'flex-wrap:wrap;gap:6px' },
      ...memberIds.map((id) => h('span', { class: `person-chip person-${id}` }, `${c.members[id].name} · ${fmtKcal(c.members[id].kcal)} kcal · ${c.members[id].proteinG} g B`)),
    ),
    memberIds.length < 2 ? h('p', { class: 'muted', style: 'font-size:12.5px;margin:0' },
      `${USERS[otherUser()]?.name ?? 'Druhý'} zatím není v domácnosti (potřebuje projít nastavení ve své appce se stejným tokenem). Plánuje se jen pro tebe.`) : null,
    dow === 0 && !isNext ? h('p', { class: 'muted', style: 'font-size:12.5px;margin:0' }, 'Je neděle — přepni na příští týden, ať víš, co dnes uvařit.') : null,
  ));

  if (!c.cookPlan) {
    const proposal = Household.state.proposals?.[c.cookWeek];
    out.push(h('div', { class: 'card stack' },
      h('div', { class: 'label' }, 'Plán vaření'),
      h('p', { class: 'small', style: 'margin:0' },
        'Dvě vaření týdně: v neděli na pondělí až středu, ve středu na čtvrtek až neděli. Každé vaření dvě jídla, krabičky pro oba podle jejich kalorií, snídaně a svačiny každému zvlášť. Z toho vznikne nákup i recepty.'),
      proposal ? h('div', { class: 'card stack', style: 'border-color:var(--accent);gap:6px' },
        h('div', { class: 'label accent-text' }, 'Návrh od AI'),
        h('p', { class: 'small', style: 'margin:0' }, proposal.note ?? 'AI navrhla jídla na tenhle týden podle akcí, pestrosti a vašich cílů.'),
        h('div', { class: 'muted', style: 'font-size:12.5px' }, [...(proposal.pick?.A ?? []), ...(proposal.pick?.B ?? [])].map((id) => findRecipe(id)?.name ?? id).join(' · ')),
        h('button', { class: 'btn primary', onClick: () => makePlan(c, { pick: proposal.pick, fromProposal: true }) }, 'Použít návrh'),
      ) : null,
      h('button', { class: `btn ${proposal ? '' : 'primary'} big`, onClick: () => makePlan(c) }, 'Naplánovat týden'),
    ));
    return out;
  }

  const plan = c.cookPlan;
  const proposal = Household.state.proposals?.[c.cookWeek];
  if (proposal && !plan.fromProposal) {
    out.push(h('div', { class: 'card stack', style: 'border-color:var(--accent);gap:6px' },
      h('div', { class: 'label accent-text' }, 'Návrh od AI na tenhle týden'),
      h('p', { class: 'small', style: 'margin:0' }, proposal.note ?? 'AI navrhla jiný výběr jídel.'),
      h('div', { class: 'muted', style: 'font-size:12.5px' }, [...(proposal.pick?.A ?? []), ...(proposal.pick?.B ?? [])].map((id) => findRecipe(id)?.name ?? id).join(' · ')),
      h('button', { class: 'btn small', onClick: () => makePlan(c, { pick: proposal.pick, fromProposal: true }) }, 'Přeplánovat podle návrhu'),
    ));
  }
  for (const s of plan.sessions) out.push(sessionCard(c, plan, s));
  out.push(dayStripCard(c, plan));

  out.push(h('div', { class: 'row', style: 'gap:8px' },
    h('button', { class: 'btn grow', onClick: () => { replanCounter++; makePlan(c, { seed: `${c.cookWeek}#${replanCounter}` }); } }, 'Přeplánovat jinak'),

      class: 'btn ghost',
      onClick: () => {

          h('h3', {}, 'Smazat plán vaření?'),
          h('p', { class: 'small' }, 'Zmizí rozvrh krabiček i nákup pro tenhle týden. Co je zapsané jako snědené, zůstane.'),
          h('div', { class: 'row' },
            h('button', { class: 'btn ghost grow', onClick: () => close() }, 'Zpět'),
            h('button', { class: 'btn danger grow', onClick: () => { Household.mutate((hh) => { delete hh.cook[c.cookWeek]; }); close(); } }, 'Smazat'),
          ),
        );
      },
    }, 'Smazat'),
  ));
  return out;
}

function previousWeekRecipes(weekStart) {
  const prev = Household.state.cook[addDays(weekStart, -7)];
  return prev ? prev.sessions.flatMap((s) => s.dishes.map((d) => d.recipeId)) : [];
}

function makePlan(c, { pick = null, seed = null, fromProposal = false } = {}) {
  const members = c.members;
  if (!Object.keys(members).length) { toast('Nejdřív dokonči nastavení — bez cílů výživy nejde plánovat.'); return; }
  const plan = planCookWeek({
    weekStart: c.cookWeek, members, customRecipes: c.customRecipes, customFoods: c.customFoods, discounted: c.discounted,
    cookDays: Household.state.prefs?.cookDays ?? [0, 3], previous: previousWeekRecipes(c.cookWeek), seed: seed ?? c.cookWeek, pick,
    exclude: Household.state.prefs?.excludedRecipes ?? [],
  });
  if (!plan) { toast('Plán nejde sestavit.'); return; }
  if (pick) plan.fromProposal = fromProposal || !!pick;
  Household.mutate((hh) => { hh.cook[c.cookWeek] = plan; });
  const inAkce = Object.keys(c.discounted).length;
  toast(inAkce ? `Týden naplánován — ${inAkce} potravin z akce.` : 'Týden naplánován.');
}

function sessionCard(c, plan, s) {
  const covers = `${dayShort(s.coversDays[0])}–${dayShort(s.coversDays.at(-1))}`;
  const past = s.cookDate < c.today;
  return h('div', { class: `card stack cook-session${s.cooked ? ' cooked' : ''}` },
    h('div', { class: 'row between' },
      h('div', {},
        h('div', { class: 'label' }, `${dayName(s.cookDate)} ${fmtDate(s.cookDate)}`),
        h('div', { style: 'font-weight:700;font-size:16px' }, `Uvař na ${covers} (${s.coversDays.length} ${s.coversDays.length === 1 ? 'den' : s.coversDays.length < 5 ? 'dny' : 'dní'})`),
      ),
      h('button', {
        class: `btn small ${s.cooked ? 'ghost' : ''}`,
        onClick: () => Household.mutate((hh) => { const ss = hh.cook[plan.weekStart]?.sessions.find((x) => x.id === s.id); if (ss) ss.cooked = !ss.cooked; hh.cook[plan.weekStart].updatedAt = new Date().toISOString(); }),
      }, s.cooked ? '✓ uvařeno' : 'Uvařeno'),
    ),
    ...s.dishes.map((d) => dishRow(c, plan, s, d)),
    past && !s.cooked ? h('p', { class: 'warn-text', style: 'font-size:12px;margin:0' }, 'Termín vaření už byl — když jsi nevařil, vyměň nebo přeplánuj.') : null,
  );
}

function dishRow(c, plan, s, d) {
  const r = findRecipe(d.recipeId);
  if (!r) return null;
  const sum = dishSummary(d, r, c.members, c.customFoods);
  const needsFreezer = s.coversDays.length > r.fridgeDays;
  const freezeFrom = needsFreezer ? s.coversDays[r.fridgeDays] : null;
  return h('div', { class: `dish-row ${recipeColorClass(r)}` },
    recipeThumb(r),
    h('div', { class: 'grow', style: 'min-width:0' },
      h('div', { class: 'dish-name' }, r.name),
      h('div', { class: 'dish-boxes' },
        h('b', {}, `${sum.total} krabiček`),
        ...sum.per.map((p) => h('span', { class: `person-chip person-${p.userId}` }, `${p.name} ${p.boxes}×`)),
      ),
      h('div', { class: 'muted', style: 'font-size:12px' },
        sum.per.map((p) => `${p.name}: ${fmtPortion(p.factor)} porce ≈ ${fmtKcal(p.kcal)} kcal · ${p.p} g B`).join(' · ')),
      h('div', { class: 'muted', style: 'font-size:12px' },
        `${r.prepMin + r.cookMin} min · ${PROTEIN_LABEL[r.protein] ?? r.protein} · v lednici ${r.fridgeDays} ${r.fridgeDays === 1 ? 'den' : r.fridgeDays < 5 ? 'dny' : 'dní'}${r.freezer ? ' · mrazák ano' : ' · nemrazit'}`),
      needsFreezer ? h('div', { class: 'warn-text', style: 'font-size:12px' },
        r.freezer ? `Krabičky od ${dayShort(freezeFrom)} dej hned do mrazáku (v lednici vydrží jen ${r.fridgeDays} dny).` : `Vydrží jen ${r.fridgeDays} dny a nemrazí se — jez ho první dny, nebo vyměň.`) : null,
      h('div', { class: 'row', style: 'gap:6px;margin-top:6px' },
        h('button', { class: 'btn small primary', onClick: () => openRecipeModal(r, { dish: d, members: c.members }) }, 'Recept'),
        h('button', { class: 'btn small', onClick: () => openSwapDishModal(c, plan, s, d) }, 'Vyměnit'),
      ),
    ),
  );
}

function dayStripCard(c, plan) {
  const days = weekDays(plan.weekStart);
  return h('div', { class: 'card stack', style: 'gap:8px' },
    h('div', { class: 'label' }, 'Co se jí který den'),

      ...days.map((iso) => {
        const a = plan.assignments[iso] ?? {};
        const l = findRecipe(a.obed); const v = findRecipe(a.vecere);
        const isToday = iso === c.today;
        return h('div', { class: `ds-cell${isToday ? ' today' : ''}` },
          h('span', { class: 'wd-day' }, dayShort(iso)),
          h('span', { class: 'ds-emoji', title: l?.name ?? '' }, l?.emoji ?? '—'),

  );
}

function breakfastCard(c, plan) {
  const rows = [];
  for (const uid of plan.members ?? []) {
    const m = c.members[uid];
    if (!m) continue;
    const bf = (plan.breakfasts?.[uid] ?? []).map((b) => ({ ...b, r: findRecipe(b.recipeId) })).filter((b) => b.r);
    const sn = (plan.snacks?.[uid] ?? []).map((b) => ({ ...b, r: findRecipe(b.recipeId) })).filter((b) => b.r);
    rows.push(h('div', { class: 'stack', style: 'gap:6px' },
      h('span', { class: `person-chip person-${uid}`, style: 'align-self:flex-start' }, m.name),
      ...bf.map((b, i) => smallRecipeRow(b.r, `snídaně ${i === 0 ? 'Po–Čt' : 'Pá–Ne'}`, b.factor, c)),
      ...sn.map((b, i) => smallRecipeRow(b.r, `svačina ${i === 0 ? 'dopoledne' : 'odpoledne'}`, b.factor, c)),
    ));
  }
  return h('div', { class: 'card stack', style: 'gap:12px' },
    h('div', { class: 'label' }, 'Snídaně a svačiny'),
    ...rows,
  );
}

function smallRecipeRow(r, when, factor, c) {
  const m = recipeMacros(r, c.customFoods);
  return h('button', { class: `history-row ${recipeColorClass(r)}`, onClick: () => openRecipeModal(r, { portions: factor }) },
    recipeThumb(r, 'small'),
    h('span', { class: 'grow', style: 'text-align:left' },
      h('div', { style: 'font-size:14.5px' }, r.name),
      h('div', { class: 'muted', style: 'font-size:12px' }, `${when} · ${fmtPortion(factor)} porce · ${fmtKcal(m.kcal * factor)} kcal · ${Math.round(m.p * factor)} g B`),
    ),
    h('span', { class: 'muted', style: 'font-size:18px' }, '›'),
  );
}

// Recept: suroviny na zvolený počet porcí (krabičky obou), kroky, skladování.
function openRecipeModal(r, { dish = null, members = {}, portions = null } = {}) {
  const custom = Store.state.food.customFoods;
  const m = recipeMacros(r, custom);
  const total = dish ? dishIngredients(dish, r).portions : (portions ?? 1);
  const per = dish ? dishSummary(dish, r, members, custom).per : [];
  const fmtG = (g) => (g >= 1000 ? `${(g / 1000).toFixed(2).replace(/\.?0+$/, '').replace('.', ',')} kg` : `${Math.round(g)} g`);
  const ingLine = (it) => {
    const f = foodById(it.foodId, custom);
    const g = it.grams * total;
    const pieces = f?.pieceG && (f.loose || /\bks\b/.test(f.packLabel ?? '')) ? ` (≈ ${Math.ceil(g / f.pieceG)} ks)` : '';
    return h('div', { class: 'row between ing-line' },
      h('span', { class: 'small' }, f?.name ?? it.foodId),
      h('span', { class: 'num small', style: 'font-weight:600' }, `${fmtG(g)}${pieces}`),
    );
  };
  openModal(
    h('div', { class: `recipe-head ${recipeColorClass(r)}` },
      recipeThumb(r, 'big'),
      h('div', { class: 'grow' },
        h('h3', {}, r.name),
        h('div', { class: 'muted', style: 'font-size:12.5px' }, `${r.prepMin} min příprava · ${r.cookMin} min vaření · ${(r.equipment ?? []).join(', ') || 'bez nádobí'}`),
        h('div', { class: 'row', style: 'flex-wrap:wrap;gap:4px;margin-top:4px' }, ...(r.tags ?? []).map((t) => h('span', { class: 'badge plain' }, t))),
      ),
    ),
    recipePhoto(r),
    h('div', { class: 'row between' },
      h('span', { class: 'label' }, `Suroviny na ${String(Math.round(total * 100) / 100).replace('.', ',')} porce${dish ? ` (${Object.values(dish.boxes).reduce((a, n) => a + n, 0)} krabiček)` : ''}`),
      h('span', { class: 'num muted', style: 'font-size:12px' }, `1 porce = ${fmtKcal(m.kcal)} kcal · ${m.p} g B`),
    ),
    h('div', { class: 'stack', style: 'gap:0' }, ...r.items.map(ingLine)),
    r.pantry?.length ? h('p', { class: 'muted', style: 'font-size:12px;margin:0' }, `Ze spíže: ${r.pantry.join(', ')}.`) : null,
    per.length ? h('div', { class: 'stack', style: 'gap:4px' },
      h('span', { class: 'label' }, 'Porcování do krabiček'),
      ...per.map((p) => {
        const main = r.items.slice(0, 2).map((it) => `${fmtG(it.grams * p.factor)} ${(foodById(it.foodId, custom)?.name ?? it.foodId).toLowerCase().split(' (')[0]}`).join(', ');
        return h('div', { class: 'row between', style: 'align-items:flex-start' },
          h('span', { class: `person-chip person-${p.userId}` }, `${p.name} · ${p.boxes}×`),
          h('span', { class: 'small', style: 'text-align:right' }, `${fmtPortion(p.factor)} porce ≈ ${main} · ${fmtKcal(p.kcal)} kcal · ${p.p} g B`),
        );
      }),
    ) : null,
    h('span', { class: 'label' }, 'Postup'),
    h('ol', { class: 'steps' }, ...r.steps.map((s) => h('li', { class: 'small' }, s))),
    h('p', { class: 'muted', style: 'font-size:12px;margin:0' },
      `Skladování: v lednici ${r.fridgeDays} ${r.fridgeDays === 1 ? 'den' : r.fridgeDays < 5 ? 'dny' : 'dní'}${r.freezer ? ', dá se zamrazit (rozmraz přes noc v lednici)' : ', nemrazit'}. Krabičky nech před zavřením vychladnout. Maso navíc zavakuuj a zamraz — rozmrazené vydrží 2 dny.`),
  );
}

function openSwapDishModal(c, plan, s, d) {
  const inPlan = new Set(plan.sessions.flatMap((x) => x.dishes.map((y) => y.recipeId)));
  const options = allRecipes().filter((r) => r.kind === 'hlavni' && !inPlan.has(r.id))
    .map((r) => ({ r, disc: mealDiscountShare({ items: r.items }, c.discounted), ok: r.fridgeDays >= s.coversDays.length || r.freezer }))
    .sort((a, b) => (b.ok - a.ok) || (b.disc - a.disc) || a.r.name.localeCompare(b.r.name, 'cs'));
  const { close } = openModal(
    h('h3', {}, 'Vyměnit jídlo'),
    h('p', { class: 'muted small' }, `Místo „${findRecipe(d.recipeId)?.name}“. Krabičky zůstanou, porce a nákup se přepočítají.`),
    h('div', { class: 'stack', style: 'gap:0;max-height:52vh;overflow:auto' },
      ...options.map(({ r, disc, ok }) => h('button', {
        class: `history-row ${recipeColorClass(r)}`,
        onClick: () => {
          Household.mutate((hh) => { swapDish(hh.cook[plan.weekStart], s.id, d.recipeId, r.id, c.members, c.customRecipes, c.customFoods); });
          close();
          toast(`Vyměněno za ${r.name}.`);
        },
      },
        recipeThumb(r, 'small'),
        h('span', { class: 'grow', style: 'text-align:left' },
          h('div', { style: 'font-size:14.5px' }, r.name),
          h('div', { class: 'muted', style: 'font-size:12px' }, `${PROTEIN_LABEL[r.protein] ?? r.protein} · ${r.prepMin + r.cookMin} min · lednice ${r.fridgeDays} d${r.freezer ? ' · mrazák' : ''}${ok ? '' : ' · nevydrží celé období'}`),
        ),
        disc >= 0.3 ? h('span', { class: 'badge accent', style: 'flex:none' }, 'v akci') : null,

}

// ---------- NÁKUP ----------

function viewShopping(state, c) {
  const hhPlan = c.cookPlan;
  const groups = hhPlan
    ? householdShoppingList(hhPlan, c.customRecipes, c.customFoods, c.discounted)
    : (c.plan ? shoppingList(c.plan, c.meals, c.customFoods, c.discounted) : null);
  if (!groups) {
    return [h('div', { class: 'card stack' },
      h('div', { class: 'label' }, 'Nákupní seznam'),
      h('p', { class: 'small', style: 'margin:0' }, 'Nákup vzniká z plánu vaření — ten ještě není.'),
      h('button', { class: 'btn primary big', onClick: () => { sub = 'vareni'; Store.onChange?.(); } }, 'Naplánovat vaření'),
    )];
  }
  const weekKey = hhPlan ? c.cookWeek : c.weekStart;
  const all = groups.flatMap((g) => g.items);
  const bought = hhPlan ? (Household.state.bought[weekKey]?.items ?? {}) : (c.food.bought[weekKey] ?? {});
  const inAkce = all.filter((i) => i.discount).length;
  const done = all.filter((i) => bought[i.foodId]).length;
  const toggle = (foodId) => {
    if (hhPlan) Household.mutate((hh) => { const b = (hh.bought[weekKey] ??= { updatedAt: null, items: {} }); b.items[foodId] = !b.items[foodId]; b.updatedAt = new Date().toISOString(); });
    else Store.mutate((s) => { const b = (s.food.bought[weekKey] ??= {}); b[foodId] = !b[foodId]; }, { markDirty: false });
  };
  const clearAll = () => {
    if (hhPlan) Household.mutate((hh) => { hh.bought[weekKey] = { updatedAt: new Date().toISOString(), items: {} }; });
    else Store.mutate((s) => { s.food.bought[weekKey] = {}; });
  };
  const out = [];
  out.push(h('div', { class: 'card stack' },
    h('div', { class: 'row between' },
      h('div', { class: 'label' }, `Nákup na týden od ${fmtDate(weekKey)}`),
      h('span', { class: 'num muted small' }, `${done} / ${all.length}`),
    ),
    h('div', { class: 'muted', style: 'font-size:12.5px' },
      `${all.length} položek, ${inAkce ? `${inAkce} v akci v Lidlu` : 'nic z toho teď není v akci'}. ${hhPlan ? 'Sečteno z obou vaření, snídaní a svačin pro oba, zaokrouhleno na balení. Odškrtnuté se sdílí mezi telefony.' : 'Množství je sečtené z celého týdne a zaokrouhlené na balení.'}`),
    h('div', { class: 'row' },
      h('button', { class: 'btn grow', onClick: () => copyList(groups, weekKey) }, 'Kopírovat seznam'),
      done ? h('button', { class: 'btn ghost', onClick: clearAll }, 'Odškrtnout vše') : null,
    ),
  ));
  for (const g of groups) {
    out.push(h('div', { class: `card stack cat-${g.cat}`, style: 'gap:2px' },
      h('div', { class: 'label cat-label', style: 'margin-bottom:4px' }, g.label),
      ...g.items.map((it) => {
        const on = !!bought[it.foodId];
        return h('button', { class: `shop-row${on ? ' done' : ''}`, onClick: () => toggle(it.foodId) },
          h('span', { class: `shop-check${on ? ' on' : ''}` }, on ? '✓' : ''),
          h('span', { class: 'grow', style: 'text-align:left;min-width:0' },
            h('div', { class: 'shop-name' }, it.name),
            h('div', { class: 'shop-qty' }, h('b', {}, `Kup ${buyText(it)}`), h('span', { class: 'muted' }, ` · spotřeba ${fmtGrams(it.grams)}`)),
            it.uses?.length ? h('div', { class: 'muted', style: 'font-size:11.5px' }, `do: ${it.uses.slice(0, 3).join(', ')}${it.uses.length > 3 ? '…' : ''}`) : null,
            it.discount ? h('div', { class: 'shop-deal' }, dealText(it.discount)) : null,
          ),
        );
      }),
    ));
  }
  return out;
}

// „Kup 2× 500 g“ / „Kup 7 ks“ — hlavní údaj nákupu. Spotřeba v gramech je vedlejší.
function buyText(it) { return it.pieces ? `${it.pieces} ks` : `${it.packs}× ${it.packLabel}`; }
function fmtGrams(g) { return g >= 1000 ? `${(g / 1000).toFixed(g % 1000 ? 1 : 0).replace('.', ',')} kg` : `${Math.round(g)} g`; }
function fmtPrice(p) { return p == null ? 'akce' : `${Number(p).toFixed(2).replace('.', ',')} Kč`; }

// Akce vždy s množstvím: „5 kg za 189,90 Kč“ — bez toho vypadala pětikilová rýže jako kilová.
function dealText(d) {
  const qty = d.qty ? `${String(d.qty).replace('.', ',')} za ${fmtPrice(d.price)}` : fmtPrice(d.price);
  return `Akce: ${qty}${d.validTo ? ` · do ${fmtDate(d.validTo)}` : ''}`;
}

async function copyList(groups, weekKey) {
  const lines = [`Nákup Fitko — týden od ${fmtDate(weekKey)}`];
  for (const g of groups) {
    lines.push('', g.label.toUpperCase());
    for (const it of g.items) lines.push(`- ${it.name}: ${buyText(it)} (spotřeba ${fmtGrams(it.grams)})${it.discount ? ` — ${dealText(it.discount)}` : ''}`);
  }
  try { await navigator.clipboard.writeText(lines.join('\n')); toast('Seznam zkopírován.'); } catch { toast('Kopírování nejde — otevři seznam v appce.'); }
}

// ---------- RECEPTY ----------

const KIND_LABELS = { hlavni: 'Hlavní jídla do krabiček', snidane: 'Snídaně', svacina: 'Svačiny' };

function viewRecipes(state, c) {
  const out = [];
  const excluded = new Set(Household.state.prefs?.excludedRecipes ?? []);
  const recipes = allRecipes();
  out.push(h('p', { class: 'muted', style: 'font-size:12.5px;margin:0' },
    `${recipes.length} receptů. Ťukni pro postup a suroviny; dlouhým podržením nic — vyřadit z plánování jde tlačítkem v receptu. Vyřazené: ${excluded.size}.`));
  for (const kind of ['hlavni', 'snidane', 'svacina']) {
    const list = recipes.filter((r) => r.kind === kind).sort((a, b) => a.name.localeCompare(b.name, 'cs'));
    if (!list.length) continue;
    out.push(h('div', { class: 'card stack', style: 'gap:0' },
      h('div', { class: 'label', style: 'margin-bottom:6px' }, KIND_LABELS[kind]),
      ...list.map((r) => {
        const m = recipeMacros(r, c.customFoods);
        const disc = mealDiscountShare({ items: r.items }, c.discounted);
        return h('button', { class: `history-row ${recipeColorClass(r)}${excluded.has(r.id) ? ' excluded' : ''}`, onClick: () => openRecipeLibraryModal(r, c) },
          recipeThumb(r, 'small'),
          h('span', { class: 'grow', style: 'text-align:left' },
            h('div', { style: 'font-size:14.5px' }, r.name),
            h('div', { class: 'muted', style: 'font-size:12px' }, `${fmtKcal(m.kcal)} kcal · ${m.p} g B · ${r.prepMin + r.cookMin} min · lednice ${r.fridgeDays} d${r.freezer ? ' · mrazák' : ''}${r.custom ? ' · vlastní' : ''}`),
          ),
          disc >= 0.3 ? h('span', { class: 'badge accent', style: 'flex:none' }, 'v akci') : null,
        );
      }),
    ));
  }
  // vlastní jídla (bez receptu) — starý editor
  const custom = c.meals.filter((m) => !m.recipeId);
  out.push(h('div', { class: 'card stack' },
    h('div', { class: 'row between' },
      h('div', { class: 'label' }, 'Vlastní jídla'),
      h('button', { class: 'btn small', onClick: () => openMealEditor(c, null) }, '+ Nové'),
    ),
    custom.length
      ? h('div', { class: 'stack', style: 'gap:0' }, ...custom.sort((a, b) => a.name.localeCompare(b.name, 'cs')).map((m) => {
          const mm = roundMacros(mealMacros(m, c.customFoods));
          return h('button', { class: 'history-row', onClick: () => openMealEditor(c, m) },
            h('span', { class: 'grow', style: 'text-align:left' },
              h('div', {}, m.name),
              h('div', { class: 'muted', style: 'font-size:12px' }, `${slotKindLabel(m.slot)} · ${fmtKcal(mm.kcal)} kcal · ${mm.p} g B`),
            ),
          );
        }))
      : h('p', { class: 'muted', style: 'font-size:12.5px;margin:0' }, 'Jídlo bez receptu (jen potraviny v gramech) — hodí se na věci, které jíš mimo plán a chceš je mít v Dnes.'),
  ));
  return out;
}

function openRecipeLibraryModal(r, c) {
  const excluded = new Set(Household.state.prefs?.excludedRecipes ?? []);
  const isEx = excluded.has(r.id);
  openRecipeModal(r, { portions: 1 });
  const modal = document.querySelector('.modal-backdrop:last-of-type .modal');
  if (!modal) return;
  modal.append(h('button', {
    class: `btn ${isEx ? 'primary' : 'ghost'}`,
    onClick: () => {
      Household.mutate((hh) => {
        hh.prefs ??= {};
        const list = new Set(hh.prefs.excludedRecipes ?? []);
        if (isEx) list.delete(r.id); else list.add(r.id);
        hh.prefs.excludedRecipes = [...list];
        hh.prefs.updatedAt = new Date().toISOString();
      });
      document.querySelector('.modal-backdrop:last-of-type')?.remove();
      toast(isEx ? 'Recept se zase plánuje.' : 'Recept se nebude plánovat.');
    },
  }, isEx ? 'Zase plánovat' : 'Neplánovat tenhle recept'));
}

function openMealEditor(c, existing) {
  const draft = existing
    ? { id: existing.id, name: existing.name, slot: existing.slot ?? null, items: existing.items.map((it) => ({ ...it })) }
    : { id: `m_${Date.now().toString(36)}`, name: '', slot: null, items: [] };

  const nameIn = h('input', { type: 'text', placeholder: 'název jídla', value: draft.name });
  const slotRow = h('div', { class: 'row', style: 'gap:6px;flex-wrap:wrap' });
  const itemsBox = h('div', { class: 'stack', style: 'gap:6px' });
  const footer = h('div', { class: 'num small', style: 'font-weight:600' });

  const custom = () => Store.state.food.customFoods;
  const refresh = () => {
    clearEl(slotRow);
    for (const k of SLOT_KINDS) slotRow.append(h('button', { class: `chip${draft.slot === k.id ? ' active' : ''}`, onClick: () => { draft.slot = k.id; refresh(); } }, k.label));
    clearEl(itemsBox);
    draft.items.forEach((it, i) => {
      const f = foodById(it.foodId, custom());
      const gIn = numericField(h('input', { class: 'num set-input', type: 'text', inputmode: 'numeric', value: fmtInput(it.grams), style: 'width:74px' }), { decimals: false });
      gIn.addEventListener('input', () => { it.grams = parseNum(gIn.value) ?? 0; updateFooter(); });
      itemsBox.append(h('div', { class: 'ing-row' },
        h('span', { class: 'grow' },
          h('div', {}, f?.name ?? it.foodId),
          h('div', { class: 'muted', style: 'font-size:11.5px' }, f ? `${f.kcal} kcal · ${f.p} g B na 100 g${f.pieceG ? ` · 1 ks ≈ ${f.pieceG} g` : ''}` : 'neznámá potravina'),
        ),
        gIn, h('span', { class: 'muted small' }, 'g'),
        h('button', { class: 'icon-btn', 'aria-label': 'Odebrat', onClick: () => { draft.items.splice(i, 1); refresh(); } }, '×'),
      ));
    });
    updateFooter();
  };
  const updateFooter = () => {
    const m = roundMacros(mealMacros(draft, custom()));
    footer.textContent = draft.items.length ? `Porce: ${fmtKcal(m.kcal)} kcal · ${m.p} g bílkovin · ${m.c} g sacharidů · ${m.f} g tuků` : 'Přidej potraviny — makra se spočítají hned.';
  };
  refresh();

  const { close } = openModal(
    h('h3', {}, existing ? 'Upravit jídlo' : 'Nové jídlo'),
    nameIn,
    slotRow,
    itemsBox,
    h('button', { class: 'btn', onClick: () => openFoodSearch(c, (food) => { draft.items.push({ foodId: food.id, grams: food.pieceG ?? 100 }); refresh(); }) }, '+ Přidat potravinu'),
    footer,
    h('div', { class: 'row', style: 'margin-top:4px' },
      existing ? h('button', {
        class: 'btn danger',
        onClick: () => { Store.mutate((s) => { s.food.meals = s.food.meals.filter((m) => m.id !== existing.id); cleanupPlan(s); }); close(); },
      }, 'Smazat') : h('button', { class: 'btn ghost', onClick: () => close() }, 'Zrušit'),
      h('button', {
        class: 'btn primary grow',
        onClick: () => {
          draft.name = nameIn.value.trim();
          if (!draft.name) { toast('Dej jídlu název.'); return; }
          draft.items = draft.items.filter((it) => it.grams > 0);
          if (!draft.items.length) { toast('Přidej aspoň jednu potravinu.'); return; }
          Store.mutate((s) => {
            const i = s.food.meals.findIndex((m) => m.id === draft.id);
            const saved = { id: draft.id, name: draft.name, slot: draft.slot, items: draft.items };
            if (i >= 0) s.food.meals[i] = saved; else s.food.meals.push(saved);
            for (const iso of Object.keys(s.food.plan?.days ?? {})) recomputeDay(s, iso);
          });
          close();
        },
      }, 'Uložit'),
    ),
  );
}

// smazané jídlo nesmí zůstat v plánu
function cleanupPlan(s) {
  const ids = new Set(s.food.meals.map((m) => m.id));
  for (const [iso, day] of Object.entries(s.food.plan?.days ?? {})) {
    for (const [sid, e] of Object.entries(day)) if (!ids.has(e.mealId)) delete day[sid];
    recomputeDay(s, iso);
  }
}

function openFoodSearch(c, onPick) {
  const input = h('input', { type: 'text', placeholder: 'hledej potravinu (kuřecí, skyr, rýže…)', autocomplete: 'off' });
  const results = h('div', { class: 'stack', style: 'gap:0;max-height:46vh;overflow:auto' });
  const status = h('div', { class: 'muted', style: 'font-size:12px' });
  let offBusy = false;

  const row = (f, sourceLabel) => h('button', { class: 'history-row', onClick: () => { onPick(f); close(); } },
    h('span', { class: 'grow', style: 'text-align:left' },
      h('div', {}, f.name),
      h('div', { class: 'muted', style: 'font-size:11.5px' }, `${f.kcal} kcal · ${f.p} g B · ${f.c} g S · ${f.f} g T na 100 g${sourceLabel ? ` · ${sourceLabel}` : ''}`),
    ),
  );

  const renderLocal = () => {
    clearEl(results);
    const q = input.value.trim();
    const found = searchFoods(q, Store.state.food.customFoods, 14);
    for (const f of found) results.append(row(f, f.source === 'off' ? 'Open Food Facts' : null));
    status.textContent = q && !found.length ? 'Nic ve vestavěných — zkus Open Food Facts (etikety výrobků včetně Lidlu).' : q ? '' : 'Vestavěných potravin je 90+, hledá se bez diakritiky.';
    if (q.length >= 3) results.append(h('button', { class: 'btn ghost', style: 'margin-top:8px', onClick: searchOff }, offBusy ? 'Hledám…' : 'Hledat v Open Food Facts'));
  };

  const searchOff = async () => {
    const q = input.value.trim();
    if (q.length < 3 || offBusy) return;
    offBusy = true; renderLocal(); status.textContent = 'Hledám v Open Food Facts…';
    try {
      const url = (host) => `https://${host}/cgi/search.pl?search_terms=${encodeURIComponent(q)}&search_simple=1&action=process&json=1&page_size=12&fields=code,product_name,brands,quantity,nutriments`;
      let res = await fetch(url('cz.openfoodfacts.org'));
      let data = res.ok ? await res.json() : null;
      if (!data?.products?.length) { res = await fetch(url('world.openfoodfacts.org')); data = res.ok ? await res.json() : null; }
      const foods = (data?.products ?? []).map(foodFromOpenFoodFacts).filter(Boolean);
      clearEl(results);
      if (!foods.length) { status.textContent = 'Open Food Facts nic nenašel (nebo je zrovna nedostupný). Přidej potravinu ručně.'; }
      else { status.textContent = `${foods.length} výsledků z Open Food Facts — hodnoty z etiket, ověř si je.`; }
      for (const f of foods) results.append(row(f, 'OFF'));
      results.append(h('button', { class: 'btn ghost', style: 'margin-top:8px', onClick: () => openManualFood(onPick, close, q) }, 'Přidat ručně'));
    } catch {
      status.textContent = 'Open Food Facts teď neodpovídá. Přidej potravinu ručně.';
      results.append(h('button', { class: 'btn ghost', style: 'margin-top:8px', onClick: () => openManualFood(onPick, close, input.value.trim()) }, 'Přidat ručně'));
    } finally { offBusy = false; }
  };

  input.addEventListener('input', renderLocal);
  const { close } = openModal(h('h3', {}, 'Potravina'), input, status, results,
    h('button', { class: 'btn ghost small', onClick: () => openManualFood(onPick, close, input.value.trim()) }, 'Zadat ručně z etikety'));
  renderLocal();
  setTimeout(() => input.focus(), 50);

  // vybraná OFF potravina se uloží mezi vlastní, ať jde příště najít offline
  const origPick = onPick;
  onPick = (f) => {
    if (f.source === 'off' || f.source === 'manual') {
      Store.mutate((s) => { if (!s.food.customFoods.some((x) => x.id === f.id)) s.food.customFoods.push(f); }, { rerender: false });
    }
    origPick(f);
  };
}

function openManualFood(onPick, closeParent, presetName = '') {
  const nameIn = h('input', { type: 'text', placeholder: 'název', value: presetName });
  const mk = (ph) => numericField(h('input', { class: 'num', type: 'text', inputmode: 'decimal', placeholder: ph }));
  const kcalIn = mk('kcal / 100 g'); const pIn = mk('bílkoviny g'); const cIn = mk('sacharidy g'); const fIn = mk('tuky g');
  const { close } = openModal(
    h('h3', {}, 'Potravina z etikety'),
    h('p', { class: 'small muted' }, 'Hodnoty na 100 g (nebo 100 ml) z výživové tabulky.'),
    nameIn,
    h('div', { class: 'row' }, kcalIn, pIn),
    h('div', { class: 'row' }, cIn, fIn),
    h('button', {
      class: 'btn primary big',
      onClick: () => {
        const name = nameIn.value.trim(); const kcal = parseNum(kcalIn.value);
        if (!name || kcal == null) { toast('Doplň název a kcal.'); return; }
        const food = { id: `man_${Date.now().toString(36)}`, name, cat: 'ostatni', kcal: Math.round(kcal), p: parseNum(pIn.value) ?? 0, c: parseNum(cIn.value) ?? 0, f: parseNum(fIn.value) ?? 0, packG: 500, source: 'manual' };
        Store.mutate((s) => { s.food.customFoods.push(food); }, { rerender: false });
        close(); closeParent?.(); onPick(food);
      },
    }, 'Uložit potravinu'),
  );
}

function viewDiscounts(state, c) {
  const feed = c.feed;
  const out = [];
  const age = feedAgeDays(feed);
  if (!feed) {
    out.push(h('div', { class: 'card stack' },
      h('div', { class: 'label' }, 'Akce v Lidlu'),
      h('p', { class: 'small', style: 'margin:0' }, 'Akční potraviny se stahují 2× týdně (pondělí a čtvrtek, kdy Lidl mění leták) z kupi.cz přes GitHub — appka sama nikam neleze. První stažení proběhne po nasazení; zatím tu nic není.'),
      akceInfo.lastError ? h('p', { class: 'muted', style: 'font-size:12px;margin:0' }, `Stav: ${akceInfo.lastError}`) : null,
    ));
    return out;
  }
  const items = validDiscountItems(feed, c.today);
  const matchedIds = new Set(Object.keys(c.discounted));
  const matched = Object.entries(c.discounted).map(([foodId, it]) => ({ ...it, foodId, foodName: foodById(foodId, c.customFoods)?.name }));
  const rest = items.filter((it) => !matched.some((m) => m.name === it.name)).slice(0, 80);

  out.push(h('div', { class: 'card stack' },
    h('div', { class: 'row between' },
      h('div', { class: 'label' }, `Lidl · ${items.length} akčních potravin`),
      h('span', { class: `badge ${age != null && age > 5 ? 'warn' : 'plain'}` }, age == null ? '—' : age === 0 ? 'dnes' : age === 1 ? 'včera' : `před ${age} dny`),
    ),
    h('p', { class: 'muted', style: 'font-size:12.5px;margin:0' },
      `${matched.length} z nich odpovídá potravinám v tvých jídlech. Plánovač je při skládání týdne upřednostní.`),
    h('button', { class: 'btn primary', onClick: () => { makePlan(c); sub = 'vareni'; scrollTop(0); Store.onChange?.(); } }, 'Naplánovat vaření z akcí'),
  ));
  if (matched.length) {
    out.push(h('div', { class: 'card stack', style: 'gap:0' },
      h('div', { class: 'label', style: 'margin-bottom:6px' }, 'Hodí se do tvých jídel'),
      ...matched.sort((a, b) => (a.foodName ?? '').localeCompare(b.foodName ?? '', 'cs')).map((it) => discountRow(it, it.foodName)),
    ));
  }
  if (rest.length) {
    out.push(h('div', { class: 'card stack', style: 'gap:0' },
      h('div', { class: 'label', style: 'margin-bottom:6px' }, 'Ostatní potraviny v akci'),
      ...rest.map((it) => discountRow(it, null)),
    ));
  }
  return out;
}

function discountRow(it, foodName) {

    h('span', { class: 'grow' },

// Důvod úpravy kalorií srozumitelně — podle fáze (v hubnutí znamená „too_slow“
// rychlejší pokles, než je pásmo, protože pásmo je záporné).
function adjustReasonText(reason, phase) {
  const losing = phase === 'cut' || phase === 'minicut';
  const keeping = phase === 'maintain';
  const map = {
    too_slow: losing ? 'hubneš rychleji, než je zdrávo → přidáno' : keeping ? 'váha klesala → přidáno' : 'váha rostla pomalu → přidáno',
    too_fast: losing ? 'hubneš pomaleji, než má → ubráno' : keeping ? 'váha rostla → ubráno' : 'váha rostla rychle → ubráno',
    on_track: 'tempo v pásmu',
    minicut_start: 'start mini-cutu',
    bulk_resume: 'návrat do bulku',
    goal_reached: 'cíl dosažen → udržování',
    goal_changed: 'nový cíl → přepočet',
  };
  return map[reason] ?? reason;
}

      t.phase === 'cut'
        ? `Kalorie koriguje engine sám podle 14denního trendu váhy (±100–150 kcal/týden), nikdy pod ${floor} kcal (tvůj bazální metabolismus). Bílkoviny 2 g/kg drží svaly.`
        : t.phase === 'maintain'
          ? 'Udržování: kalorie se hýbou jen, když váha vyjede z pásma ±0,15 % týdně. Bílkoviny 1,8 g/kg.'
          : 'Kalorie koriguje engine sám podle 14denního trendu váhy (±100–150 kcal/týden). K tomu kreatin 3–5 g denně.'),
    log.length ? h('div', { class: 'stack', style: 'gap:4px' },

  const on = cloudEnabled();
  const last = state.sessions.at(-1);
  let tokenInput;

  return h('div', { class: 'card stack' },
    h('div', { class: 'row between' },
      h('div', { class: 'label' }, 'Záloha a data'),
      h('span', { class: `badge ${on ? 'ok' : 'warn'}` }, on ? 'zálohuje se samo' : 'jen v telefonu'),
    ),
    h('div', { class: 'row between' },
      h('span', { class: 'small muted' }, 'Uložené tréninky'),
      h('span', { class: 'num small', style: 'font-weight:600' },
        last ? `${plural(state.sessions.length)} · poslední ${fmtDate(last.date)}` : 'zatím žádný'),
    ),

    on
      // ZAPNUTO: stav + jedno hlavní tlačítko, zbytek drobně
      ? h('div', { class: 'stack', style: 'gap:8px' },
          h('div', { class: 'row between' },
            h('span', { class: 'small muted' }, 'Poslední záloha na GitHub'),
            h('span', { class: 'num small', style: 'font-weight:600' },
              cloudInfo.lastSync
                ? `${fmtDate(cloudInfo.lastSync.slice(0, 10))} ${cloudInfo.lastSync.slice(11, 16)}`
                : 'čeká na první změnu'),
          ),
          h('div', { class: 'row between' },
            h('span', { class: 'small muted' }, 'Domácnost (vaření, nákup)'),
            h('span', { class: `num small ${Household.lastError ? 'bad-text' : ''}`, style: 'font-weight:600' },
              Household.lastError ? 'chyba' : Household.dirty ? 'čeká na odeslání' : Household.lastSync ? `${fmtDate(Household.lastSync.slice(0, 10))} ${Household.lastSync.slice(11, 16)}` : '—'),
          ),
          cloudInfo.lastError
            ? h('p', { class: 'bad-text', style: 'font-size:12.5px' }, `Chyba: ${cloudInfo.lastError}`)
            : h('p', { class: 'muted', style: 'font-size:12.5px' },
                `Ukládá se samo po každém zápisu do souboru ${backupFile()}. Na druhém telefonu stačí stejný token — každý má svou zálohu, jídlo a nákup jsou společné.`),
          h('button', {
            class: 'btn primary',
            onClick: async () => {
              toast('Stahuji zálohu…');
              const r = await cloudRestore();
              if (!r.ok) { toast(`Nepovedlo se: ${r.reason}`); return; }
              const { close } = openModal(
                h('h3', {}, 'Obnovit ze zálohy?'),
                h('p', { class: 'small' },
                  `Záloha obsahuje ${plural(r.state.sessions.length)}. Nahradí data v tomhle telefonu.`),
                h('div', { class: 'row' },
                  h('button', {
                    class: 'btn primary grow',
                    onClick: () => {
                      Store.init(r.state);
                      Store.mutate(() => {}, { publish: true, force: true });
                      close();
                      toast('Data obnovena.');
                    },
                  }, 'Obnovit'),
                  h('button', { class: 'btn grow', onClick: () => close() }, 'Zpět'),
                ),
              );
            },
          }, 'Obnovit data z GitHubu'),
        )
      // VYPNUTO: jedno pole a jedno tlačítko
      : h('div', { class: 'stack', style: 'gap:8px' },
          h('p', { class: 'muted', style: 'font-size:12.5px' },
            'Zapni a appka po každém zápisu sama uloží tréninky do privátního gistu. '
            + 'Token si vyrob na github.com/settings/tokens (classic) s právem „gist" — '
            + 'zůstane jen v telefonu. Na druhém telefonu vlož ten samý: každý má vlastní zálohu, jídlo a nákup jsou společné.'),
          tokenInput = h('input', {
            type: 'text', placeholder: 'ghp_… (vlož token)',
            autocapitalize: 'off', autocorrect: 'off', spellcheck: false,
          }),
          h('button', {
            class: 'btn primary',
            onClick: async () => {
              const t = tokenInput.value.trim();
              if (t.length < 20) { toast('Token vypadá krátký.'); return; }
              setCloudToken(t);
              toast('Hledám zálohu na GitHubu…');
              const found = await adoptExistingBackup();
              if (!found.ok) { toast(`Nepovedlo se: ${found.reason}`); disableCloud(); Store.onChange?.(); return; }
              const mine = Store.state.sessions?.length ?? 0;
              if (found.found && found.sessions > mine) {
                const { close } = openModal(
                  h('h3', {}, 'Na GitHubu už záloha je'),
                  h('p', { class: 'small' },
                    `Našel jsem ${plural(found.sessions)}, v telefonu máš ${plural(mine)}.`),
                  h('button', {
                    class: 'btn primary big',
                    onClick: async () => {
                      const r = await cloudRestore();
                      if (r.ok) {
                        Store.init(r.state);
                        Store.mutate(() => {}, { publish: true, force: true });
                        toast('Data ze zálohy stažena.');
                      } else toast(`Nepovedlo se: ${r.reason}`);
                      close();
                    },
                  }, 'Stáhnout zálohu do telefonu'),
                  h('button', {
                    class: 'btn danger',
                    onClick: async () => {
                      await flushCloudBackup(Store.state);
                      close();
                      toast('Záloha přepsána daty z telefonu.');
                      Store.onChange?.();
                    },
                  }, 'Přepsat ji daty z telefonu'),
                );
                Store.onChange?.();
                return;
              }
              const r = await flushCloudBackup(Store.state);
              if (!r.ok && !String(r.reason).includes('prázdný')) {
                toast(`Nepovedlo se: ${r.reason}`);
                disableCloud();
              } else toast('Hotovo — od teď se zálohuje samo.');
              Store.onChange?.();
            },
          }, 'Zapnout automatickou zálohu'),
        ),

    // vše ostatní schované pod jedním odkazem, ať karta nekřičí
    h('button', {
      class: 'btn ghost small',
      style: 'align-self:flex-start',
      onClick: () => moreDataModal(state),
    }, 'Další možnosti se zálohou'),
  );
}

      h('button', {

  return h('button', {

// ---------- data ----------

function plural(n) {
  return `${n} ${n === 1 ? 'trénink' : n < 5 ? 'tréninky' : 'tréninků'}`;
}

// Záchrana: ukáže všechny nalezené záznamy Fitka v zařízení a nabídne obnovu.
function recoveryModal() {
  const found = scanStoredStates();
  const usable = found.filter((f) => f.readable && f.sessions > 0);
  openModal(
    h('h3', {}, 'Co je uložené v tomhle zařízení'),
    found.length
      ? h('div', { class: 'stack', style: 'gap:8px' },
          ...found.map((f) => h('div', { class: 'row between' },
            h('div', { class: 'grow' },
              h('div', { class: 'small', style: 'font-weight:600' },
                f.key === stateKey() ? 'Hlavní data'
                  : f.key === backupKey() ? 'Automatická záloha'
                  : f.key.startsWith('fitko-state-damaged') ? 'Poškozený zápis'
                  : /^fitko-state(-backup)?-v1(-\w+)?$/.test(f.key) ? `Data: ${f.key.replace(/^fitko-state(-backup)?-v1-?/, '') || 'Niklas'}` : f.key),
              h('div', { class: 'muted', style: 'font-size:12px' },
                f.readable
                  ? `${plural(f.sessions)}${f.lastDate ? ` · poslední ${fmtDate(f.lastDate)}` : ''} · ${f.sizeKb} kB`
                  : `nečitelné · ${f.sizeKb} kB`),
            ),
            f.readable && f.sessions > 0
              ? h('button', {
                  class: 'btn small',
                  onClick: () => {
                    Store.init(f.state);
                    Store.mutate(() => {}, { publish: true, force: true });
                    toast(`Obnoveno ${plural(f.sessions)}.`);
                  },
                }, 'Obnovit')
              : null,
          )),
          usable.length ? null : h('p', { class: 'muted small' },
            'Žádný záznam s odcvičenými tréninky. Zkus appku otevřít tam, kde jsi ji používal '
            + '(ikona na ploše vs. Safari) — každé prostředí má vlastní paměť.'),
        )
      : h('p', { class: 'muted small' }, 'V tomhle prostředí není uloženo nic.'),
    h('div', { class: 'row between' },
      h('span', { class: 'small muted' }, 'Trvalé úložiště povoleno'),
      h('span', { class: `badge ${storageInfo.persisted ? 'ok' : 'warn'}` },
        storageInfo.persisted === null ? 'zjišťuji…' : storageInfo.persisted ? 'ano' : 'ne'),
    ),
  );
}

// ===== src/app/main.js =====
// Bootstrap a router. Pořadí při startu je důležité: snímek dokumentu se bere
// PŘED prvním renderem (je šablonou pro samo-publikaci artifactu).















let currentTab = 'today';

const TABS = [
  { id: 'today', label: 'Dnes', icon: 'today', render: renderToday },
  { id: 'food', label: 'Jídlo', icon: 'food', render: renderFood },
  { id: 'progress', label: 'Progres', icon: 'progress', render: renderProgress },
  { id: 'settings', label: 'Nastavení', icon: 'settings', render: renderSettings },
];

// Obsah roluje uvnitř #app (ne celé okno) — viz komentář u rozvržení v CSS.
function scrollTop(y = 0) {
  const root = document.getElementById('app');
  if (root) root.scrollTop = y;
}

// Lišta vzniká jen jednou a žije v #dock; překreslení jen přepne aktivní záložku.
// (Mazat a znovu vytvářet ji při každé změně stavu bylo přesně to, co ji na iOS
// nechávalo viset uprostřed obrazovky po zavření klávesnice.)
function ensureTabbar(visible) {
  const dock = document.getElementById('dock');
  let bar = dock.querySelector('.tabbar');
  if (!bar) {
    bar = h('nav', { class: 'tabbar' },
      h('div', { class: 'tabbar-inner' },
        ...TABS.map((t) => h('button', {
          class: 'tab', dataset: { tab: t.id }, 'aria-label': t.label,
          onClick: () => goTab(t.id),
        }, icon(t.icon), t.label)),
      ),
    );
    dock.append(bar);
  }
  bar.hidden = !visible;
  for (const btn of bar.querySelectorAll('.tab')) btn.classList.toggle('active', btn.dataset.tab === currentTab);
}

function goTab(id) {
  if (!TABS.some((t) => t.id === id)) return;
  try { document.activeElement?.blur?.(); } catch { /* noop */ }
  currentTab = id;
  scrollTop(0);
  render();
}

let lastMode = null; // who | onboarding | workout | tabs — při změně režimu se roluje nahoru

function render() {
  const root = document.getElementById('app');
  const state = Store.state;
  const mode = !currentUser() ? 'who' : !state.onboarded ? 'onboarding' : state.activeWorkout ? 'workout' : 'tabs';
  const scrollY = mode === lastMode ? root.scrollTop : 0;
  lastMode = mode;

  if (mode === 'who') {
    ensureTabbar(false);
    renderWho(root);
    return;
  }

  if (mode === 'onboarding') {
    ensureTabbar(false);
    renderOnboarding(root);
    return;
  }

  if (mode === 'workout') {
    ensureTabbar(false);
    renderWorkout(root);
    requestAnimationFrame(() => scrollTop(scrollY));
    return;
  }

  RestTimer.stop();
  if (currentTab === 'food') refreshDiscountFeed(); // hned po onboardingu i po dlouhé době v pozadí
  const tab = TABS.find((t) => t.id === currentTab) ?? TABS[0];
  tab.render(root);
  ensureTabbar(true);
  requestAnimationFrame(() => scrollTop(scrollY));
}

// umožní kartám poslat uživatele na jinou záložku (Dnes → Nastavení, Dnes → Jídlo, notifikace → cíl)
window.__fitkoGoTab = goTab;
window.__fitkoGoSettings = () => window.__fitkoGoTab('settings');

// Notifikace otevírá appku s #food / #today / #settings — respektujeme to při startu i za běhu.
function applyHashRoute() {
  const id = (location.hash || '').replace('#', '');
  if (id && TABS.some((t) => t.id === id)) { currentTab = id; history.replaceState(null, '', location.pathname + location.search); return true; }
  return false;
}
window.addEventListener('hashchange', () => { if (applyHashRoute()) { scrollTop(0); render(); } });

// Akce z Lidlu: stáhnout, když jsou uložené starší než pár hodin (bez rerenderu, jen uložit).
function refreshDiscountFeed() {
  const current = Store.state.food?.discounts;
  refreshDiscounts(current).then((feed) => {
    if (!feed) return;
    Store.mutate((s) => { s.food.discounts = feed; }, { rerender: currentTab === 'food', markDirty: false });
  });
}

// Načte data zvoleného uživatele a rozjede appku (po startu i po volbě „Já jsem“).
function startUser() {
  const persisted = loadPersistedState();
  backupState(persisted); // snímek toho, co bylo na disku před spuštěním
  Store.init(persisted);
  Store.onChange = render;

  Store.mutate((s) => dailyMaintenance(s), { rerender: false, publish: false, markDirty: false });

  // po startu zálohuj, ať je v cloudu vždy poslední stav i bez další akce
  if (Store.state.sessions?.length) scheduleCloudBackup(Store.state);

  // Prázdné zařízení + zapnutá záloha = data si stáhneme SAMI, bez ptaní.
  // Přesně tenhle případ (nová verze, vyčištěné úložiště) uživatele nejvíc pálí.
  if (!Store.state.sessions?.length && cloudEnabled()) {
    cloudRestore().then((r) => {
      if (r.ok && r.state?.sessions?.length) {
        Store.init(r.state);
        Store.mutate(() => {}, { force: true, rerender: false });
        render();
        toast(`Data obnovena ze zálohy — ${r.state.sessions.length} tréninků.`);
      }
    });
  }

  if (Store.state.onboarded) refreshDiscountFeed();
  Household.pull({ rerender: true });
  render();
}

// Volba uživatele na novém telefonu. S tokenem se nejdřív zkusí najít jeho záloha.
async function chooseUser(id, token = '') {
  setCurrentUser(id);
  if (token) {
    setCloudToken(token);
    toast('Hledám zálohu na GitHubu…');
    const found = await adoptExistingBackup();
    if (!found.ok) { toast(`Záloha nejde načíst: ${found.reason}`); disableCloud(); }
    else if (found.found) {
      const r = await cloudRestore();
      if (r.ok) {
        Store.init(r.state);
        Store.onChange = render;
        Store.mutate(() => {}, { force: true, rerender: false });
        toast(`Vítej zpátky, ${userInfo(id)?.name}. Data jsou stažená.`);
        startUser();
        return;
      }
    }
  }
  startUser();
}

function boot() {
  captureDocument();
  initCapabilities();

  // trvalé úložiště (instalovaná home-screen appka je přesně heuristika, na kterou to prohlížeče schválí)
  try { navigator.storage?.persist?.(); } catch { /* nepovinné */ }

  // offline režim — jen ve standalone buildu (marker: link rel=manifest)
  if ('serviceWorker' in navigator && document.querySelector('link[rel="manifest"]')) {
    try { navigator.serviceWorker.register('./sw.js'); } catch { /* nepovinné */ }
  }
  initCloud();
  initPush();
  applyHashRoute();
  Household.init();

  document.addEventListener('visibilitychange', () => {
    if (document.hidden || !Store.state?.onboarded) return;
    refreshDiscountFeed();
    Household.pull({ rerender: true });
  });

  // Automatická aktualizace: mimo trénink se přepne sama, v tréninku počká na tebe.
  initUpdater((build, alreadyTried) => {
    // v tréninku a po neúspěšném pokusu nech rozhodnutí na uživateli (karta na Dnes)
    if (Store.state?.activeWorkout || alreadyTried) { render(); return; }
    toast('Instaluji novou verzi…');
    setTimeout(() => applyUpdate(build), 900);
  });

  if (!initUser()) {
    // nový telefon bez volby uživatele → obrazovka „Kdo jsi?“
    Store.init(defaultState());
    Store.onChange = render;
    render();
    return;
  }
  startUser();
}

if (document.readyState === 'loading') {
  document.addEventListener('DOMContentLoaded', boot);
} else {
  boot();
}

})();
</script>
</body>
</html>
