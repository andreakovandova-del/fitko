name: akce-lidl
on:
  schedule:
    - cron: '20 4 * * 1,4'   # pondělí a čtvrtek ráno (Lidl mění leták) — UTC, tj. 06:20 CEST
  workflow_dispatch:
permissions:
  contents: write
concurrency: akce-lidl
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node scripts/akce.mjs
      - name: commit feed
        run: |
          git config user.name "fitko-bot"
          git config user.email "fitko-bot@users.noreply.github.com"
          git add akce-lidl.json
          if git diff --cached --quiet; then echo "beze změny"; else git commit -m "akce: Lidl $(date -u +%F)" && git push; fi
